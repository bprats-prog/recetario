  // ── Ingredient parsing & grouping ────────────────────────────────────────

  // Canonical unit names
  const UNIT_MAP = {
    kg:'kg', kilo:'kg', kilos:'kg', kilogramo:'kg', kilogramos:'kg',
    g:'g', gr:'g', gramo:'g', gramos:'g',
    mg:'mg',
    l:'l', litro:'l', litros:'l',
    ml:'ml', cl:'cl', dl:'dl',
    taza:'taza', tazas:'taza',
    vaso:'vaso', vasos:'vaso',
    cucharada:'cda', cucharadas:'cda', cda:'cda', cdas:'cda', cs:'cda', cc:'cdta',
    'cucharada sopera':'cda', 'cucharadas soperas':'cda',
    cucharadita:'cdta', cucharaditas:'cdta', cdta:'cdta', cdtas:'cdta',
    lata:'lata', latas:'lata',
    bote:'bote', botes:'bote',
    bolsa:'bolsa', bolsas:'bolsa',
    paquete:'paquete', paquetes:'paquete',
    sobre:'sobre', sobres:'sobre',
    rama:'rama', ramas:'rama',
    diente:'diente', dientes:'diente',
    cabeza:'cabeza', cabezas:'cabeza',
    hoja:'hoja', hojas:'hoja',
    rodaja:'rodaja', rodajas:'rodaja',
    filete:'filete', filetes:'filete',
    pieza:'pieza', piezas:'pieza',
    loncha:'loncha', lonchas:'loncha',
    rebanada:'rebanada', rebanadas:'rebanada',
    puñado:'puñado', puñados:'puñado',
  };

  // Units that convert to a common base for summing
  const CONVERT = { kg: { to:'g', factor:1000 }, l: { to:'ml', factor:1000 }, dl: { to:'ml', factor:100 }, cl: { to:'ml', factor:10 } };

  function parseIngredient(raw) {
    if (!raw || !raw.trim()) return null;
    // Viñetas iniciales ("– 1 coliflor", "• 2 huevos")
    const line = raw.trim().replace(/^[\s\-–—•·*]+/, '');
    if (!line) return null;
    let rest = line;
    let qty = null;
    let unit = null;

    // Try to extract a number (integer, decimal, fraction "1/2" or "½", "1 ½")
    const numM = rest.match(/^(\d+(?:[.,]\d+)?(?:\s*\/\s*\d+)?\s*[½¼¾⅓⅔]?|[½¼¾⅓⅔])\s*/);
    if (numM) {
      qty = parseQtyToken(numM[1]);
      if (qty != null) {
        rest = rest.slice(numM[0].length);
        // Rango "3-4", "3 - 4", "3 a 4", "2 o 3": para comprar se usa el máximo
        const rangeM = rest.match(/^(?:-|–|—|a|o)\s*(\d+(?:[.,]\d+)?)\s*/i);
        if (rangeM) {
          const hi = parseFloat(rangeM[1].replace(',', '.'));
          if (!isNaN(hi) && hi >= qty) { qty = hi; rest = rest.slice(rangeM[0].length); }
        }
      }
    }

    // Try to extract a unit (only if we found a number)
    if (qty !== null) {
      // Match known units (longest first to avoid "gr" matching before "gramos")
      const unitKeys = Object.keys(UNIT_MAP).sort((a, b) => b.length - a.length);
      for (const u of unitKeys) {
        const re = new RegExp('^' + u.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b\\s*', 'i');
        if (re.test(rest)) {
          unit = UNIT_MAP[u.toLowerCase()];
          rest = rest.replace(re, '');
          break;
        }
      }
      // Skip leading "de " after unit (y el punto de abreviaturas: "50 g. Mantequilla")
      rest = rest.replace(/^[.:]\s*/, '').replace(/^de\s+/i, '');
    }

    // "1 chorrito de vinagre", "1 pizca sal": cantidad imprecisa -> solo el producto
    const loose = rest.match(/^(?:una |un )?(?:pizcas?|chorrito|chorro|poco|puntita|toque)\s+(?:de\s+)?/i);
    if (loose) { qty = null; unit = null; rest = rest.slice(loose[0].length); }

    // Normalize unit to base (kg→g, l→ml, etc.)
    if (unit && CONVERT[unit]) { const c = CONVERT[unit]; qty = qty * c.factor; unit = c.to; }

    const name = cleanIngredientName(rest) || normalizeName(rest || line);
    return { qty, unit, name, raw: line };
  }

  const FRAC_CHARS = { '½': 0.5, '¼': 0.25, '¾': 0.75, '⅓': 1 / 3, '⅔': 2 / 3 };

  function parseQtyToken(s) {
    s = s.trim();
    let total = 0;
    const fm = s.match(/([½¼¾⅓⅔])$/);
    if (fm) { total += FRAC_CHARS[fm[1]]; s = s.slice(0, -1).trim(); if (!s) return total; }
    if (s.includes('/')) {
      const p = s.split('/');
      const v = parseFloat(p[0]) / parseFloat(p[1]);
      return isNaN(v) ? null : total + v;
    }
    const v = parseFloat(s.replace(',', '.'));
    return isNaN(v) ? null : total + v;
  }

  function normalizeName(s) {
    return (s || '').toLowerCase().trim().replace(/\s+/g, ' ');
  }

  // Nombre de compra: sin notas entre paréntesis ni indicaciones tras una coma
  // ("cebolla, picada" -> "cebolla"; "champiñones (laminados finos)" -> "champiñones").
  function cleanIngredientName(s) {
    let n = (s || '').replace(/\([^)]*\)/g, ' ');
    n = n.split(/\s*,\s*|\s+[-–—]\s+/)[0];
    n = n.replace(/^(?:una |un )?(?:pizca|pizcas|chorrito|chorro|poco|puntita|toque)\s+(?:de\s+)?/i, '');
    return normalizeName(n);
  }

  // Returns true if names a and b are likely the same ingredient (singular/plural)
  function sameIngredient(a, b) {
    if (a === b) return true;
    if (a + 's' === b || b + 's' === a) return true;
    if (a + 'es' === b || b + 'es' === a) return true;
    // "tomate cherry" = "tomates cherry", "limón" = "limones", "pimiento rojo" = "pimientos rojos"
    return pluralName(a) === pluralName(b);
  }

  // frac=true muestra ½ ¼ ¾ ⅓ ⅔ (recetas); frac=false decimales (pesos y volúmenes)
  function fmtQty(qty, frac) {
    if (qty == null) return '';
    if (frac) {
      const whole = Math.floor(qty + 1e-9);
      const part = qty - whole;
      const f = [[0.25, '¼'], [1 / 3, '⅓'], [0.5, '½'], [2 / 3, '⅔'], [0.75, '¾']].find(x => Math.abs(part - x[0]) < 0.02);
      if (f) return (whole ? whole + ' ' : '') + f[1];
    }
    if (Number.isInteger(qty)) return String(qty);
    // Show up to 1 decimal, remove trailing .0
    const s = qty.toFixed(1).replace(/\.0$/, '');
    return s.replace('.', ',');
  }

  // Unidades escritas con palabra: en plural cuando hay más de una ("14 dientes de ajo").
  // Las abreviaturas (g, ml, cda, cdta...) no cambian.
  const UNIT_PLURAL = {
    diente: 'dientes', rama: 'ramas', hoja: 'hojas', lata: 'latas', bote: 'botes', bolsa: 'bolsas',
    paquete: 'paquetes', sobre: 'sobres', cabeza: 'cabezas', rodaja: 'rodajas', filete: 'filetes',
    pieza: 'piezas', loncha: 'lonchas', rebanada: 'rebanadas', taza: 'tazas', vaso: 'vasos', 'puñado': 'puñados',
  };

  function pluralWord(w) {
    if (/s$|y$/.test(w)) return w;
    if (/[aeiouáéíóú]$/.test(w)) return w + 's';
    if (/ón$/.test(w)) return w.slice(0, -2) + 'ones';
    if (/z$/.test(w)) return w.slice(0, -1) + 'ces';
    if (/[lrdn]$/.test(w)) return w + 'es';
    return w;
  }

  // "pimiento rojo" -> "pimientos rojos"; solo las palabras antes de la primera preposición
  function pluralName(name) {
    const stop = /^(de|del|en|al|con|para|y|o|sin|a|la|el|los|las)$/;
    const words = name.split(' ');
    let past = false;
    return words.map(w => { if (stop.test(w)) past = true; return past ? w : pluralWord(w); }).join(' ');
  }

  function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

  function fmtIngredient(qty, unit, name) {
    if (qty == null) return capitalize(name);
    if (unit) {
      // Convert g→kg and ml→l for display when large
      if (unit === 'g' && qty >= 1000) return fmtQty(qty / 1000, false) + ' kg de ' + name;
      if (unit === 'ml' && qty >= 1000) return fmtQty(qty / 1000, false) + ' l de ' + name;
      const decimal = unit === 'g' || unit === 'ml' || unit === 'mg';
      const u = (qty > 1 && UNIT_PLURAL[unit]) ? UNIT_PLURAL[unit] : unit;
      return fmtQty(qty, !decimal) + ' ' + u + ' de ' + name;
    }
    // Count: try to restore plural
    return fmtQty(qty, true) + ' ' + (qty > 1 ? pluralName(name) : name);
  }

  // ── Básicos de despensa y secciones del súper ────────────────────────────

  // Sal, pimienta, aceite y agua se asumen en casa: en la hoja de revisión salen
  // aparte y desmarcados, para marcar solo los que falten.
  const STAPLE_RE = /^(sal( (fina|gruesa|marina|en escamas|maldon))?( y pimienta)?|pimienta( (negra|blanca|molida|recien molida))?|aceite( de (oliva|girasol)( virgen extra)?)?|aove|agua( (fria|caliente|tibia|templada|mineral))?)( al gusto| para (freir|cocer|cocinar|sofreir|la fritura))?$/;

  function isStaple(name) { return STAPLE_RE.test(norm(name)); }

  function stapleLabel(name) {
    const n = name.replace(/\s+(al gusto|para (fre[ií]r|cocer|cocinar|sofre[ií]r|la fritura))$/i, '');
    if (/^(aove|aceite de oliva( virgen extra)?)$/i.test(n)) return 'Aceite de oliva';
    return capitalize(n);
  }

  // Orden de evaluación (lo más específico primero) y orden de pasillos al mostrar.
  const SHOP_SECTION_RULES = [
    ['congelados', /congelad|helado|\bhielo/],
    ['bebidas', /\b(vinos?|cerveza|cava|champan|brandy|conac|ron|whisky|licor|ginebra|vodka|zumos?(?! de (limon|naranja|lima))|refresco|cola|sidra|sake|vermut|jerez|amontillado|oporto|tequila)\b/],
    ['despensa', /\b(harina|pan rallado|panko|azucar|levadura|maicena|sal|pimienta|aceite|vinagre|especias?|comino|pimenton|oregano|curry|canela|curcuma|nuez moscada|azafran|vainilla|bicarbonato)\b|\b(ajo|cebolla|jengibre|perejil|cilantro|albahaca|romero|tomillo|laurel|eneldo|menta|cebollino)\b.*\b(en polvo|molid[oa]|seco|seca|deshidratad[oa]|granulad[oa])/],
    ['panaderia', /\bpan\b|\bpanes\b|baguette|hogaza|tortillas? de (trigo|maiz)|\bwraps?\b|\bbollos?\b|brioche|\bpita\b|focaccia|hojaldre|picatostes|\btortillas?\b/],
    ['conservas', /\b(lata|latas|bote|botes|tarro|conserva|triturad[oa]s?|tomate frito|salsa de tomate|tomate concentrado|concentrado de tomate|tomates? pelados?|garbanzos?|alubias?|lentejas?|judias (blancas|pintas|cocidas)|aceitunas?|olivas|pimientos? (asados?|del piquillo|piquillo)|caldo|maiz|leche (de coco|evaporada|condensada)|crema de coco|anchoas?|atun en|bonito en|alcaparras?|pepinillos?|encurtidos?|palmitos?)\b/],
    ['lacteos', /\b(leche|huevos?|quesos?|yogur|yogures|yogurt|nata|mantequilla|margarina|mozzarella|parmesano|feta|requeson|cheddar|burrata|kefir|mascarpone|ricotta|cottage|crema fresca|crema de leche|natillas|cuajada|emmental|gouda|gruyere|brie|camembert|provolone|manchego|gorgonzola|grana padano|rulo de cabra|burratas?|yemas?|claras?)\b/],
    ['carne', /\b(pollo|ternera|cerdo|carnes?|jamon|bacon|beicon|chorizo|lomo|salchichas?|pavo|cordero|costillas?|solomillo|panceta|morcilla|mortadela|pechugas?|muslos?|contramuslos?|albondigas?|hamburguesas?|conejo|pato|fiambre|butifarra|longaniza|entrecot|chuletas?|cecina|salchichon|sobrasada|carrilleras?|jarrete|codillo|buey|vacuno|guanciale|secreto)\b/],
    ['pescado', /\b(pescados?|salmon|atun|merluza|bacalao|gambas?|gambones|langostinos?|mejillon|mejillones|calamar(es)?|pulpo|sepia|sardinas?|lubina|dorada|trucha|boquerones?|almejas?|marisco|mariscos|rape|cigalas?|surimi|lenguado|rodaballo|bonito|caballa|chipiron(es)?|berberechos?|vieiras?|cangrejo|ostras?)\b/],
    ['verdura', /\b(cebollas?|cebolletas?|ajos?|tomates?|patatas?|zanahorias?|calabacin(es)?|calabaza|pimientos?|berenjenas?|lechugas?|espinacas?|champinon(es)?|setas?|hongos?|limon(es)?|limas?|naranjas?|manzanas?|platanos?|aguacates?|puerros?|apio|judias verdes|brocoli|coliflor|pepinos?|perejil|cilantro|albahaca|eneldo|cebollino|menta|hierbabuena|esparragos?|remolacha|col|repollo|fresas?|uvas?|melon|sandia|peras?|melocoton(es)?|nectarinas?|tomatitos?|guindillas?|hierbas frescas|hierbas|mango|boniatos?|batatas?|jengibre|alcachofas?|rucula|canonigos?|escarola|acelgas?|rabanos?|nabos?|hinojo|lombarda|cerezas?|kiwis?|pina|granada|arandanos?|frambuesas?|higos?|ciruelas?|mandarinas?|pomelo|chalotas?|romero|tomillo|salvia|verduras?|fruta|frutas|ensalada|brotes|guisantes?|habas?|mazorcas?|yuca|endibias?|berros|diente de ajo)\b/],
    ['despensa', /\b(pasta|espaguetis?|spaghetti|macarrones|tallarines|fideos?|lasana|canelones|noquis|gnocchi|arroz|quinoa|cuscus|avena|copos|polenta|salsa|soja|mostaza|mayonesa|ketchup|almendras?|nueces|nuez|cacahuetes?|pinones|pistachos?|avellanas?|anacardos?|chocolate|cacao|galletas?|miel|mermelada|sirope|sesamo|coco rallado|semillas|pipas|pasas|datiles|orejones|tahini|hummus|gelatina|esencia|edulcorante|pure|laurel|clavo|pesto|bechamel|mahonesa|alioli|vinagreta|sriracha|endulzante|eritritol|panela|cayenas?|frutos secos|gnocchis|tofu|couscous|hierbas (provenzales|aromaticas))\b/],
  ];

  const SHOP_SECTION_ORDER = [
    ['verdura', 'Frutas y verduras'], ['carne', 'Carne y charcutería'], ['pescado', 'Pescadería'],
    ['lacteos', 'Lácteos y huevos'], ['panaderia', 'Panadería'], ['congelados', 'Congelados'],
    ['conservas', 'Conservas y legumbres'], ['despensa', 'Despensa'], ['bebidas', 'Bebidas'], ['otros', 'Otros'],
  ];

  function sectionOf(name) {
    const n = norm(name);
    for (const [key, re] of SHOP_SECTION_RULES) { if (re.test(n)) return key; }
    return 'otros';
  }

  // Collect all ingredients from the current plan, grouped by recipe
  // Lo que queda fuera de la lista (platos libres, recetas sin ingredientes): se avisa en la revisión
  let planSkipped = { custom: [], noIngredients: [] };
  function collectPlanIngredients() {
    const items = []; // { raw, qty, unit, name, source }
    planSkipped = { custom: [], noIngredients: [] };
    const allSlotKeys = Object.keys(plan);
    allSlotKeys.forEach(key => {
      const rid = plan[key];
      if (!rid) return;
      if (rid.startsWith('custom:')) { // plato libre: no tiene ingredientes que leer
        const name = rid.slice(7).trim();
        if (name && planSkipped.custom.indexOf(name) === -1) planSkipped.custom.push(name);
        return;
      }
      const r = recipes.find(x => x.id === rid);
      if (!r) return;
      if (!r.ingredients || !r.ingredients.length) {
        if (planSkipped.noIngredients.indexOf(r.title) === -1) planSkipped.noIngredients.push(r.title);
        return;
      }
      r.ingredients.forEach(line => {
        const trimmed = (line || '').trim();
        // Skip lines that are clearly cooking steps: end with a period or are very long sentences
        if (trimmed.endsWith('.') || trimmed.length > 80) return;
        // Skip texto de caption que no es un ingrediente ("¡Y tachán!", "Aliño:", líneas sin letras)
        if (!/[a-záéíóúñ]/i.test(trimmed) || /[!?:]\s*$/.test(trimmed) || /^[¡¿]/.test(trimmed)) return;
        // Skip section headers / notes with no quantity (e.g. "Para la salsa:", "Al gusto", "Opcional")
        const lc = trimmed.toLowerCase();
        if (!lc.match(/^\d/) && lc.match(/^(para |según |al |a la |a los |opcional|nota:|para:)/)) return;
        const parsed = parseIngredient(trimmed);
        if (!parsed) return;
        items.push({ ...parsed, source: r.title });
      });
    });
    return items;
  }

  function groupIngredients(items) {
    // Returns [{ text, sources, qty, unit, name }]
    const groups = [];
    for (const item of items) {
      if (isStaple(item.name)) {
        // Básicos (sal, aceite...): una sola línea por producto, sin cantidad
        const label = stapleLabel(item.name);
        const ex = groups.find(g => g.staple && g.name === label.toLowerCase());
        if (ex) { if (!ex.sources.includes(item.source)) ex.sources.push(item.source); }
        else groups.push({ staple: true, name: label.toLowerCase(), qty: null, unit: null, sources: [item.source] });
        continue;
      }
      let merged = false;
      for (const g of groups) {
        if (g.staple) continue;
        if (sameIngredient(g.name, item.name) && g.unit === item.unit) {
          // Compatible units — sum if both have qty, else keep separate
          if (g.qty != null && item.qty != null) {
            g.qty += item.qty;
            if (!g.sources.includes(item.source)) g.sources.push(item.source);
            merged = true;
            break;
          }
          if (g.qty == null && item.qty == null) {
            // Both have no qty — just merge sources
            if (!g.sources.includes(item.source)) g.sources.push(item.source);
            merged = true;
            break;
          }
          // One has qty the other doesn't — keep separate
        }
      }
      if (!merged) {
        groups.push({ name: item.name, qty: item.qty, unit: item.unit, sources: [item.source], raw: item.raw });
      }
    }
    return groups.map(g => ({
      text: fmtIngredient(g.qty, g.unit, g.name),
      sources: g.sources,
      qty: g.qty,
      unit: g.unit,
      name: g.name,
      staple: !!g.staple,
    }));
  }

  // Merge new items into shoppingItems (combine compatible duplicates)
  function addToShoppingItems(incoming) {
    for (const inc of incoming) {
      const incParsed = parseIngredient(inc.text);
      let merged = false;
      for (const ex of shoppingItems) {
        if (ex.checked) continue; // don't merge into already-done items
        const exParsed = parseIngredient(ex.text);
        if (!exParsed || !incParsed) continue;
        if (sameIngredient(exParsed.name, incParsed.name) && exParsed.unit === incParsed.unit
            && exParsed.qty != null && incParsed.qty != null) {
          const newQty = exParsed.qty + incParsed.qty;
          ex.text = fmtIngredient(newQty, exParsed.unit, exParsed.name);
          const newSources = [...(ex.sources || [])];
          (inc.sources || []).forEach(s => { if (!newSources.includes(s)) newSources.push(s); });
          ex.sources = newSources;
          merged = true;
          break;
        }
        // Sin cantidad en ambos ("Sal", "Rúcula"): no duplicar, solo sumar las recetas de origen
        if (sameIngredient(exParsed.name, incParsed.name) && exParsed.qty == null && incParsed.qty == null) {
          const newSources = [...(ex.sources || [])];
          (inc.sources || []).forEach(s => { if (!newSources.includes(s)) newSources.push(s); });
          ex.sources = newSources;
          merged = true;
          break;
        }
      }
      if (!merged) {
        shoppingItems.push({ id: slId(), text: inc.text, checked: false, sources: inc.sources || [] });
      }
    }
    saveShoppingItems();
  }

  // ── Shopping review modal ────────────────────────────────────────────────

  function openShoppingReview() {
    const rawItems = collectPlanIngredients();
    if (!rawItems.length) {
      alert('El plan semanal no tiene ninguna receta con ingredientes todavía.');
      return;
    }
    const grouped = groupIngredients(rawItems);
    // Build review list (each item: { text, sources, selected, id })
    // Los básicos de despensa (sal, aceite, agua...) empiezan desmarcados
    let reviewList = grouped.map((g, i) => ({ ...g, selected: !g.staple, id: 'rv' + i }));
    const skippedParts = [];
    if (planSkipped.custom.length) skippedParts.push('platos escritos a mano (' + planSkipped.custom.map(escapeHtml).join(', ') + ')');
    if (planSkipped.noIngredients.length) skippedParts.push('recetas sin ingredientes guardados (' + planSkipped.noIngredients.map(escapeHtml).join(', ') + ')');
    const skippedHtml = skippedParts.length
      ? '<p class="form-hint" style="margin:-6px 0 14px;padding:8px 10px;border-radius:8px;background:var(--accent-soft)">⚠️ No están en esta lista: ' + skippedParts.join(' y ') + '. Añádelos a mano abajo si los necesitas.</p>'
      : '';

    function renderReview() {
      const sectionKey = it => it.staple ? 'basicos' : sectionOf(it.name || (parseIngredient(it.text) || {}).name || it.text);
      const bySection = {};
      reviewList.forEach(it => { (bySection[sectionKey(it)] = bySection[sectionKey(it)] || []).push(it); });
      const itemHtml = item => {
        const srcHtml = item.sources.length
          ? '<div class="review-sources">Para: ' + escapeHtml(item.sources.join(', ')) + '</div>'
          : '';
        return '<div class="review-item" data-rid="' + item.id + '">' +
          '<input type="checkbox" class="review-check" data-chk="' + item.id + '"' + (item.selected ? ' checked' : '') + ' aria-label="Seleccionar ' + escapeAttr(item.text) + '">' +
          '<div class="review-body">' +
            '<div class="review-text">' + escapeHtml(item.text) + '</div>' +
            srcHtml +
          '</div>' +
          '<button type="button" class="review-del" data-del="' + item.id + '" aria-label="Eliminar">✕</button>' +
        '</div>';
      };
      const listHtml = SHOP_SECTION_ORDER.concat([['basicos', 'Básicos de despensa']])
        .filter(([key]) => bySection[key])
        .map(([key, label]) =>
          '<div class="sl-section-hdr">' + label + '</div>' +
          (key === 'basicos' ? '<p class="form-hint" style="margin:0 0 4px">Se suponen en casa. Marca solo los que te falten.</p>' : '') +
          bySection[key].map(itemHtml).join('')
        ).join('');

      overlayRoot.innerHTML =
        '<div class="overlay" id="ov">' +
          '<div class="sheet" role="dialog" aria-modal="true">' +
            '<div class="sheet-top"><h2>Tu lista para esta semana</h2>' +
            '<button class="close-btn" id="closeBtn" aria-label="Cerrar">✕</button></div>' +
            '<p class="form-hint" style="margin:-4px 0 14px">Desmarca lo que ya tengas en casa.</p>' +
            skippedHtml +
            '<div id="reviewList">' + listHtml + '</div>' +
            '<div class="sl-add-row" style="margin-top:14px">' +
              '<input type="text" class="sl-add-inp" id="reviewAddInp" placeholder="Añadir otro ingrediente…">' +
              '<button type="button" class="submit-btn" id="reviewAddBtn" style="padding:10px 14px;font-size:13.5px;flex:none">+</button>' +
            '</div>' +
            '<p style="margin:18px 0 0;display:flex;gap:10px;flex-wrap:wrap">' +
              '<button type="button" class="submit-btn" id="reviewConfirmBtn">Añadir a mi lista</button>' +
              '<button type="button" class="delete-link" id="reviewCancelBtn">Cancelar</button>' +
            '</p>' +
          '</div>' +
        '</div>';

      document.getElementById('closeBtn').addEventListener('click', closeDetail);
      document.getElementById('reviewCancelBtn').addEventListener('click', closeDetail);
      document.getElementById('ov').addEventListener('click', (e) => { if (e.target.id === 'ov') closeDetail(); });
      document.addEventListener('keydown', escClose);

      overlayRoot.querySelectorAll('[data-chk]').forEach(el => {
        el.addEventListener('change', () => {
          const it = reviewList.find(x => x.id === el.getAttribute('data-chk'));
          if (it) it.selected = el.checked;
        });
      });
      overlayRoot.querySelectorAll('[data-del]').forEach(el => {
        el.addEventListener('click', () => {
          reviewList = reviewList.filter(x => x.id !== el.getAttribute('data-del'));
          renderReview();
        });
      });
      document.getElementById('reviewAddBtn').addEventListener('click', () => {
        const inp = document.getElementById('reviewAddInp');
        const val = inp.value.trim();
        if (!val) return;
        reviewList.push({ id: 'rv' + Date.now(), text: val, sources: [], selected: true });
        inp.value = '';
        renderReview();
        // scroll to bottom
        overlayRoot.querySelector('.sheet').scrollTop = 99999;
      });
      document.getElementById('reviewAddInp').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); document.getElementById('reviewAddBtn').click(); }
      });
      document.getElementById('reviewConfirmBtn').addEventListener('click', () => {
        const selected = reviewList.filter(x => x.selected);
        if (!selected.length) { closeDetail(); return; }
        addToShoppingItems(selected);
        closeDetail();
        openCart();
      });
    }

    renderReview();
  }

  // ── Shopping list overlay ────────────────────────────────────────────────

  function renderShoppingItems() {
    if (!shoppingItems.length) return '<p class="cart-empty-hint" style="margin:0 0 6px">La lista está vacía. Genera una desde el plan semanal o añade productos aquí.</p>';
    // Agrupado por secciones del súper (la sección se calcula del texto, sirve también para lo añadido a mano)
    const bySection = {};
    shoppingItems.forEach(item => {
      const p = parseIngredient(item.text);
      const key = sectionOf(p ? p.name : item.text);
      (bySection[key] = bySection[key] || []).push(item);
    });
    const renderItem = item => {
      const srcHtml = (item.sources && item.sources.length)
        ? '<div class="sl-sources">Para: ' + escapeHtml(item.sources.join(', ')) + '</div>'
        : '';
      return '<div class="sl-item' + (item.checked ? ' done' : '') + '" data-slid="' + item.id + '">' +
        '<input type="checkbox" class="sl-check" data-slchk="' + item.id + '" aria-label="Marcar"' + (item.checked ? ' checked' : '') + '>' +
        '<div class="sl-body">' +
          '<div class="sl-text">' + escapeHtml(item.text) + '</div>' +
          srcHtml +
          '<div class="sl-edit-row" id="sledit_' + item.id + '" hidden>' +
            '<input type="text" class="sl-edit-inp" value="' + escapeAttr(item.text) + '" data-slval="' + item.id + '">' +
            '<button type="button" class="submit-btn" data-slsave="' + item.id + '" style="padding:6px 12px;font-size:13px;flex:none">OK</button>' +
          '</div>' +
        '</div>' +
        '<div class="sl-actions">' +
          '<button type="button" class="sl-btn" data-sledit="' + item.id + '" title="Editar">✏️</button>' +
          '<button type="button" class="sl-btn" data-sldel="' + item.id + '" title="Eliminar">✕</button>' +
        '</div>' +
      '</div>';
    };
    return SHOP_SECTION_ORDER
      .filter(([key]) => bySection[key])
      .map(([key, label]) => '<div class="sl-section-hdr">' + label + '</div>' + bySection[key].map(renderItem).join(''))
      .join('');
  }

  function bindShoppingListEvents() {
    overlayRoot.querySelectorAll('[data-slchk]').forEach(el => {
      el.addEventListener('change', () => {
        const item = shoppingItems.find(x => x.id === el.getAttribute('data-slchk'));
        if (item) { item.checked = el.checked; saveShoppingItems(); renderCartOverlay(); }
      });
    });
    overlayRoot.querySelectorAll('[data-sledit]').forEach(el => {
      el.addEventListener('click', () => {
        const id = el.getAttribute('data-sledit');
        const row = document.getElementById('sledit_' + id);
        if (row) { row.hidden = !row.hidden; if (!row.hidden) row.querySelector('input').focus(); }
      });
    });
    overlayRoot.querySelectorAll('[data-slsave]').forEach(el => {
      el.addEventListener('click', () => {
        const id = el.getAttribute('data-slsave');
        const inp = overlayRoot.querySelector('[data-slval="' + id + '"]');
        const item = shoppingItems.find(x => x.id === id);
        if (item && inp) { item.text = inp.value.trim() || item.text; saveShoppingItems(); renderCartOverlay(); }
      });
    });
    overlayRoot.querySelectorAll('[data-sldel]').forEach(el => {
      el.addEventListener('click', () => {
        const id = el.getAttribute('data-sldel');
        shoppingItems = shoppingItems.filter(x => x.id !== id);
        saveShoppingItems();
        renderCartOverlay();
      });
    });
    const addInp = document.getElementById('slAddInp');
    const addBtn = document.getElementById('slAddBtn');
    if (addBtn && addInp) {
      const doAdd = () => {
        const val = addInp.value.trim();
        if (!val) return;
        shoppingItems.push({ id: slId(), text: val, checked: false, sources: [] });
        saveShoppingItems();
        addInp.value = '';
        renderCartOverlay();
        overlayRoot.querySelector('.sheet').scrollTop = 0;
      };
      addBtn.addEventListener('click', doAdd);
      addInp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); doAdd(); } });
    }
    const clearDoneBtn = document.getElementById('slClearDoneBtn');
    if (clearDoneBtn) {
      clearDoneBtn.addEventListener('click', () => {
        shoppingItems = shoppingItems.filter(x => !x.checked);
        saveShoppingItems();
        renderCartOverlay();
      });
    }
    // "Vaciar lista": borra solo shoppingItems (pendientes + comprados + manuales +
    // generados desde el plan). No toca `cart` (recetas guardadas), ni
    // `plan`, ni `recipes`, ni `favs` - son estados completamente independientes.
    const clearListBtn = document.getElementById('clearListBtn');
    if (clearListBtn) {
      clearListBtn.addEventListener('click', () => {
        confirmClearListOpen = true;
        renderCartOverlay();
      });
    }
    const cancelClearListBtn = document.getElementById('cancelClearListBtn');
    if (cancelClearListBtn) {
      cancelClearListBtn.addEventListener('click', () => {
        confirmClearListOpen = false;
        renderCartOverlay();
      });
    }
    const confirmClearListBtn = document.getElementById('confirmClearListBtn');
    if (confirmClearListBtn) {
      confirmClearListBtn.addEventListener('click', () => {
        shoppingItems = [];
        confirmClearListOpen = false;
        saveShoppingItems();
        renderCartOverlay();
      });
    }
  }

  function openCart() { confirmClearListOpen = false; renderCartOverlay(); }

  // ---- Revisar recetario: duplicados y categorías mal puestas ------------------
  // Nada se borra ni se cambia solo: este panel solo PROPONE. Cada cambio lo decide
  // quien edita, y todo es reversible (ocultar/restaurar, cambiar categoría/deshacer).
  // - Duplicados: se calculan aquí, en el navegador (parecido de título + ingredientes).
  // - Categorías / "no es receta": sugerencias precalculadas en revision-ia.json.

  const DUP_STOP = new Set('de del la el los las con y en a al un una para por sin o e su sus muy facil faciles rapida rapido casero casera caseros caseras receta tradicional clasico clasica saludable saludables express'.split(' '));
  const DUP_UNITS = new Set('g kg ml l cl dl cda cdta cucharada cucharadas cucharadita cucharaditas taza tazas vaso lata bote diente dientes pizca gusto opcional'.split(' '));
  function dupSing(w) { return w.length > 4 ? w.replace(/(es|s)$/, '') : w; }
  function dupTitleSet(r) {
    return new Set(norm(r.title).replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter(w => w && !DUP_STOP.has(w)).map(dupSing));
  }
  function dupIngSet(r) {
    const s = new Set();
    (r.ingredients || []).forEach(l => {
      const words = norm(l).replace(/\([^)]*\)/g, ' ').replace(/[^a-z ]/g, ' ').split(/\s+/)
        .filter(w => w.length > 2 && !DUP_STOP.has(w) && !DUP_UNITS.has(w)).map(dupSing);
      if (words[0]) s.add(words.slice(0, 2).join(' '));
    });
    return s;
  }
  function dupJac(a, b) {
    if (!a.size || !b.size) return 0;
    let i = 0; a.forEach(x => { if (b.has(x)) i++; });
    return i / (a.size + b.size - i);
  }
  // Devuelve grupos [{ ids, level: 'alta'|'media'|'versiones', best }]
  function findDuplicateGroups(recs) {
    const T = recs.map(dupTitleSet), I = recs.map(dupIngSet);
    const parent = recs.map((_, i) => i);
    const find = i => { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
    const pairLevel = new Map();
    const rank = { alta: 3, media: 2, versiones: 1 };
    const byTok = new Map();
    T.forEach((s, i) => s.forEach(t => { if (!byTok.has(t)) byTok.set(t, []); byTok.get(t).push(i); }));
    for (let i = 0; i < recs.length; i++) {
      if (!T[i].size) continue;
      const cand = new Set();
      T[i].forEach(t => (byTok.get(t) || []).forEach(j => { if (j > i) cand.add(j); }));
      cand.forEach(j => {
        const ts = dupJac(T[i], T[j]);
        if (ts < 0.6) return;
        const comparable = I[i].size >= 3 && I[j].size >= 3;
        const is = comparable ? dupJac(I[i], I[j]) : -1;
        let level = null;
        if (ts >= 0.99) {
          if (!comparable || is >= 0.5) level = 'alta';
          else if (is >= 0.25) level = 'media';
          else level = 'versiones';
        } else if (comparable && is >= 0.6) level = 'media';
        if (!level) return;
        parent[find(i)] = find(j);
        pairLevel.set(i + ':' + j, level);
      });
    }
    const groups = new Map();
    recs.forEach((r, i) => { const k = find(i); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(i); });
    const out = [];
    groups.forEach(idxs => {
      if (idxs.length < 2) return;
      let level = 'versiones';
      pairLevel.forEach((lv, key) => { const a = Number(key.split(':')[0]); if (find(a) === find(idxs[0]) && rank[lv] > rank[level]) level = lv; });
      const size = r => (r.ingredients || []).length + (r.steps || []).length * 2 + (r.tips || []).length;
      const best = idxs.slice().sort((x, y) => size(recs[y]) - size(recs[x]))[0];
      out.push({ ids: idxs.map(i => recs[i].id), level, best: recs[best].id });
    });
    const order = { alta: 0, media: 1, versiones: 2 };
    out.sort((a, b) => order[a.level] - order[b.level] || b.ids.length - a.ids.length);
    return out;
  }

  const REVIEW_KEY = 'recetario_review_dismiss_v1';
  const RV_LEVEL_LABEL = {
    alta: 'Casi seguro duplicadas',
    media: 'Muy parecidas',
    versiones: 'Mismo nombre, receta distinta: ¿versiones?'
  };
  let reviewDismiss = { cat: {}, dup: {} };
  try {
    const v = JSON.parse(localStorage.getItem(REVIEW_KEY) || '{}');
    if (v && typeof v === 'object') reviewDismiss = { cat: v.cat || {}, dup: v.dup || {} };
  } catch (e) {}
  function saveReviewDismiss() { try { localStorage.setItem(REVIEW_KEY, JSON.stringify(reviewDismiss)); } catch (e) {} }

  let reviewData = null;          // contenido de revision-ia.json
  let reviewLoadFailed = false;
  let reviewTab = 'dup';
  let reviewGroups = [];          // foto de los grupos al abrir (no desaparecen al ocultar)
  let reviewDone = {};            // id -> { type: 'cat'|'hide', from, to }
  let reviewConfirm = null;       // 'cat' | 'hide' | null (confirmación de acción en bloque)
  let reviewMsg = '';

  function rvHost(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } }
  function rvById() { const m = new Map(); recipes.forEach(r => m.set(r.id, r)); return m; }
  function rvDupKey(g) { return g.ids.slice().sort().join('+'); }

  function rvComputeGroups() {
    const recs = recipes.filter(r => !hiddenIds.has(r.id) && !isMix(r) && hasRealRecipeContent(r));
    reviewGroups = findDuplicateGroups(recs);
  }

  // Sugerencias de categoría / "no es receta" vigentes, ya filtradas
  function rvCatRows() {
    if (!reviewData || !reviewData.items) return [];
    const by = rvById();
    const rows = [];
    Object.keys(reviewData.items).forEach(id => {
      const r = by.get(id); const v = reviewData.items[id];
      if (!r) return;
      const done = reviewDone[id];
      if (!done) {
        if (hiddenIds.has(id) || reviewDismiss.cat[id]) return;
        const wantsCat = v.cat && v.cat !== r.category;
        if (!wantsCat && !v.noReceta) return;
      }
      rows.push({ r, v, done });
    });
    const ord = c => { const i = CATEGORY_ORDER.indexOf(c); return i < 0 ? 99 : i; };
    rows.sort((a, b) =>
      (a.v.noReceta ? 0 : 1) - (b.v.noReceta ? 0 : 1) ||
      ord(a.r.category) - ord(b.r.category) || a.r.title.localeCompare(b.r.title, 'es'));
    return rows;
  }

  async function rvPool(items, worker, n) {
    let i = 0, fails = 0;
    await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => {
      while (i < items.length) {
        const it = items[i++];
        try { if (!(await worker(it))) fails++; } catch (e) { fails++; }
      }
    }));
    return fails;
  }

  function rvRefreshApp() {
    applyOverrides();
    filterOptionsCache = null;
    updateStats();
    render();
  }

  async function rvSetCategory(r, cat) {
    dbOverrides[r.id] = cat;
    r.category = cat;
    return apiSetDoc('overrides', r.id, { category: cat });
  }
  async function rvSetHidden(r, hidden) {
    if (hidden) hiddenIds.add(r.id); else hiddenIds.delete(r.id);
    return apiSetDoc('hidden', r.id, { hidden });
  }

  function rvCardHtml(r, g, showBest) {
    const hidden = hiddenIds.has(r.id);
    const ing = r.ingredients || [];
    const host = rvHost(r.url);
    const meta = [catLabel(r.category), ing.length + ' ingredientes', (r.steps || []).length + ' pasos'].concat(host ? [host] : []).join(' · ');
    const preview = ing.slice(0, 3).map(x => String(x).slice(0, 40)).join(', ');
    return '<div class="rv-card' + (hidden ? ' is-hidden' : '') + '">' +
      '<div class="rv-main">' +
        '<button type="button" class="rv-open" data-act="open" data-id="' + escapeAttr(r.id) + '">' + escapeHtml(r.title) + '</button>' +
        (showBest && g.best === r.id ? ' <span class="rv-best">Más completa</span>' : '') +
        (hidden ? ' <span class="rv-tag">Oculta</span>' : '') +
        '<div class="rv-meta">' + escapeHtml(meta) + '</div>' +
        (preview ? '<div class="rv-prev">' + escapeHtml(preview) + '…</div>' : '') +
      '</div>' +
      (hidden
        ? '<button type="button" class="rv-btn" data-act="unhide" data-id="' + escapeAttr(r.id) + '">Restaurar</button>'
        : '<button type="button" class="rv-btn rv-btn-warn" data-act="hide" data-id="' + escapeAttr(r.id) + '">Ocultar</button>') +
    '</div>';
  }

  function rvDupHtml() {
    const by = rvById();
    const groups = reviewGroups.filter(g => !reviewDismiss.dup[rvDupKey(g)]);
    if (!groups.length) return '<p class="form-hint">No hay duplicados pendientes.</p>';
    return '<p class="form-hint">Compara cada grupo y oculta la que sobre. No se borra nada: las ocultas se pueden restaurar aquí mismo.</p>' +
      groups.map(g => {
        const rs = g.ids.map(id => by.get(id)).filter(Boolean);
        const sz = r => (r.ingredients || []).length + (r.steps || []).length * 2 + (r.tips || []).length;
        const bestSz = Math.max.apply(null, rs.map(sz));
        const showBest = rs.filter(r => sz(r) === bestSz).length === 1;
        const visible = rs.filter(r => !hiddenIds.has(r.id)).length;
        return '<div class="rv-group' + (visible < 2 ? ' is-resolved' : '') + '">' +
          '<div class="rv-group-hdr"><span class="rv-badge rv-lv-' + g.level + '">' + (visible < 2 ? '✓ Resuelto' : RV_LEVEL_LABEL[g.level]) + '</span>' +
          '<button type="button" class="delete-link" data-act="dupok" data-key="' + escapeAttr(rvDupKey(g)) + '">No son duplicadas</button></div>' +
          rs.map(r => rvCardHtml(r, g, showBest)).join('') +
        '</div>';
      }).join('');
  }

  function rvCatHtml() {
    if (reviewLoadFailed) return '<p class="form-hint">No se han podido cargar las sugerencias. Recarga la página e inténtalo de nuevo.</p>';
    if (!reviewData) return '<p class="form-hint">Cargando sugerencias…</p>';
    const rows = rvCatRows();
    const pending = rows.filter(x => !x.done);
    const pendCat = pending.filter(x => !x.v.noReceta && x.v.cat && x.v.cat !== x.r.category);
    const pendHide = pending.filter(x => x.v.noReceta);
    if (!rows.length) return '<p class="form-hint">No hay sugerencias pendientes.</p>';
    let html = '<p class="form-hint">Sugerencias de categoría y de elementos que no parecen recetas (reseñas de restaurantes, guías, listas de ideas…). Revisa cada una: nada cambia sin que lo pulses.</p>';
    if (pendHide.length || pendCat.length) {
      html += '<div class="rv-bulk">';
      if (reviewConfirm) {
        const n = reviewConfirm === 'cat' ? pendCat.length : pendHide.length;
        html += '<span>' + (reviewConfirm === 'cat' ? 'Cambiar la categoría de ' + n + ' recetas' : 'Ocultar ' + n + ' elementos') + ' (se puede deshacer una a una)</span>' +
          '<button type="button" class="rv-btn rv-btn-primary" data-act="bulk' + reviewConfirm + '">Sí, hacerlo</button>' +
          '<button type="button" class="rv-btn" data-act="cancel">Cancelar</button>';
      } else {
        if (pendHide.length) html += '<button type="button" class="rv-btn" data-act="confirm" data-what="hide">Ocultar los ' + pendHide.length + ' que no son recetas</button>';
        if (pendCat.length) html += '<button type="button" class="rv-btn" data-act="confirm" data-what="cat">Aplicar las ' + pendCat.length + ' categorías sugeridas</button>';
      }
      html += '</div>';
    }
    const catOptions = (sel) => CATEGORY_ORDER.map(c => '<option value="' + escapeAttr(c) + '"' + (c === sel ? ' selected' : '') + '>' + escapeHtml(catLabel(c)) + '</option>').join('');
    let lastKind = null;
    rows.forEach(({ r, v, done }) => {
      const kind = v.noReceta ? 'hide' : 'cat';
      if (kind !== lastKind) {
        html += '<div class="sl-section-hdr">' + (kind === 'hide' ? 'No parecen recetas' : 'Categoría mal puesta') + '</div>';
        lastKind = kind;
      }
      const id = escapeAttr(r.id);
      let main = '<button type="button" class="rv-open" data-act="open" data-id="' + id + '">' + escapeHtml(r.title) + '</button>';
      let act;
      if (done) {
        main += '<div class="rv-meta rv-ok">✓ ' + (done.type === 'hide' ? 'Oculta' : 'Movida a ' + escapeHtml(catLabel(done.to))) + '</div>';
        act = '<button type="button" class="rv-btn" data-act="undo" data-id="' + id + '">Deshacer</button>';
      } else if (v.noReceta) {
        main += '<div class="rv-meta">' + escapeHtml(v.motivo || 'No parece una receta') + ' · ahora en ' + escapeHtml(catLabel(r.category)) + '</div>';
        act = '<button type="button" class="rv-btn rv-btn-warn" data-act="hidenr" data-id="' + id + '">Ocultar</button>' +
              '<button type="button" class="rv-btn" data-act="catskip" data-id="' + id + '">Es una receta</button>';
      } else {
        main += '<div class="rv-meta">' + escapeHtml(catLabel(r.category)) + ' → <b>' + escapeHtml(catLabel(v.cat)) + '</b></div>';
        act = '<select class="rv-sel" data-sel="' + id + '" aria-label="Categoría">' + catOptions(v.cat) + '</select>' +
              '<button type="button" class="rv-btn rv-btn-primary" data-act="catapply" data-id="' + id + '">Cambiar</button>' +
              '<button type="button" class="rv-btn" data-act="catskip" data-id="' + id + '">Dejar así</button>';
      }
      html += '<div class="rv-row' + (done ? ' is-done' : '') + '"><div class="rv-main">' + main + '</div><div class="rv-actions">' + act + '</div></div>';
    });
    return html;
  }

  // ---- Gestor de etiquetas (pestaña de Revisar recetario) --------------------
  // Renombrar, unir y borrar una etiqueta en TODAS las recetas a la vez. Todo con
  // confirmación cuando es destructivo y con "Deshacer" de la última acción.
  let tagEdit = null;      // nombre de la etiqueta que se está renombrando
  let tagDel = null;       // nombre pendiente de confirmar borrado
  let tagLastOp = null;    // { label, before: { recipeId: [tags] } }

  function rvTagCounts() {
    const c = {};
    recipes.forEach(r => (r.tags || []).forEach(t => { c[t] = (c[t] || 0) + 1; }));
    return c;
  }

  function rvTagHtml() {
    const counts = rvTagCounts();
    const names = Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b, 'es'));
    let html = '<p class="form-hint">Cambia el nombre de una etiqueta, únela con otra o bórrala en todas las recetas a la vez. Las recetas no se tocan, solo sus etiquetas.</p>';
    if (tagLastOp) {
      html += '<div class="rv-bulk"><span>' + escapeHtml(tagLastOp.label) + '</span>' +
        '<button type="button" class="rv-btn" data-act="tagundo">Deshacer</button></div>';
    }
    if (!names.length) return html + '<p class="form-hint">Todavía no has creado ninguna etiqueta. Se añaden desde cada receta, en el modo edición.</p>';
    const byNorm = {};
    names.forEach(n => { (byNorm[norm(n)] = byNorm[norm(n)] || []).push(n); });
    names.forEach(n => {
      const nm = escapeAttr(n);
      const twins = byNorm[norm(n)].filter(x => x !== n);
      const n1 = counts[n];
      const cnt = n1 + (n1 === 1 ? ' receta' : ' recetas');
      let main, act;
      if (tagEdit === n) {
        main = '<input type="text" class="rv-sel" id="rvTagInp" maxlength="30" value="' + nm + '" style="width:100%;font-size:15px;padding:8px 10px" aria-label="Nuevo nombre">' +
          '<div class="rv-meta">Si el nombre ya existe, las dos etiquetas se unen.</div>';
        act = '<button type="button" class="rv-btn rv-btn-primary" data-act="tagsave" data-tag-name="' + nm + '">Guardar</button>' +
              '<button type="button" class="rv-btn" data-act="tagcancel">Cancelar</button>';
      } else if (tagDel === n) {
        main = '<b>🏷️ ' + escapeHtml(n) + '</b><div class="rv-meta">¿Quitar esta etiqueta de ' + cnt + '?</div>';
        act = '<button type="button" class="rv-btn rv-btn-warn" data-act="tagdelyes" data-tag-name="' + nm + '">Sí, borrar</button>' +
              '<button type="button" class="rv-btn" data-act="tagcancel">No</button>';
      } else {
        main = '<button type="button" class="rv-open" data-act="tagview" data-tag-name="' + nm + '">🏷️ ' + escapeHtml(n) + '</button>' +
          '<div class="rv-meta">' + cnt + (twins.length ? ' · <b>igual que «' + escapeHtml(twins[0]) + '»</b>' : '') + '</div>';
        act = (twins.length && (counts[n] < counts[twins[0]] || (counts[n] === counts[twins[0]] && n > twins[0]))
            ? '<button type="button" class="rv-btn rv-btn-primary" data-act="tagmerge" data-tag-name="' + nm + '" data-into="' + escapeAttr(twins[0]) + '">Unir con «' + escapeHtml(twins[0]) + '»</button>'
            : '') +
          '<button type="button" class="rv-btn" data-act="tagrename" data-tag-name="' + nm + '">Renombrar</button>' +
          '<button type="button" class="rv-btn rv-btn-warn" data-act="tagdel" data-tag-name="' + nm + '">Borrar</button>';
      }
      html += '<div class="rv-row"><div class="rv-main">' + main + '</div><div class="rv-actions">' + act + '</div></div>';
    });
    return html;
  }

  // Aplica un cambio de etiquetas a varias recetas, guarda y permite deshacer
  async function rvTagApply(mutate, affected, label) {
    const before = {};
    const todo = [];
    affected.forEach(r => {
      const prev = (r.tags || []).slice();
      const seen = new Set();
      const next = mutate(prev).filter(t => { const k = norm(t); if (seen.has(k)) return false; seen.add(k); return true; });
      before[r.id] = prev;
      todo.push({ r, next, prev });
    });
    const fails = await rvPool(todo, async ({ r, next, prev }) => {
      dbTags[r.id] = next; r.tags = next;
      const ok = await apiSetDoc('tags', r.id, { tags: next });
      if (!ok) { dbTags[r.id] = prev; r.tags = prev; delete before[r.id]; }
      return ok;
    }, 5);
    filterOptionsCache = null;
    render();
    const nDone = Object.keys(before).length;
    tagLastOp = nDone ? { label: label + ' (' + nDone + (nDone === 1 ? ' receta)' : ' recetas)'), before } : null;
    reviewMsg = fails ? (fails + ' recetas no se han podido guardar; las demás sí. Inténtalo de nuevo.') : '';
  }

  async function rvTagUndo() {
    if (!tagLastOp) return;
    const by = rvById();
    const todo = Object.keys(tagLastOp.before).map(id => ({ r: by.get(id), tags: tagLastOp.before[id] })).filter(x => x.r);
    const fails = await rvPool(todo, async ({ r, tags }) => {
      dbTags[r.id] = tags; r.tags = tags;
      return apiSetDoc('tags', r.id, { tags });
    }, 5);
    tagLastOp = null;
    filterOptionsCache = null;
    render();
    reviewMsg = fails ? (fails + ' recetas no se han podido restaurar. Inténtalo de nuevo.') : 'Deshecho.';
  }

  async function rvTagRename(oldName, newRaw) {
    const nn = String(newRaw).trim().replace(/\s+/g, ' ').slice(0, 30);
    if (!nn) { reviewMsg = 'La etiqueta no puede estar vacía.'; return; }
    const others = getAllTags().filter(t => t !== oldName);
    const canon = tagCanonical(nn, oldName);
    if (canon === oldName) return;
    const affected = recipes.filter(r => (r.tags || []).indexOf(oldName) !== -1);
    const merged = others.indexOf(canon) !== -1;
    await rvTagApply(tags => tags.map(t => t === oldName ? canon : t), affected,
      (merged ? 'Unida «' + oldName + '» con «' + canon + '»' : 'Renombrada «' + oldName + '» → «' + canon + '»'));
    if (state.cat === 'TAG:' + oldName) { state.cat = 'TAG:' + canon; render(); }
  }

  async function rvTagDelete(name) {
    const affected = recipes.filter(r => (r.tags || []).indexOf(name) !== -1);
    await rvTagApply(tags => tags.filter(t => t !== name), affected, 'Borrada «' + name + '»');
    if (state.cat === 'TAG:' + name) { state.cat = 'TODAS'; state.visible = PAGE_SIZE; render(); }
  }

  function renderReview(keepScroll) {
    const nTags = Object.keys(rvTagCounts()).length;
    const nDup =reviewGroups.filter(g => !reviewDismiss.dup[rvDupKey(g)] && g.ids.filter(id => !hiddenIds.has(id)).length >= 2).length;
    const nCat = reviewData ? rvCatRows().filter(x => !x.done).length : 0;
    overlayRoot.innerHTML =
      '<div class="overlay" id="ov">' +
        '<div class="sheet rv-sheet" id="rvSheet" role="dialog" aria-modal="true">' +
          '<div class="sheet-top"><h2>Revisar recetario</h2>' +
          '<button class="close-btn" id="closeBtn" aria-label="Cerrar">✕</button></div>' +
          '<div class="rv-tabs">' +
            '<button type="button" class="rv-tab' + (reviewTab === 'dup' ? ' on' : '') + '" data-act="tab" data-tab="dup">Duplicados' + (nDup ? ' (' + nDup + ')' : '') + '</button>' +
            '<button type="button" class="rv-tab' + (reviewTab === 'cat' ? ' on' : '') + '" data-act="tab" data-tab="cat">Categorías' + (nCat ? ' (' + nCat + ')' : '') + '</button>' +
            '<button type="button" class="rv-tab' + (reviewTab === 'tag' ? ' on' : '') + '" data-act="tab" data-tab="tag">Etiquetas' + (nTags ? ' (' + nTags + ')' : '') + '</button>' +
          '</div>' +
          '<p class="form-hint rv-msg" id="rvMsg">' + escapeHtml(reviewMsg) + '</p>' +
          (reviewTab === 'dup' ? rvDupHtml() : reviewTab === 'tag' ? rvTagHtml() : rvCatHtml()) +
          (reviewTab === 'tag' ? '' : '<p style="margin:16px 0 0"><button type="button" class="delete-link" data-act="resetdismiss">Volver a mostrar lo descartado en este dispositivo</button></p>') +
        '</div>' +
      '</div>';
    const sheet = document.getElementById('rvSheet');
    if (keepScroll) sheet.scrollTop = keepScroll;
    document.getElementById('closeBtn').addEventListener('click', closeReview);
    document.getElementById('ov').addEventListener('click', (e) => { if (e.target.id === 'ov') closeReview(); });
    sheet.addEventListener('click', onReviewClick);
    sheet.addEventListener('keydown', (e) => {
      if (e.target.id !== 'rvTagInp') return;
      if (e.key === 'Enter') { e.preventDefault(); const b = sheet.querySelector('[data-act=tagsave]'); if (b) b.click(); }
      else if (e.key === 'Escape') { e.stopPropagation(); tagEdit = null; renderReview(sheet.scrollTop); }

  function closeReview() {
    document.removeEventListener('keydown', reviewEsc);
    closeDetail();
  }
  function reviewEsc(e) {
    if (!document.getElementById('rvSheet')) { document.removeEventListener('keydown', reviewEsc); return; }
    if (e.key === 'Escape' && !currentDetailId) closeReview();
  }

  async function onReviewClick(e) {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const sheet = document.getElementById('rvSheet');
    const act = el.getAttribute('data-act');
    const id = el.getAttribute('data-id');
    const by = rvById();
    const r = id ? by.get(id) : null;
    const redraw = () => renderReview(sheet ? sheet.scrollTop : 0);
    let failed = false;

    if (act === 'open') { if (r) openDetail(r); return; }
    if (act === 'tab') { reviewTab = el.getAttribute('data-tab'); reviewConfirm = null; reviewMsg = ''; tagEdit = null; tagDel = null; renderReview(0); return; }

    // Gestor de etiquetas
    const tname = el.getAttribute('data-tag-name');
    if (act === 'tagview') {
      state.cat = 'TAG:' + tname; state.visible = PAGE_SIZE; render(); closeReview(); return;
    }
    if (act === 'tagrename') { tagEdit = tname; tagDel = null; reviewMsg = ''; redraw(); return; }
    if (act === 'tagdel') { tagDel = tname; tagEdit = null; reviewMsg = ''; redraw(); return; }
    if (act === 'tagcancel') { tagEdit = null; tagDel = null; redraw(); return; }
    if (act === 'tagsave' || act === 'tagdelyes' || act === 'tagmerge' || act === 'tagundo') {
      const inp = document.getElementById('rvTagInp');
      const newName = act === 'tagsave' ? (inp ? inp.value : '') : el.getAttribute('data-into');
      tagEdit = null; tagDel = null; reviewMsg = 'Guardando…';
      document.getElementById('rvMsg').textContent = reviewMsg;
      el.disabled = true;
      if (act === 'tagsave' || act === 'tagmerge') await rvTagRename(tname, newName);
      else if (act === 'tagdelyes') await rvTagDelete(tname);
      else await rvTagUndo();
      if (reviewMsg === 'Guardando…') reviewMsg = '';
      redraw();
      return;
    }
    if (act === 'confirm') { reviewConfirm = el.getAttribute('data-what'); redraw(); return; }
    if (act === 'cancel') { reviewConfirm = null; redraw(); return; }
    if (act === 'resetdismiss') {
      if (reviewTab === 'dup') reviewDismiss.dup = {}; else reviewDismiss.cat = {};
      saveReviewDismiss(); reviewMsg = ''; redraw(); return;
    }
    if (act === 'dupok') { reviewDismiss.dup[el.getAttribute('data-key')] = 1; saveReviewDismiss(); redraw(); return; }
    if (act === 'catskip' && r) { reviewDismiss.cat[id] = 1; saveReviewDismiss(); redraw(); return; }

    if (act === 'hide' && r) {
      failed = !(await rvSetHidden(r, true));
      if (failed) await rvSetHidden(r, false);
      rvRefreshApp();
    } else if (act === 'unhide' && r) {
      failed = !(await rvSetHidden(r, false));
      if (failed) await rvSetHidden(r, true);
      rvRefreshApp();
    } else if (act === 'hidenr' && r) {
      reviewDone[id] = { type: 'hide' };
      failed = !(await rvSetHidden(r, true));
      if (failed) { delete reviewDone[id]; hiddenIds.delete(id); }
      rvRefreshApp();
    } else if (act === 'catapply' && r) {
      const sel = sheet.querySelector('[data-sel="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"]');
      const to = sel ? sel.value : (reviewData.items[id] || {}).cat;
      const from = r.category;
      if (!to || to === from) { redraw(); return; }
      reviewDone[id] = { type: 'cat', from, to };
      failed = !(await rvSetCategory(r, to));
      if (failed) { delete reviewDone[id]; dbOverrides[id] = from; }
      rvRefreshApp();
    } else if (act === 'undo' && r) {
      const d = reviewDone[id];
      if (d && d.type === 'hide') { failed = !(await rvSetHidden(r, false)); if (failed) hiddenIds.add(id); }
      else if (d && d.type === 'cat') failed = !(await rvSetCategory(r, d.from));
      if (!failed) delete reviewDone[id];
      rvRefreshApp();
    } else if (act === 'bulkcat' || act === 'bulkhide') {
      const rows = rvCatRows().filter(x => !x.done);
      const isHide = act === 'bulkhide';
      const todo = rows.filter(x => isHide ? x.v.noReceta : (!x.v.noReceta && x.v.cat && x.v.cat !== x.r.category));
      reviewConfirm = null;
      let n = 0;
      const msgEl = document.getElementById('rvMsg');
      const fails = await rvPool(todo, async ({ r: rr, v }) => {
        const from = rr.category;
        const ok = isHide ? await rvSetHidden(rr, true) : await rvSetCategory(rr, v.cat);
        if (ok) reviewDone[rr.id] = isHide ? { type: 'hide' } : { type: 'cat', from, to: v.cat };
        else if (isHide) hiddenIds.delete(rr.id); else dbOverrides[rr.id] = from;
        n++;
        if (msgEl) msgEl.textContent = 'Aplicando… ' + n + ' de ' + todo.length;
        return ok;
      }, 5);
      reviewMsg = fails ? ('Hecho, pero ' + fails + ' no se han podido guardar. Inténtalo de nuevo con esas.') : ('Hecho: ' + (todo.length - fails) + '. Puedes deshacer cada una.');
      rvRefreshApp();
      redraw();
      return;
    }
    reviewMsg = failed ? 'No se ha podido guardar el cambio. Revisa la conexión e inténtalo de nuevo.' : '';
    redraw();
  }

  async function openReview() {

  // ---- Copia de seguridad ---------------------------------------------------
  // Descarga un JSON con todas las colecciones de la nube (incluido el plan, que es
  // privado) y la lista de la compra. Si alguna lectura falla, NO se genera archivo:
  // una copia incompleta que parece completa es peor que ninguna.
  const BACKUP_COLLECTIONS = ['overrides', 'manual_recipes', 'hidden', 'notes', 'edits', 'tags', 'plan'];

  async function downloadBackup() {
    const btn = document.getElementById('backupBtn');
    const status = document.getElementById('backupStatus');
    const say = (t) => { if (status) status.textContent = t; };
    if (btn) btn.disabled = true;
    say('Preparando la copia…');
    try {
      const colecciones = {};
      for (const name of BACKUP_COLLECTIONS) {
        const docs = await apiGetCollection(name);
        if (docs === null) throw new Error('No se pudo leer «' + name + '».');
        colecciones[name] = docs.map(d => ({ id: d.id, data: d.data }));
      }
      const sl = await slCall({ op: 'list' });
      if (!sl.ok) throw new Error('No se pudo leer la lista de la compra.');
      colecciones.shopping = (sl.data.items || []).map(i => ({ id: i.id, data: { text: i.text, checked: i.checked, sources: i.sources, ts: i.ts } }));

      const now = new Date();
      const backup = {
        app: 'recetario',
        version: 1,
        fecha: now.toISOString(),
        nota: 'Las recetas base están en recipes.json del repositorio; aquí solo está lo que añades o cambias tú.',
        colecciones,
        locales: { favoritas: Array.from(favs) }
      };
      const blob = new Blob([JSON.stringify(backup, null, 1)], { type: 'application/json' });
      const pad = n => String(n).padStart(2, '0');
      const fname = 'recetario-copia-' + now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) + '.json';
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = fname;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      const total = Object.values(colecciones).reduce((s, l) => s + l.length, 0);
      say('✓ Copia descargada (' + fname + ', ' + total + ' elementos).');
    } catch (e) {
      console.error('backup', e);
      say('No se ha podido hacer la copia: ' + (e && e.message ? e.message : 'error de conexión') + ' Inténtalo de nuevo.');
    }
    if (btn) btn.disabled = false;
  }

  // ---- Weekly plan ------------------------------------------------------

  const PLAN_DAYS = [
    {key:"lunes", label:"Lunes"},
    {key:"martes", label:"Martes"},
    {key:"miercoles", label:"Miércoles"},
    {key:"jueves", label:"Jueves"},
    {key:"viernes", label:"Viernes"},
    {key:"sabado", label:"Sábado"},
    {key:"domingo", label:"Domingo"}
  ];
  const PLAN_SLOTS = [{key:"comida", label:"Comida"}, {key:"cena", label:"Cena"}, {key:"bebe", label:"Bebé"}];

  const PLANKEY = "recetario_local_plan_v1";
  let plan = {};
  let planViewOpen = false;

  function initLocalPlan() {
    try { plan = JSON.parse(localStorage.getItem(PLANKEY) || "{}"); } catch (e) { plan = {}; }
  }
  function saveLocalPlan() {
    try { localStorage.setItem(PLANKEY, JSON.stringify(plan)); } catch (e) {}
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function savePlanSlot(slotKey, recipeId, skipRender) {
    plan[slotKey] = recipeId;
    if (!skipRender && planViewOpen) openPlanView();
    if (canEdit) {
      apiSetDoc('plan', slotKey, { recipeId: recipeId || '' });
    } else {
      saveLocalPlan();
    }
  }

  const MAIN_CATEGORIES = new Set(["Carne","Pescado","Verduras","Pasta","Arroces","Pizzas","Sandwiches y Bocadillos"]);
  const STARTER_CATEGORIES = new Set(["Entrantes y Aperitivos","Sopas y Cremas","Ensaladas"]);
  const GUIDE_TITLE_RE = /^(gu[ií]a|c[oó]mo|consejo|truco|idea[s]?|primeros alimentos|qu[eé]\s|men[uú]|plan (de|semanal)|batch cooking|especias para|alimentaci[oó]n|\d+\s+(ideas?|formas?|recetas?|maneras?|trucos?|consejos?)\b)/i;
  const BABY_TREAT_RE = /(porridge|papilla|helado|gelatina|torrija|kinder|compota|mousse|flan|pud[ií]n|bizcocho|galleta|batido|yogur)/i;
  // some "Verduras"/other-category titles are actually soups, broths or bases,
  // not a full standalone dish - keep those out of the "main course" pool
  const SOUP_LIKE_RE = /(sopa|crema de|vichyssoise|gazpacho|consom[eé]|veloute|velout[eé]|potaje|caldo)/i;
  const NOT_A_DISH_RE = /(pastillas? de|concentrado de|fondo de|base (de|para))/i;

  function isRealMain(r) {
    const title = (r.title || '').trim();
    if (GUIDE_TITLE_RE.test(title) || NOT_A_DISH_RE.test(title) || SOUP_LIKE_RE.test(title)) return false;
    return MAIN_CATEGORIES.has(r.category);
  }
  function isRealStarter(r) {
    return STARTER_CATEGORIES.has(r.category) && !GUIDE_TITLE_RE.test((r.title || '').trim());
  }
  function isRealBabyDish(r) {
    return r.category === 'Bebe' && !GUIDE_TITLE_RE.test((r.title || '').trim()) && !BABY_TREAT_RE.test(r.title || '');
  }

  function titleGroupTags(r) {
    const words = norm(r.title + ' ' + catLabel(r.category)).split(/\s+/);
    const tags = new Set();
    words.forEach(w => {
      SYNONYM_GROUPS.forEach((group, i) => {
        if (group.some(g => w.includes(g) || g.includes(w))) tags.add(i);
      });
    });
    return tags;
  }
  function sharesGroup(rA, rB) {
    const tagsA = titleGroupTags(rA);
    for (const t of titleGroupTags(rB)) if (tagsA.has(t)) return true;
    return false;
  }

  // finer-grained than SYNONYM_GROUPS: used only to avoid repeating the same
  // protein two slots in a row when planning the week (chicken, beef, salmon...)
  const PROTEIN_GROUPS = [
    ["pollo"], ["pavo"], ["ternera","vacuno","buey","wagyu"], ["cerdo","panceta","bacon","cochinillo","secreto","presa"],
    ["cordero"], ["salmon"], ["atun"], ["merluza","bacalao","rape","lubina","dorada","trucha"],
    ["gamba","langostino","marisco","mejillon","calamar","pulpo","sepia","boqueron","sardina"]
  ];
  function proteinTags(r) {
    const t = norm(r.title);
    const tags = new Set();
    PROTEIN_GROUPS.forEach((group, i) => { if (group.some(k => t.includes(k))) tags.add(i); });
    return tags;
  }

  function autofillPlan() {
    const usedMain = new Set();
    const usedStarter = new Set();
    const usedBaby = new Set();
    const isUsable = r => !hiddenIds.has(r.id) && !isLowContent(r);
    const favPool = shuffle(recipes.filter(r => favs.has(r.id) && isUsable(r) && isRealMain(r)));
    const ratedPool = shuffle(recipes.filter(r => (myRatings[r.id]||0) >= 4 && isUsable(r) && isRealMain(r) && !favs.has(r.id)));
    const anyPool = shuffle(recipes.filter(r => isUsable(r) && isRealMain(r) && !favs.has(r.id) && (myRatings[r.id]||0) < 4));
    const mainPool = [...favPool, ...ratedPool, ...anyPool];
    const starterPool = shuffle(recipes.filter(r => isUsable(r) && isRealStarter(r)));
    const babyPool = shuffle(recipes.filter(r => isUsable(r) && isRealBabyDish(r)));

    function nextFrom(pool, used, idxRef) {
      if (!pool.length) return null;
      for (let tries = 0; tries < pool.length; tries++) {
        const cand = pool[idxRef.i % pool.length];
        idxRef.i++;
        if (!used.has(cand.id) || used.size >= pool.length) { used.add(cand.id); return cand; }
      }
      return pool[0];
    }
    // like nextFrom, but tries first to avoid the protein/category used in the
    // immediately previous slot, so the week doesn't repeat "pollo" back to back
    function nextMain(pool, used, idxRef, avoidTags, avoidCategory) {
      if (!pool.length) return null;
      for (let tries = 0; tries < pool.length; tries++) {
        const cand = pool[idxRef.i % pool.length];
        idxRef.i++;
        if (used.has(cand.id) && used.size < pool.length) continue;
        const tags = proteinTags(cand);
        const proteinClash = avoidTags && avoidTags.size && [...tags].some(t => avoidTags.has(t));
        const catClash = avoidCategory && cand.category === avoidCategory;
        if (!proteinClash && !catClash) { used.add(cand.id); return { recipe: cand, tags }; }
      }
      const fallback = nextFrom(pool, used, idxRef);
      return fallback ? { recipe: fallback, tags: proteinTags(fallback) } : null;
    }
    const mainIdxRef = { i: 0 };
    const starterIdxRef = { i: 0 };
    const babyIdxRef = { i: 0 };
    const recipeById = id => recipes.find(x => x.id === id);

    let lastProteinTags = null;
    let lastCategory = null;

    PLAN_DAYS.forEach(day => {
      const keys = {
        comida: day.key + '_comida', comidaEntrante: day.key + '_comida_entrante',
        cena: day.key + '_cena', cenaEntrante: day.key + '_cena_entrante',
        bebe: day.key + '_bebe'
      };

      [
        { main: 'comida', starter: 'comidaEntrante' },
        { main: 'cena', starter: 'cenaEntrante' }
      ].forEach(slot => {
        const mainKey = keys[slot.main];
        const starterKey = keys[slot.starter];
        if (!plan[mainKey]) {
          const picked = nextMain(mainPool, usedMain, mainIdxRef, lastProteinTags, lastCategory);
          if (picked) {
            savePlanSlot(mainKey, picked.recipe.id, true);
            lastProteinTags = picked.tags;
            lastCategory = picked.recipe.category;
          }
        } else {
          const existing = recipeById(plan[mainKey]);
          if (existing) { lastProteinTags = proteinTags(existing); lastCategory = existing.category; }
        }
        if (!plan[starterKey] && starterPool.length && Math.random() < 0.5) {
          const st = nextFrom(starterPool, usedStarter, starterIdxRef);
          if (st) savePlanSlot(starterKey, st.id, true);
        }
      });

      if (!plan[keys.bebe]) {
        const comidaR = plan[keys.comida] ? recipeById(plan[keys.comida]) : null;
        const cenaR = plan[keys.cena] ? recipeById(plan[keys.cena]) : null;
        const matchesArr = babyPool.filter(b => (cenaR && sharesGroup(b, cenaR)) || (comidaR && sharesGroup(b, comidaR)));
        let pick = matchesArr.find(b => !usedBaby.has(b.id)) || matchesArr[0] || null;
        if (pick) usedBaby.add(pick.id);
        else pick = nextFrom(babyPool, usedBaby, babyIdxRef);
        if (pick) savePlanSlot(keys.bebe, pick.id, true);
      }
    });
    openPlanView();
  }

  function clearPlan() {
    PLAN_DAYS.forEach(day => {
      PLAN_SLOTS.forEach(slot => {
        savePlanSlot(day.key + '_' + slot.key, '', true);
      });
      savePlanSlot(day.key + '_comida_entrante', '', true);
      savePlanSlot(day.key + '_cena_entrante', '', true);
    });
    openPlanView();
  }

  function openPlanPicker(slotKey) {
    const isBebe = slotKey.endsWith('_bebe');
    let filterText = '';

    function listHtml() {
      const q = norm(filterText);
      let pool = recipes.filter(r => !hiddenIds.has(r.id) && !isLowContent(r));
      if (isBebe) pool = pool.filter(r => r.category === 'Bebe');
      if (q) pool = pool.filter(r => queryMatchesRecipe(q, r));
      pool = pool.slice(0, 60);
      if (!pool.length) return '<p class="cart-empty-hint">Sin resultados.</p>';
      return pool.map(r => '<button type="button" class="plan-pick-item" data-assign="' + r.id + '">' + escapeHtml(r.title) + ' <span class="tag" style="margin-left:6px">' + escapeHtml(catLabel(r.category)) + '</span></button>').join('');
    }

    function renderPicker() {
      const existingVal = plan[slotKey] || '';
      const existingCustom = existingVal.startsWith('custom:') ? existingVal.slice(7) : '';
      overlayRoot.innerHTML =
        '<div class="overlay" id="ov">' +
          '<div class="sheet" role="dialog" aria-modal="true">' +
            '<div class="sheet-top"><h2>Elegir plato</h2>' +
            '<button class="close-btn" id="closeBtn" aria-label="Cerrar">✕</button></div>' +
            '<div style="display:flex;gap:8px;margin-bottom:14px;align-items:center">' +
              '<input id="customMealInp" type="text" class="form-inp" placeholder="Escribe el nombre del plato…" value="' + escapeAttr(existingCustom) + '" style="flex:1;font-size:15px">' +
              '<button id="customMealBtn" type="button" class="surprise-btn" style="white-space:nowrap;flex:none">Guardar</button>' +
            '</div>' +
            '<p class="form-hint" style="margin:-8px 0 12px">O busca en el recetario:</p>' +
            '<div class="searchbox" style="margin-bottom:12px">' +
              '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>' +
              '<input id="pickSearch" type="text" placeholder="Buscar receta..." autocomplete="off" value="' + escapeAttr(filterText) + '">' +
            '</div>' +
            '<div id="pickList" class="plan-pick-list">' + listHtml() + '</div>' +
          '</div>' +
        '</div>';
      document.getElementById('closeBtn').addEventListener('click', () => openPlanView());
      document.getElementById('ov').addEventListener('click', (e) => { if (e.target.id === 'ov') openPlanView(); });
      document.addEventListener('keydown', escClose);

      const customInp = document.getElementById('customMealInp');
      const customBtn = document.getElementById('customMealBtn');
      function saveCustomMeal() {
        const text = customInp.value.trim();
        if (!text) return;
        savePlanSlot(slotKey, 'custom:' + text, true);
        openPlanView();
      }
      customBtn.addEventListener('click', saveCustomMeal);
      customInp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); saveCustomMeal(); } });

      const input = document.getElementById('pickSearch');
      let pickDebounce;
      input.addEventListener('input', () => {
        clearTimeout(pickDebounce);
        pickDebounce = setTimeout(() => {
          filterText = input.value;
          document.getElementById('pickList').innerHTML = listHtml();
          document.getElementById('pickList').querySelectorAll('[data-assign]').forEach(bindAssign);
        }, 150);
      });
      document.getElementById('pickList').querySelectorAll('[data-assign]').forEach(bindAssign);
      // focus the custom input if slot was already custom, otherwise focus search
      if (existingCustom) customInp.focus(); else input.focus();
    }
    function bindAssign(btn) {
      btn.addEventListener('click', () => {
        savePlanSlot(slotKey, btn.getAttribute('data-assign'), true);
        openPlanView();
      });
    }
    renderPicker();
  }

  function planSlotRowHtml(key, label, opts) {
    opts = opts || {};
    const slotVal = plan[key] || '';
    const isCustom = slotVal.startsWith('custom:');
    const r = (!isCustom && slotVal) ? recipes.find(x => x.id === slotVal) : null;
    const displayText = isCustom ? slotVal.slice(7) : (r ? r.title : null);
    const hasContent = displayText !== null;
    return '<div class="plan-slot' + (opts.sub ? ' plan-slot-sub' : '') + '">' +
      '<span class="plan-slot-label">' + escapeHtml(label) + '</span>' +
      '<span class="plan-slot-recipe' + (hasContent ? '' : ' empty') + '" data-slotview="' + key + '">' +
        (hasContent ? escapeHtml(displayText) : (opts.emptyLabel || 'Elegir receta…')) +
      '</span>' +
      (hasContent ? '<button type="button" class="plan-clear-btn" data-slotedit="' + key + '" aria-label="Cambiar" title="Cambiar">✏️</button>' : '') +
      (hasContent ? '<button type="button" class="plan-clear-btn" data-slotclear="' + key + '" aria-label="Quitar">✕</button>' : '') +
    '</div>';
  }

  function openPlanView() {
    planViewOpen = true;
    const daysHtml = PLAN_DAYS.map(day => {
      const slotsHtml = PLAN_SLOTS.map(slot => {
        const key = day.key + '_' + slot.key;
        let html = planSlotRowHtml(key, slot.label);
        if (slot.key === 'comida' || slot.key === 'cena') {
          html += planSlotRowHtml(day.key + '_' + slot.key + '_entrante', 'Entrante', { sub: true, emptyLabel: 'Añadir entrante (opcional)…' });
        }
        return html;
      }).join('');
      return '<div class="plan-day"><h3>' + escapeHtml(day.label) + '</h3>' + slotsHtml + '</div>';
    }).join('');

    overlayRoot.innerHTML =
      '<div class="overlay" id="ov">' +
        '<div class="sheet" role="dialog" aria-modal="true">' +
          '<div class="sheet-top"><h2>Plan semanal</h2>' +
          '<button class="close-btn" id="closeBtn" aria-label="Cerrar">✕</button></div>' +
          '<p class="form-hint" style="margin:-4px 0 12px">' + (canEdit ? 'Plan compartido: lo ves igual en todos los dispositivos con el código de edición.' : 'Tu plan personal: se guarda solo en este dispositivo/navegador.') + '</p>' +
          '<div class="plan-toolbar">' +
            '<button type="button" class="surprise-btn" id="autofillBtn">🎲 Planifícamela</button>' +
            '<button type="button" class="surprise-btn" id="genListBtn" style="background:var(--accent);color:var(--accent-ink);border-color:var(--accent)">🛒 Generar lista</button>' +
            '<button type="button" class="delete-link" id="clearPlanBtn">Vaciar plan</button>' +
          '</div>' +
          daysHtml +
        '</div>' +
      '</div>';
    document.getElementById('closeBtn').addEventListener('click', closeDetail);
    document.getElementById('ov').addEventListener('click', (e) => { if (e.target.id === 'ov') closeDetail(); });
    document.addEventListener('keydown', escClose);
    document.getElementById('autofillBtn').addEventListener('click', autofillPlan);
    document.getElementById('clearPlanBtn').addEventListener('click', clearPlan);
    document.getElementById('genListBtn').addEventListener('click', () => { closeDetail(); openShoppingReview(); });
    overlayRoot.querySelectorAll('[data-slotview]').forEach(el => {
      el.addEventListener('click', () => {
        const key = el.getAttribute('data-slotview');
        const slotVal = plan[key] || '';
        if (slotVal.startsWith('custom:')) { openPlanPicker(key); return; }
        const r = slotVal ? recipes.find(x => x.id === slotVal) : null;
        if (r) openDetail(r);
        else openPlanPicker(key);
      });
    });
    overlayRoot.querySelectorAll('[data-slotedit]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        openPlanPicker(el.getAttribute('data-slotedit'));
      });
    });
    overlayRoot.querySelectorAll('[data-slotclear]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        savePlanSlot(el.getAttribute('data-slotclear'), '');
      });
    });
  }

  // ---- Boot ---------------------------------------------------------------

  async function initRemote() {
    const code = getStoredPasscode();
    if (code) {
      canEdit = await verifyPasscode(code);
      if (!canEdit) clearStoredPasscode();
    }
    if (canEdit) addRecipeBtn.hidden = false;
    updateEditModeUI();

    startPolling('overrides', applyOverridesDocs, 45000);
    startPolling('manual_recipes', applyManualDocs, 45000);
    startPolling('hidden', applyHiddenDocs, 45000);
    startPolling('notes', applyNotesDocs, 45000);
    startPolling('edits', applyEditsDocs, 45000);
    startPolling('tags', applyTagsDocs, 45000);
    if (canEdit) {
      startPolling('plan', applyPlanDocs, 15000);
      slStart();
    } else {
      initLocalPlan();
    }
  }

  let debounceTimer;
  searchEl.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      state.q = norm(searchEl.value.trim());
      state.visible = PAGE_SIZE;
      render();
    }, 200);
  });
  searchEl.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    clearTimeout(debounceTimer);
    state.q = norm(searchEl.value.trim());
    state.visible = PAGE_SIZE;
    render();
    searchEl.blur();
  });

  loadMoreBtn.addEventListener('click', () => {
    state.visible += PAGE_SIZE;
    render();
  });

  function updateStats() {
    const visible = recipes.filter(r => !hiddenIds.has(r.id));
    document.getElementById('statTotal').textContent = visible.length;
    document.getElementById('statCats').textContent = new Set(visible.map(r=>r.category)).size;
  }

  fetch('recipes.json')
    .then(r => r.json())
    .then(data => {
      recipes = data;
      applyOverrides();
      updateStats();
      document.getElementById('statFav').textContent = favs.size;
      render();
      showCookResume();
    })
    .catch(err => {
      countLine.textContent = "No se pudieron cargar las recetas.";
      console.error(err);
    });

  // Handle Web Share Target: when the user shares a link (Instagram or any other
  // recipe page) to this PWA, the OS opens the app with ?url=...&text=...&title=...
  // We detect those params, open the add form, and clean the URL so Back works.
  function handleShareTarget() {
    const params = new URLSearchParams(location.search);
    const sharedUrl = params.get('url') || '';
    const sharedText = params.get('text') || '';
    if (!sharedUrl && !sharedText) return;
    // Remove query params from URL so refreshing / using Back doesn't re-trigger
    history.replaceState(null, '', location.pathname);
    if (!canEdit) return; // need edit mode to add recipes
    let importUrl = '';
    if (sharedUrl) { try { new URL(sharedUrl); importUrl = sharedUrl; } catch (e) {} }
    const rawText = (sharedText + (sharedUrl && !importUrl ? ' ' + sharedUrl : '')).trim();
    if (importUrl) {
      openAddForm({ igUrl: importUrl });
    } else if (rawText) {
      openAddForm({ prefill: rawText });
    } else {
      openAddForm();
    }
  }

  initRemote().then(handleShareTarget);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(e => console.error('sw register failed', e));
    });
  }
})();
</script>
