<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harina, huevo y pan rallao</title>
<meta name="description" content="Harina, huevo y pan rallao: recetas de mi madre, de mi abuela y de Instagram. Cocina como antes pero ahora.">
<meta name="theme-color" content="#EFEFE3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1C15" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Harina, huevo y pan rallao">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Karla:wght@400;500;600;700&family=Dancing+Script:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --paper: #EFEFE3;
    --card: #F9F9F1;
    --ink: #262519;
    --ink-soft: #5B5A4A;
    --line: rgba(38,37,25,0.14);
    --accent: #3F5E33;
    --accent-ink: #F4F6EE;
    --accent-2: #B9702E;
    --accent-2-soft: rgba(185,112,46,0.14);
    --accent-soft: rgba(63,94,51,0.12);
    --shadow: 0 1px 2px rgba(38,37,25,0.06);
    --focus: #B9702E;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1A1C15;
      --card: #22241C;
      --ink: #ECEBDD;
      --ink-soft: #ABA994;
      --line: rgba(236,235,221,0.14);
      --accent: #8FBF78;
      --accent-ink: #14200F;
      --accent-2: #E6A15B;
      --accent-2-soft: rgba(230,161,91,0.16);
      --accent-soft: rgba(143,191,120,0.14);
      --shadow: 0 1px 2px rgba(0,0,0,0.3);
      --focus: #E6A15B;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1A1C15;
    --card: #22241C;
    --ink: #ECEBDD;
    --ink-soft: #ABA994;
    --line: rgba(236,235,221,0.14);
    --accent: #8FBF78;
    --accent-ink: #14200F;
    --accent-2: #E6A15B;
    --accent-2-soft: rgba(230,161,91,0.16);
    --accent-soft: rgba(143,191,120,0.14);
    --shadow: 0 1px 2px rgba(0,0,0,0.3);
    --focus: #E6A15B;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html { height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Karla', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom);
  }
  h1, h2, h3, .display {
    font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
    font-weight: 600;
    text-wrap: balance;
    letter-spacing: -0.01em;
  }

  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 20px 80px; padding-top: calc(28px + env(safe-area-inset-top)); }

  header.top {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 22px;
  }
  h1.title {
    font-family: 'Dancing Script', cursive;
    font-weight: 700;
    font-size: clamp(38px, 8vw, 56px);
    margin: 2px 0 4px;
    font-style: normal;
  }
  .subtitle {
    font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif;
    color: var(--ink-soft);
    font-size: 14.5px;
    margin: 0;
  }
  .stats {
    margin-top: 10px;
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    font-variant-numeric: tabular-nums;
  }
  .stat { font-size: 13px; color: var(--ink-soft); }
  .stat b { color: var(--ink); font-size: 15px; font-weight: 700; }

  .controls {
    position: sticky;
    top: 0;
    background: var(--paper);
    padding: 14px 0 12px;
    padding-top: calc(14px + env(safe-area-inset-top));
    margin-top: calc(-1 * env(safe-area-inset-top));
    z-index: 5;
    border-bottom: 1px solid var(--line);
    margin-bottom: 18px;
  }
  .search-row {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .searchbox {
    position: relative;
    flex: 1;
    min-width: 160px;
  }
  .add-btn {
    flex: none;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    padding: 0 16px;
    border-radius: 10px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
    white-space: nowrap;
  }
  .add-btn:hover { opacity: .92; }
  .add-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .cart-toggle-btn {
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
  }
  .cart-toggle-btn #cartCount {
    background: var(--accent-2);
    color: var(--accent-ink);
    border-radius: 999px;
    padding: 1px 7px;
    font-size: 12px;
    margin-left: 2px;
  }
  .count-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .count-row .count-line { margin: 0; }
  .surprise-btn {
    flex: none;
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
    cursor: pointer;
  }
  .surprise-btn:hover { background: var(--accent); color: var(--accent-ink); }
  .surprise-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .cart-btn { flex: none; background: none; border: none; cursor: pointer; font-size: 16px; line-height: 1; color: var(--line); padding: 2px; }
  .cart-btn.on { color: var(--accent); }
  .cart-item { display: flex; flex-direction: column; gap: 6px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .cart-item:last-child { border-bottom: none; }
  .cart-item-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .cart-item-top h3 { font-size: 16px; margin: 0; font-weight: 600; }
  .cart-remove { background: none; border: none; color: var(--ink-soft); cursor: pointer; font-size: 13px; text-decoration: underline; padding: 0; }
  .cart-ingredients { font-size: 13.5px; color: var(--ink); line-height: 1.55; white-space: pre-wrap; }
  .cart-empty-hint { color: var(--ink-soft); font-size: 13.5px; }
  .searchbox input {
    width: 100%;
    font: inherit;
    font-size: 16px;
    padding: 12px 14px 12px 40px;
    border-radius: 999px;
    border: 1.5px solid var(--ink-soft);
    background: var(--card);
    color: var(--ink);
  }
  .searchbox input:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 1px;
  }
  .searchbox svg {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-soft);
    pointer-events: none;
  }
  .filter-row { display: flex; }
  .filter-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink-soft);
    cursor: pointer;
    transition: background .12s, color .12s, border-color .12s;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--ink); }
  .filter-btn .n { font-variant-numeric: tabular-nums; opacity: .75; }
  .filter-btn.active {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }
  .filter-btn.active .n { opacity: .85; }
  .sort-select {
    font: inherit;
    font-size: 13.5px;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink-soft);
    cursor: pointer;
  }
  .sort-select:hover { border-color: var(--accent); color: var(--ink); }
  .sort-select:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .filter-pick-list { display: flex; flex-direction: column; gap: 6px; max-height: 65vh; overflow-y: auto; }
  .filter-pick-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    font: inherit;
    font-size: 14.5px;
    font-weight: 600;
    text-align: left;
    padding: 11px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
  }
  .filter-pick-item:hover { border-color: var(--accent); }
  .filter-pick-item.active {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }
  .filter-pick-item .n { font-variant-numeric: tabular-nums; opacity: .8; }
  .chip:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 15px 13px;
    cursor: pointer;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 8px;
    text-align: left;
    font: inherit;
    color: inherit;
  }
  .card:hover { border-color: var(--accent); }
  .card:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .card h3 {
    font-size: 17px;
    margin: 0;
    line-height: 1.28;
    font-weight: 500;
  }
  .fav-btn {
    flex: none;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    color: var(--line);
    padding: 2px;
  }
  .fav-btn.on { color: var(--accent-2); }
  .tag {
    align-self: flex-start;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--accent-2-soft);
    color: var(--accent-2);
  }
  button.tag { border: none; cursor: pointer; font-family: inherit; }
  button.tag:hover { background: var(--accent-2); color: var(--accent-ink); }
  button.tag:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
  }
  .empty .display { font-size: 22px; color: var(--ink); margin-bottom: 6px; }

  .loadmore {
    display: block;
    margin: 26px auto 0;
    font: inherit;
    font-weight: 700;
    font-size: 14px;
    padding: 11px 22px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
  }
  .loadmore:hover { border-color: var(--accent); }

  .count-line { color: var(--ink-soft); font-size: 13px; margin: 0 0 14px; }

  /* detail overlay */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(20,20,12,0.45);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 30;
  }
  @media (min-width: 640px) {
    .overlay { align-items: center; padding: 24px; }
  }
  .sheet {
    background: var(--paper);
    width: 100%;
    max-width: 640px;
    max-height: 88vh;
    border-radius: 18px 18px 0 0;
    overflow-y: auto;
    padding: 22px 22px 30px;
    padding-bottom: calc(30px + env(safe-area-inset-bottom));
    position: relative;
    border: 1px solid var(--line);
  }
  @media (min-width: 640px) {
    .sheet { border-radius: 16px; }
  }
  .sheet-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
  .sheet h2, .recipe-page h2 { font-size: 24px; margin: 0; font-style: italic; }
  .close-btn {
    flex: none;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--ink-soft);
  }

  /* recipe detail: full page, not an overlay sheet */
  .recipe-page {
    position: fixed; inset: 0;
    background: var(--paper);
    z-index: 40;
    overflow-y: auto;
    padding: 16px 20px 30px;
    padding-top: calc(16px + env(safe-area-inset-top));
    padding-bottom: calc(30px + env(safe-area-inset-bottom));
  }
  .recipe-page .page-top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .recipe-page .page-top h2, .recipe-page .page-top .edit-title-input { flex: 1; }
  .ig-embed { display: flex; justify-content: center; margin: 22px 0 16px; padding-top: 20px; border-top: 1px solid var(--line); min-height: 60px; }
  .ig-embed iframe { max-width: 100%; }
  .back-btn {
    flex: none;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--ink);
    font-size: 18px;
    line-height: 1;
  }

  .sheet .meta-row, .recipe-page .meta-row { display: flex; align-items: center; gap: 10px; margin: 10px 0 16px; flex-wrap: wrap; }
  .sheet .body-text, .recipe-page .body-text {
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink);
  }
  .body-text h3 {
    font-family: 'Karla', ui-sans-serif, system-ui, sans-serif;
    font-size: 12.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .03em;
    color: var(--ink-soft);
    margin: 18px 0 8px;
  }
  .body-text h3:first-child { margin-top: 0; }
  .body-text h3::before {
    content: "";
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 2px;
    margin-right: 7px;
    vertical-align: middle;
    background: currentColor;
  }
  .body-text ul, .body-text ol { margin: 0; padding-left: 22px; }
  .body-text li { margin-bottom: 7px; line-height: 1.55; }
  .body-text .section-block { margin-bottom: 22px; }
  .body-text .section-block:last-child { margin-bottom: 0; }

  .section-ingredients h3 { color: var(--accent); }
  .section-ingredients ul { list-style: none; padding-left: 0; }
  .section-ingredients li { position: relative; padding-left: 20px; }
  .section-ingredients li::before {
    content: "";
    position: absolute; left: 2px; top: 8px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
  }

  .section-steps ol { list-style: none; padding-left: 0; counter-reset: step; }
  .section-steps li {
    position: relative;
    padding-left: 34px;
    counter-increment: step;
    margin-bottom: 14px;
  }
  .section-steps li::before {
    content: counter(step);
    position: absolute; left: 0; top: -1px;
    width: 23px; height: 23px;
    border-radius: 50%;
    background: var(--paper);
    border: 1.5px solid var(--ink-soft);
    color: var(--ink);
    font-family: 'Karla', ui-sans-serif, system-ui, sans-serif;
    font-size: 12px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
  }

  .section-tips {
    background: var(--accent-2-soft);
    border-left: 3px solid var(--accent-2);
    border-radius: 4px 10px 10px 4px;
    padding: 14px 16px;
  }
  .section-tips h3 { color: var(--accent-2); margin-top: 0; }
  .section-tips ul { list-style: none; padding-left: 0; }
  .section-tips li { display: flex; gap: 8px; align-items: flex-start; }
  .section-tips li::before {
    content: "→";
    color: var(--accent-2);
    font-weight: 700;
    flex-shrink: 0;
  }
  .edit-section-label { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--ink-soft); display: block; margin: 14px 0 6px; }
  .edit-section-label:first-of-type { margin-top: 0; }
  .cat-select {
    font: inherit;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .03em;
    text-transform: uppercase;
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid var(--accent-2);
    background: var(--accent-2-soft);
    color: var(--accent-2);
    cursor: pointer;
  }
  .cat-select:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  .edit-title-input {
    font-family: 'Fraunces', Georgia, serif;
    font-style: italic;
    font-size: 22px;
    font-weight: 600;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 10px;
    width: 100%;
    margin-right: 8px;
  }
  .edit-title-input:focus-visible { outline: 2px solid var(--focus); }
  .edit-toolbar { display: flex; align-items: center; gap: 10px; margin: 10px 0 6px; }
  .bold-btn {
    font-family: Georgia, serif;
    font-weight: 700;
    font-size: 14px;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
  }
  .bold-btn:hover { border-color: var(--accent); }
  .edit-text-input {
    width: 100%;
    min-height: 220px;
    font: inherit;
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    resize: vertical;
  }
  .edit-text-input:focus-visible { outline: 2px solid var(--focus); }
  .rating-stars { display: inline-flex; gap: 2px; }
  .rating-stars .star { cursor: pointer; font-size: 17px; color: var(--line); }
  .rating-stars .star.on { color: var(--accent-2); }
  .notes-box { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .notes-row { display: flex; align-items: center; justify-content: space-between; }
  .notes-label { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--ink-soft); }
  .notes-box textarea {
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--card);
    min-height: 70px;
    resize: vertical;
  }
  .notes-box textarea:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .notes-box input[type="text"] {
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    padding: 9px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--card);
  }
  .notes-box input[type="text"]:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .tag-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag-chips:empty { display: none; }
  .tag-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12.5px;
    font-weight: 600;
    padding: 4px 6px 4px 10px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .tag-chip-x {
    font: inherit;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--accent);
    opacity: .7;
    font-size: 14px;
    line-height: 1;
    padding: 2px;
  }
  .tag-chip-x:hover { opacity: 1; }
  .tag-pills-row { display: flex; flex-wrap: wrap; gap: 6px; margin: -4px 0 14px; }
  .tag-pills-row:empty, .tag-suggest:empty { display: none; }
  .tag-add-row { display: flex; gap: 8px; margin-top: 8px; }
  .tag-add-row input { flex: 1; min-width: 0; }
  .tag-suggest { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
  .tag-suggest-lbl { font-size: 12px; color: var(--ink-soft); }
  .tag-sug { font: inherit; font-size: 12.5px; font-weight: 600; padding: 5px 11px; border-radius: 999px; border: 1px dashed var(--accent); background: none; color: var(--accent); cursor: pointer; }
  .tag-sug:hover { background: var(--accent-soft); }
  .tag-pill {
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid var(--accent);
    background: var(--accent-soft);
    color: var(--accent);

  function saveFavs() {

    document.getElementById('statFav').textContent = favs.size;
  }

  function saveShoppingItems() {
    shoppingItems.forEach((it, i) => { if (!it.ts) it.ts = Date.now() + i; });
    try { localStorage.setItem(SLKEY, JSON.stringify(shoppingItems)); } catch(e) {}
    updateCartBtn();
    slQueueChanges();
  }

  // ---- Lista de la compra sincronizada entre dispositivos --------------------
  // Solo con el modo edición activo (el servidor pide el código). Un documento por
  // producto; los cambios locales se comparan con lo último que el servidor conoce
  // (slSnapshot), se encolan (slOutbox, también offline) y cada 20 s se traen los del
  // otro dispositivo sin pisar cambios propios pendientes.
  const SL_SYNC_URL = "https://zfqpupvarjbwgcmiomcs.supabase.co/functions/v1/shopping-list";
  const SL_OUTBOX_KEY = "recetario_sl_outbox_v1";
  const SL_SNAP_KEY = "recetario_sl_snap_v1";
  const SL_MERGED_KEY = "recetario_sl_merged_v1";
  let slSyncOn = false, slFlushing = false, slPollTimer = null, slVersion = 0;
  let slSnapshot = new Map();
  let slOutbox = [];

  const slSer = it => JSON.stringify({ text: it.text, checked: !!it.checked, sources: it.sources || [], ts: it.ts });
  function slPersist() {
    try {
      localStorage.setItem(SL_SNAP_KEY, JSON.stringify(Object.fromEntries(slSnapshot)));
      localStorage.setItem(SL_OUTBOX_KEY, JSON.stringify(slOutbox));
    } catch (e) {}
  }
  function slReady() {
    try { return slSyncOn && localStorage.getItem(SL_MERGED_KEY) === '1'; } catch (e) { return false; }
  }
  async function slCall(payload) {
    const res = await fetch(SL_SYNC_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...payload, passcode: getStoredPasscode() || '' })
    });
    const data = await res.json().catch(() => ({}));
    return { status: res.status, ok: res.ok && data.ok, data };
  }

  function slQueueChanges() {
    if (!slReady()) return;
    slVersion++;
    const sets = [], deletes = [], ids = new Set();
    shoppingItems.forEach(it => {
      ids.add(it.id);
      const ser = slSer(it);
      if (slSnapshot.get(it.id) !== ser) {
        sets.push({ id: it.id, text: it.text, checked: !!it.checked, sources: it.sources || [], ts: it.ts });
        slSnapshot.set(it.id, ser);
      }
    });
    for (const id of Array.from(slSnapshot.keys())) {
      if (!ids.has(id)) { deletes.push(id); slSnapshot.delete(id); }
    }
    if (!sets.length && !deletes.length) return;
    const clear = shoppingItems.length === 0 && deletes.length > 1;
    slOutbox.push(clear ? { op: 'apply', clear: true } : { op: 'apply', sets, deletes });
    slPersist();
    slFlush();
  }

  async function slFlush() {
    if (slFlushing || !slSyncOn) return;
    slFlushing = true;
    try {
      while (slOutbox.length) {
        const r = await slCall(slOutbox[0]);
        if (!r.ok && r.status !== 400) break; // sin red / error del servidor: se reintenta luego
        slOutbox.shift(); // enviado (o petición inválida que no se puede reintentar)
        slPersist();
      }
    } catch (e) { /* sin conexión: queda en la cola */ }
    slFlushing = false;
  }

  async function slPoll() {
    if (!slSyncOn || document.hidden) return;
    await slFlush();
    if (slOutbox.length || slFlushing) return; // cambios locales pendientes: no se pisan
    const version = slVersion;
    let server;
    try {
      const r = await slCall({ op: 'list' });
      if (!r.ok) return;
      server = r.data.items || [];
    } catch (e) { return; }
    if (version !== slVersion || slOutbox.length) return; // el usuario tocó algo mientras tanto

    if (!slReady()) {
      // Primera vez en este dispositivo: se une lo del servidor con lo local (sin duplicar por texto)
      const known = new Set(server.map(i => norm(i.text)));
      const extra = shoppingItems.filter(i => !known.has(norm(i.text)));
      slSnapshot = new Map(server.map(i => [i.id, slSer(i)]));
      shoppingItems = server.concat(extra);
      try { localStorage.setItem(SL_MERGED_KEY, '1'); } catch (e) {}
      saveShoppingItems(); // sube lo local que el servidor no tenía
      slRefreshCart();
      return;
    }

    const local = new Map(shoppingItems.map(i => [i.id, slSer(i)]));
    const same = server.length === local.size && server.every(s => local.get(s.id) === slSer(s));
    if (same) return;
    shoppingItems = server;
    slSnapshot = new Map(server.map(i => [i.id, slSer(i)]));
    slPersist();
    try { localStorage.setItem(SLKEY, JSON.stringify(shoppingItems)); } catch (e) {}
    updateCartBtn();
    slRefreshCart();
  }

  // Si la lista está abierta, se repinta salvo que estés escribiendo en un campo
  function slRefreshCart() {
    if (!document.getElementById('slAddInp')) return;
    const a = document.activeElement;
    if (a && a.tagName === 'INPUT' && a.type === 'text' && a.value) return;
    renderCartOverlay();
  }

  function slStart() {
    if (slSyncOn) return;
    slSyncOn = true;
    try {
      slSnapshot = new Map(Object.entries(JSON.parse(localStorage.getItem(SL_SNAP_KEY) || '{}')));
      slOutbox = JSON.parse(localStorage.getItem(SL_OUTBOX_KEY) || '[]');
    } catch (e) { slSnapshot = new Map(); slOutbox = []; }
    slPoll();
    slPollTimer = setInterval(slPoll, 20000);
  }

  function slStop() {
    slSyncOn = false;
    clearInterval(slPollTimer);
    slSnapshot = new Map(); slOutbox = [];
    try {
      localStorage.removeItem(SL_MERGED_KEY);
      localStorage.removeItem(SL_SNAP_KEY);
      localStorage.removeItem(SL_OUTBOX_KEY);
    } catch (e) {}
  }

  document.addEventListener('visibilitychange', () => { if (!document.hidden) slPoll(); });
  window.addEventListener('online', () => { slFlush(); slPoll(); });

  function updateCartBtn() {

  function toggleCart(id, el) {

    else { cart.add(id); el.classList.add('on'); el.textContent = '✓'; }

  saveCart();
  updateCartBtn(); // reflect saved shopping items on boot

  function surpriseMe() {
    const filtered = recipes.filter(matches);
    if (!filtered.length) return;

  }

  function norm(s) {
    return (s || "").toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  }

  function hasRealRecipeContent(r) {
    return (r.ingredients && r.ingredients.length > 0) || (r.steps && r.steps.length > 0);
  }

  function isLowContent(r) {
    return !hasRealRecipeContent(r);
  }

  function rebuildHaystacks() {
    haystackCache.clear();
    titleCatCache.clear();
    filterOptionsCache = null;
    recipes.forEach(r => {
      haystackCache.set(r.id,
        norm(r.title) + ' ' + norm(catLabel(r.category)) + ' ' +
        norm((r.ingredients||[]).join(' ')) + ' ' +
        norm((r.steps||[]).join(' ')) + ' ' +
        norm((r.tips||[]).join(' '))
      );
      titleCatCache.set(r.id, norm(r.title) + ' ' + norm(catLabel(r.category)));
    });
  }

  function searchHaystack(r) {
    return haystackCache.get(r.id) ||
      (norm(r.title) + ' ' + norm(catLabel(r.category)) + ' ' +
       norm((r.ingredients||[]).join(' ')) + ' ' +
       norm((r.steps||[]).join(' ')) + ' ' +
       norm((r.tips||[]).join(' ')));
  }

  const SYNONYM_GROUPS = [
    ["pasta","espague","macarron","tallarin","tagliatelle","fideo","lasagna","lasana","canelon","raviol","gnocchi","noqui","penne","fusilli","spaghetti","linguine","fetuccin","tortellini"],
    ["legumbre","garbanzo","alubia","lenteja"],
    ["carne","pollo","pavo","ternera","cerdo","vacuno","cordero","buey"],
    ["pescado","marisco","salmon","atun","merluza","bacalao","lubina","gamba","langostino","mejillon","calamar","pulpo","sepia","sardina","trucha","boqueron"]
  ];

  function expandTerm(word) {
    for (const group of SYNONYM_GROUPS) {
      if (group.some(g => word.includes(g) || g.includes(word))) return group;
    }
    return null;
  }

  function titleCatHaystack(r) {
    return titleCatCache.get(r.id) || (norm(r.title) + ' ' + norm(catLabel(r.category)));
  }

  // Distintas formas de escribir lo mismo (sin acentos, ya normalizadas). Se comprueban
  // ANTES que los grupos amplios de arriba y buscan en todo el texto de la receta:
  // "ñoquis" encuentra gnocchi, no cualquier pasta.
  const VARIANT_GROUPS = [
    ["mahonesa","mayonesa"],
    ["noqui","gnocchi","nyoqui"],
    ["sandwich","sandwitch","sanduche","emparedado"],
    ["yogur","yogurt","yoghurt"],
    ["calabacin","zucchini","courgette"],
    ["aguacate","palta"],
    ["cacahuete","cacahuate"],
    ["batata","boniato","camote"],
    ["guisante","chicharo"],
    ["brocoli","brecol","broccoli"],
    ["fresa","frutilla"],
    ["tahin","tahini"],
    ["hummus","humus"],
    ["falafel","felafel"],
    ["quiche","kiche"],
    ["kebab","kebap","kebap"],
    ["tzatziki","tzaziki","tsatsiki"],
    ["bechamel","besamel"],
    ["ceviche","cebiche"],
    ["risotto","rissoto"],
    ["mozzarella","mozarela","mozzarela"],
    ["parmesano","parmigiano"],
    ["pistacho","pistachio"],
    ["airfryer","freidora"],
    ["tortita","pancake","panqueque"],
    ["croissant","cruasan"],
    ["berenjena","aubergine"]
  ];
  function variantGroupFor(word) {
    for (const group of VARIANT_GROUPS) {
      if (group.some(m => word === m || (word.length >= 4 && (m.indexOf(word) === 0 || word.indexOf(m) === 0)))) return group;
    }
    return null;
  }

  function queryMatchesRecipe(normalizedQuery, r) {
    const words = normalizedQuery.split(/\s+/).filter(Boolean);
    if (!words.length) return true;
    const fullHay = searchHaystack(r);
    const titleHay = titleCatHaystack(r);
    return words.every(w => {
      const variants = variantGroupFor(w);
      if (variants) return variants.some(v => fullHay.includes(v));
      const group = expandTerm(w);
      if (group) return group.some(v => titleHay.includes(v));
      return fullHay.includes(w);
    });
  }

  function isMix(r) { return !!r.mix; }

  // Fecha de incorporación a la app, derivada del id (sin depender de campos que no existen
  // en recipes.json ni de la fecha de edición/Instagram):
  // - recetas importadas en el volcado inicial: "n<numero>", el número refleja el orden de
  //   importación -> se usa como orden relativo (tier 0), nunca como fecha real.
  // - recetas añadidas a mano desde la app: "m" + Date.now().toString(36) (8 chars) + sufijo
  //   aleatorio -> el timestamp real de creación se puede decodificar (tier 1, siempre más
  //   recientes que el volcado inicial). Editar una receta no cambia su id, así que su orden
  //   de creación no se ve afectado por ediciones posteriores.
  const ES_COLLATOR = new Intl.Collator('es', { sensitivity: 'base' });
  function createdAtRank(r) {
    const m = /^m([0-9a-z]{8})/.exec(r.id);
    if (m) {
      const ts = parseInt(m[1], 36);
      if (!isNaN(ts)) return { tier: 1, key: ts };
    }
    const n = /^n(\d+)$/.exec(r.id);
    if (n) return { tier: 0, key: parseInt(n[1], 10) };
    return { tier: 0, key: 0 };
  }
  function compareCreatedAsc(a, b) {
    const ra = createdAtRank(a), rb = createdAtRank(b);
    if (ra.tier !== rb.tier) return ra.tier - rb.tier;
    return ra.key - rb.key;
  }
  function compareRecipes(a, b) {
    switch (state.sort) {
      case 'az': return ES_COLLATOR.compare(a.title, b.title);
      case 'za': return ES_COLLATOR.compare(b.title, a.title);
      case 'oldest': return compareCreatedAsc(a, b);
      case 'recent': default: return compareCreatedAsc(b, a);
    }
  }

  function matches(r) {
    if (hiddenIds.has(r.id)) return false;
    if (state.cat === "MIX") { if (!isMix(r)) return false; }
    else {
      if (isMix(r)) return false;
      if (isLowContent(r) && state.cat !== "REVISAR") return false;
      if (state.cat === "FAV") { if (!favs.has(r.id)) return false; }
      else if (state.cat === "REVISAR") { if (!isLowContent(r)) return false; }
      else if (state.cat.indexOf("TAG:") === 0) {
        const tagName = state.cat.slice(4);
        if (!r.tags || r.tags.indexOf(tagName) === -1) return false;
      }
      else if (state.cat !== "TODAS" && r.category !== state.cat) return false;
    }
    if (state.q) {
      if (!queryMatchesRecipe(state.q, r)) return false;
    }
    return true;
  }

  function computeFilterOptions() {
    if (filterOptionsCache) return filterOptionsCache;
    const counts = {};
    let lowContentCount = 0;
    let mixCount = 0;
    recipes.forEach(r => {
      if (hiddenIds.has(r.id)) return;
      if (isMix(r)) { mixCount++; return; }
      if (isLowContent(r)) { lowContentCount++; return; }
      counts[r.category] = (counts[r.category]||0) + 1;
    });
    const cats = CATEGORY_ORDER.filter(c => counts[c]);
    const all = [
      {key:"TODAS", label:"Todas", n: recipes.length - hiddenIds.size - lowContentCount - mixCount},
      ...cats.map(c => ({key:c, label:catLabel(c), n: counts[c]})),
      {key:"FAV", label:"★ Favoritas", n: favs.size},
    ];
    if (lowContentCount > 0) all.push({key:"REVISAR", label:"⚠️ Revisar", n: lowContentCount});
    if (mixCount > 0) all.push({key:"MIX", label:"🎭 Mix", n: mixCount});
    const tagCounts = {};
    recipes.forEach(r => {
      if (hiddenIds.has(r.id) || isMix(r) || isLowContent(r)) return;
      (r.tags || []).forEach(t => { tagCounts[t] = (tagCounts[t] || 0) + 1; });
    });
    getAllTags().forEach(t => {
      if (tagCounts[t]) all.push({key: "TAG:" + t, label: "🏷️ " + t, n: tagCounts[t]});
    });
    filterOptionsCache = all;
    return all;
  }

  function buildChips() {
    const all = computeFilterOptions();
    const current = all.find(c => c.key === state.cat) ||
      (state.cat.indexOf('TAG:') === 0 ? { label: '🏷️ ' + state.cat.slice(4), n: 0 } : all[0]);
    filterBtn.classList.toggle('active', state.cat !== 'TODAS');
    document.getElementById('filterLabel').textContent = current.label;
    document.getElementById('filterCount').textContent = current.n;
  }

  function openFilterPicker() {
    const all = computeFilterOptions();
    overlayRoot.innerHTML =
      '<div class="overlay" id="ov">' +
        '<div class="sheet" role="dialog" aria-modal="true">' +
          '<div class="sheet-top"><h2>Filtros</h2>' +
          '<button class="close-btn" id="closeBtn" aria-label="Cerrar">✕</button></div>' +
          '<div class="filter-pick-list">' +
            all.map(c => '<button type="button" class="filter-pick-item' + (state.cat === c.key ? ' active' : '') + '" data-cat="' + escapeAttr(c.key) + '">' +
              '<span>' + escapeHtml(c.label) + '</span><span class="n">' + c.n + '</span>' +
            '</button>').join('') +
          '</div>' +
        '</div>' +
      '</div>';
    document.getElementById('closeBtn').addEventListener('click', closeDetail);
    document.getElementById('ov').addEventListener('click', (e) => { if (e.target.id === 'ov') closeDetail(); });
    document.addEventListener('keydown', escClose);
    overlayRoot.querySelectorAll('[data-cat]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.cat = btn.getAttribute('data-cat');

  function render() {
    const filtered = recipes.filter(matches);
    filtered.sort(compareRecipes);
    const shown = filtered.slice(0, state.visible);

    countLine.textContent = filtered.length + (filtered.length === 1 ? ' receta encontrada' : ' recetas encontradas');

    grid.innerHTML = "";
    const frag = document.createDocumentFragment();
    shown.forEach(r => {
      const card = document.createElement('button');
      card.className = 'card';

        '<span class="cart-btn' + (inCart?' on':'') + '" data-cart="' + r.id + '" role="button" aria-label="añadir a la lista de la compra">' + (inCart ? '✓' : '🛒') + '</span>' +
        '<span class="fav-btn' + (isFav?' on':'') + '" data-fav="' + r.id + '" role="button" aria-label="favorita">' + (isFav ? '★' : '☆') + '</span>' +
        '</span></div>' +
        '<button type="button" class="tag" data-cat-filter="' + escapeAttr(r.category) + '">' + catIcon(r.category) + ' ' + escapeHtml(catLabel(r.category)) + '</button>' +
        (rating > 0 ? '<span class="card-rating">' + '★'.repeat(rating) + '</span>' : '');
      card.addEventListener('click', (e) => {
        if (e.target.closest('[data-fav],[data-cart],[data-cook],[data-cat-filter]')) return;
        openDetail(r);
      });
      const cookCardBtn = card.querySelector('[data-cook]');
      if (cookCardBtn) cookCardBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        openCook(r);
      });
      card.querySelector('[data-fav]').addEventListener('click', (e) => {
        e.stopPropagation();
        toggleFav(r.id, e.target);
      });
      card.querySelector('[data-cart]').addEventListener('click', (e) => {
        e.stopPropagation();
        toggleCart(r.id, e.target);
      });
      card.querySelector('[data-cat-filter]').addEventListener('click', (e) => {
        e.stopPropagation();
        filterByCategory(r.category);
      });
      frag.appendChild(card);
    });
    grid.appendChild(frag);

    buildChips();
  }

  function toggleFav(id, el) {
    if (favs.has(id)) { favs.delete(id); el.classList.remove('on'); el.textContent = '☆'; }
    else { favs.add(id); el.classList.add('on'); el.textContent = '★'; }
    saveFavs();
    filterOptionsCache = null; // fav count changed
    if (state.cat === 'FAV') {
      render(); // card must appear/disappear in FAV filter
    } else {
      buildChips(); // just update the filter chip label/count
    }
  }

  function escapeHtml(s) {
    return (s||"").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function formatRichText(s) {
    return escapeHtml(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  }

  // Texto plano de la receta para mandar por WhatsApp/mensajes (negrita estilo WhatsApp: *texto*).
  function recipeShareText(r) {
    const plain = s => String(s).replace(/\*\*(.+?)\*\*/g, '*$1*');
    const parts = ['*' + plain(r.title) + '*'];
    if (r.ingredients && r.ingredients.length) {
      parts.push('*Ingredientes*\n' + r.ingredients.map(i => '• ' + plain(i)).join('\n'));
    }
    if (r.steps && r.steps.length) {
      parts.push('*Elaboración*\n' + r.steps.map((s, i) => (i + 1) + '. ' + plain(s)).join('\n'));
    }
    if (r.tips && r.tips.length) {
      parts.push('*Tips*\n' + r.tips.map(t => '• ' + plain(t)).join('\n'));
    }
    if (r.url) parts.push('Fuente: ' + r.url);
    return parts.join('\n\n');
  }

  // Móvil: abre el menú de compartir del sistema (ahí aparece WhatsApp). Sin menú
  // (ordenador): copia el texto al portapapeles.
  async function shareRecipe(r, btnEl) {
    const text = recipeShareText(r);
    if (navigator.share) {
      try { await navigator.share({ title: r.title, text }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    try {
      await navigator.clipboard.writeText(text);
      const old = btnEl.textContent;
      btnEl.textContent = '✓';
      btnEl.title = 'Receta copiada';
      setTimeout(() => { btnEl.textContent = old; btnEl.title = 'Compartir receta'; }, 2000);
    } catch (e) {
      window.prompt('Copia la receta:', text);
    }
  }

  // ---- Modo cocina -----------------------------------------------------------
  // Pantalla completa para cocinar: ingredientes tachables, pasos de uno en uno con
  // letra grande, temporizadores detectados en el texto de cada paso y pantalla
  // siempre encendida. No guarda nada: es solo una vista de la receta abierta.

  const COOK_SIZE_KEY = 'recetario_cooksize_v1';
  let cook = null;
  let cookTimerSeq = 0;

  // Tiempos de un paso: "20 minutos", "1 h 30 min", "media hora", "10-15 min"...
  // Un rango arranca con el valor menor (mejor revisar antes que pasarse).
  function extractTimers(text) {
    let t = ' ' + String(text).toLowerCase() + ' ';
    const out = [];
    const fmtMin = m => m >= 60 ? Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + (m % 60) + ' min' : '') : m + ' min';
    const unitSecs = w => w[0] === 'h' ? 3600 : w[0] === 'm' ? 60 : 1;
    const unitLabel = s => s === 3600 ? 'h' : s === 60 ? 'min' : 's';
    // menos de 10 s no merece temporizador ("trocea 3 seg")
    const add = (label, seconds) => { if (seconds >= 10 && !out.some(o => o.label === label)) out.push({ label, seconds }); };
    // cada regla "consume" lo que encuentra para que la siguiente no lo cuente dos veces
    const scan = (re, fn) => { t = t.replace(re, (...m) => { fn(m); return ' '.repeat(m[0].length); }); };
    scan(/(\d+)\s*(?:h|horas?)\s*(?:y\s*)?(\d+)\s*min(?:utos?)?\b/g, m => add(fmtMin(+m[1] * 60 + +m[2]), (+m[1] * 60 + +m[2]) * 60));
    scan(/(\d+)\s*h\s*([0-5]\d)(?!\d)/g, m => add(fmtMin(+m[1] * 60 + +m[2]), (+m[1] * 60 + +m[2]) * 60));
    scan(/\bhora y media\b/g, () => add('1 h 30 min', 5400));
    scan(/\bmedia hora\b/g, () => add('30 min', 1800));
    scan(/\bcuarto de hora\b/g, () => add('15 min', 900));
    scan(/(\d+(?:[.,]\d+)?)\s*(?:-|–|—|a|o)\s*(\d+(?:[.,]\d+)?)\s*(horas?|h|minutos?|min|segundos?|seg)\b/g, m => {
      const u = unitSecs(m[3]);
      add(m[1] + '–' + m[2] + ' ' + unitLabel(u), parseFloat(m[1].replace(',', '.')) * u);
    });
    scan(/(\d+(?:[.,]\d+)?)\s*(horas?|h|minutos?|min|segundos?|seg)\b/g, m => {
      const u = unitSecs(m[2]);
      add(m[1] + ' ' + unitLabel(u), parseFloat(m[1].replace(',', '.')) * u);
    });
    scan(/\b(?:un|una)\s+(hora|minuto)\b/g, m => add('1 ' + (m[1] === 'hora' ? 'h' : 'min'), m[1] === 'hora' ? 3600 : 60));
    return out;
  }

  function cookFmt(secs) {
    const s = Math.max(0, Math.ceil(secs));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(ss).padStart(2, '0');
  }

  function cookSize() {
    try { const v = parseInt(localStorage.getItem(COOK_SIZE_KEY), 10); if (v >= 18 && v <= 40) return v; } catch (e) {}
    return 24;
  }

  // Sonido: hay que crear/reanudar el AudioContext en un toque del usuario (al arrancar un temporizador)
  function cookAudioInit() {
    try {
      if (!cook.audio) cook.audio = new (window.AudioContext || window.webkitAudioContext)();
      if (cook.audio.state === 'suspended') cook.audio.resume();
    } catch (e) {}
  }
  function cookBeep() {
    try {
      const ctx = cook && cook.audio; if (!ctx) return;
      [0, 0.28, 0.56].forEach(d => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = 880; g.gain.value = 0.3;
        o.connect(g); g.connect(ctx.destination);
        o.start(ctx.currentTime + d); o.stop(ctx.currentTime + d + 0.16);
      });
    } catch (e) {}
  }
  function cookAlarm() {
    cookBeep();
    try { if (navigator.vibrate) navigator.vibrate([400, 150, 400, 150, 400]); } catch (e) {}
    if (cook.alarmTimer) return;
    cook.alarmTimer = setInterval(() => {
      if (cook && cook.timers.some(t => t.done)) {
        cookBeep();
        try { if (navigator.vibrate) navigator.vibrate([300, 150, 300]); } catch (e) {}
      } else if (cook) { clearInterval(cook.alarmTimer); cook.alarmTimer = null; }
    }, 2500);
  }

  function cookStartTimer(label, seconds, stepNo) {
    cookAudioInit();
    if (cook.timers.some(t => !t.done && t.label === label && t.step === stepNo)) return;
    cook.timers.push({ id: ++cookTimerSeq, label, step: stepNo, endAt: Date.now() + seconds * 1000, done: false });
    cookRenderTimers();
    cookPersist();
  }

  // Estado del modo cocina en el dispositivo: si el móvil cierra la pestaña o recargas,
  // la portada ofrece "Continuar cocinando" en el mismo paso y con los temporizadores
  // (se guarda la hora de fin, así que siguen contando aunque la app estuviera cerrada).
  const COOK_STATE_KEY = 'recetario_cookstate_v1';
  const COOK_STATE_MAX_AGE = 8 * 3600 * 1000;
  function cookPersist() {
    if (!cook) return;
    try {
      localStorage.setItem(COOK_STATE_KEY, JSON.stringify({
        id: cook.r.id, tab: cook.tab, step: cook.step, checked: Array.from(cook.checked),
        timers: cook.timers.map(t => ({ id: t.id, label: t.label, step: t.step, endAt: t.endAt, done: t.done })),
        at: Date.now()
      }));
    } catch (e) {}
  }
  function cookClearSaved() { try { localStorage.removeItem(COOK_STATE_KEY); } catch (e) {} }
  function cookLoadSaved() {
    try {
      const s = JSON.parse(localStorage.getItem(COOK_STATE_KEY) || 'null');
      if (!s || !s.id || Date.now() - (s.at || 0) > COOK_STATE_MAX_AGE) { cookClearSaved(); return null; }
      return s;
    } catch (e) { return null; }
  }
  function showCookResume() {
    const box = document.getElementById('cookResume');
    if (!box) return;
    const s = cook ? null : cookLoadSaved();
    const r = s && recipes.find(x => x.id === s.id);
    // Si la receta aún no está (las añadidas a mano llegan unos instantes después), no se borra nada:
    // se vuelve a intentar al cargarlas. Lo guardado caduca solo a las 8 h.
    if (!r || !r.steps || !r.steps.length) { box.hidden = true; box.innerHTML = ''; return; }
    const running = (s.timers || []).filter(t => !t.done && t.endAt > Date.now()).length;
    const rang = (s.timers || []).filter(t => t.done || t.endAt <= Date.now()).length;
    box.hidden = false;
    box.innerHTML =
      '<span>👩‍🍳 Estabas cocinando <b>' + escapeHtml(r.title) + '</b>' +
        (s.tab === 'steps' ? ' · paso ' + (Math.min(s.step, r.steps.length - 1) + 1) + ' de ' + r.steps.length : '') +
        (running ? ' · ' + running + (running === 1 ? ' temporizador en marcha' : ' temporizadores en marcha') : '') +
        (rang ? ' · ' + rang + (rang === 1 ? ' temporizador ya terminado' : ' temporizadores ya terminados') : '') +
      '</span>' +
      '<span class="cook-resume-btns"><button type="button" class="submit-btn" id="cookResumeGo" style="padding:7px 14px;font-size:13px">Continuar</button>' +
      '<button type="button" class="delete-link" id="cookResumeX">Descartar</button></span>';
    document.getElementById('cookResumeGo').addEventListener('click', () => openCook(r, s));
    document.getElementById('cookResumeX').addEventListener('click', () => { cookClearSaved(); showCookResume(); });
  }

  function cookTick() {
    if (!cook) return;
    let finished = false;
    cook.timers.forEach(t => { if (!t.done && Date.now() >= t.endAt) { t.done = true; finished = true; } });
    if (finished) { cookAlarm(); cookPersist(); }
    cookRenderTimers();
  }

  function cookRenderTimers() {
    const el = document.getElementById('cookTimers');
    if (!el || !cook) return;
    el.hidden = !cook.timers.length;
    el.innerHTML = cook.timers.map(t => '<div class="cook-timer' + (t.done ? ' done' : '') + '">' +
      (t.done
        ? '⏰ ¡Listo! <span>Paso ' + t.step + ' · ' + escapeHtml(t.label) + '</span>'
        : '⏱ ' + cookFmt((t.endAt - Date.now()) / 1000) + ' <span>Paso ' + t.step + ' · ' + escapeHtml(t.label) + '</span>') +
      '<button type="button" data-timer-x="' + t.id + '" aria-label="' + (t.done ? 'Parar aviso' : 'Cancelar temporizador') + '">' + (t.done ? 'Parar' : '✕') + '</button>' +
    '</div>').join('');
    el.querySelectorAll('[data-timer-x]').forEach(b => b.addEventListener('click', () => {
      const id = parseInt(b.getAttribute('data-timer-x'), 10);
      cook.timers = cook.timers.filter(t => t.id !== id);
      cookRenderTimers();
      cookPersist();
    }));
  }

  function cookTotalPages() { return cook.r.steps.length + ((cook.r.tips && cook.r.tips.length) ? 1 : 0); }

  function cookRender() {
    const r = cook.r, steps = r.steps || [], ings = r.ingredients || [];
    const body = document.getElementById('cookBody'), nav = document.getElementById('cookNav');
    document.getElementById('cookTabIng').classList.toggle('active', cook.tab === 'ing');
    document.getElementById('cookTabSteps').classList.toggle('active', cook.tab === 'steps');
    if (cook.tab === 'ing') {
      body.innerHTML = '<ul class="cook-ing">' + ings.map((l, i) =>
        '<li class="' + (cook.checked.has(i) ? 'done' : '') + '"><label><input type="checkbox" data-ing="' + i + '"' + (cook.checked.has(i) ? ' checked' : '') + '><span>' + formatRichText(l) + '</span></label></li>'
      ).join('') + '</ul>';
      body.querySelectorAll('[data-ing]').forEach(cb => cb.addEventListener('change', () => {
        const i = parseInt(cb.getAttribute('data-ing'), 10);
        if (cb.checked) cook.checked.add(i); else cook.checked.delete(i);
        cb.closest('li').classList.toggle('done', cb.checked);
        cookPersist();
      }));
      nav.innerHTML = '<button type="button" class="primary" id="cookGo">Empezar a cocinar →</button>';
      document.getElementById('cookGo').addEventListener('click', () => { cook.tab = 'steps'; cook.step = 0; cookRender(); });
    } else {
      const total = cookTotalPages(), i = cook.step;
      if (i < steps.length) {
        const timers = extractTimers(steps[i]);
        body.innerHTML =
          '<div class="cook-step-n">Paso ' + (i + 1) + ' de ' + steps.length + '</div>' +
          '<div class="cook-progress"><div style="width:' + Math.round(((i + 1) / total) * 100) + '%"></div></div>' +
          '<div class="cook-step-text">' + formatRichText(steps[i]) + '</div>' +
          (timers.length ? '<div class="cook-chips">' + timers.map((t, k) =>
            '<button type="button" class="cook-chip" data-t="' + k + '">⏱ ' + escapeHtml(t.label) + '</button>').join('') + '</div>' : '');
        body.querySelectorAll('[data-t]').forEach(b => b.addEventListener('click', () => {
          const t = timers[parseInt(b.getAttribute('data-t'), 10)];
          cookStartTimer(t.label, t.seconds, i + 1);
        }));
      } else {
        body.innerHTML = '<div class="cook-tips"><h3>💡 Tips</h3><ul>' + r.tips.map(t => '<li>' + formatRichText(t) + '</li>').join('') + '</ul></div>';
      }
      const last = i >= total - 1;
      nav.innerHTML =
        '<button type="button" id="cookPrev"' + (i === 0 ? ' disabled' : '') + '>← Anterior</button>' +
        '<button type="button" class="primary" id="cookNext">' + (last ? '✓ Terminar' : 'Siguiente →') + '</button>';
      document.getElementById('cookPrev').addEventListener('click', () => cookGo(-1));
      document.getElementById('cookNext').addEventListener('click', () => { if (last) requestCookClose(); else cookGo(1); });
    }
    body.scrollTop = 0;
    cookRenderTimers();
    cookPersist();
  }

  function cookGo(delta) {
    if (!cook || cook.tab !== 'steps') return;
    const n = cook.step + delta;
    if (n < 0 || n >= cookTotalPages()) return;
    cook.step = n;
    cookRender();
  }

  function cookKey(e) {
    if (e.key === 'Escape') requestCookClose();
    else if (e.key === 'ArrowRight') cookGo(1);
    else if (e.key === 'ArrowLeft') cookGo(-1);
  }

  async function cookWake() {
    try { if (cook && 'wakeLock' in navigator) cook.wake = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => { if (cook && !document.hidden) { cookWake(); cookTick(); } });

  function openCook(r, saved) {
    if (cook || !r.steps || !r.steps.length) return;
    cook = { r, tab: (r.ingredients && r.ingredients.length) ? 'ing' : 'steps', step: 0, checked: new Set(), timers: [], audio: null, wake: null, alarmTimer: null };
    if (saved && saved.id === r.id) {
      // Reanuda donde lo dejaste: mismo paso, ingredientes tachados y temporizadores
      if (saved.tab === 'steps' || !(r.ingredients && r.ingredients.length)) cook.tab = 'steps';
      cook.step = Math.max(0, Math.min(parseInt(saved.step, 10) || 0, cookTotalPages() - 1));
      cook.checked = new Set((saved.checked || []).filter(i => Number.isInteger(i) && i >= 0 && i < (r.ingredients || []).length));
      cook.timers = (saved.timers || []).filter(t => t && typeof t.endAt === 'number').map(t => ({ id: t.id, label: String(t.label || ''), step: t.step, endAt: t.endAt, done: !!t.done }));
      cookTimerSeq = Math.max(cookTimerSeq, ...cook.timers.map(t => t.id || 0));
      cookAudioInit();
    }
    const cookBox = document.getElementById('cookResume');
    if (cookBox) { cookBox.hidden = true; cookBox.innerHTML = ''; }
    history.pushState({ view: 'cook', id: r.id }, '', '#cocina-' + encodeURIComponent(r.id));
    // Escape cierra solo el modo cocina, no la ficha que hay debajo
    document.removeEventListener('keydown', pageEscClose);
    document.addEventListener('keydown', cookKey);
    cookRoot.innerHTML =
      '<div class="cook" id="cookView" role="dialog" aria-modal="true" aria-label="Modo cocina">' +
        '<div class="cook-top">' +
          '<button type="button" class="cook-round" id="cookClose" aria-label="Salir del modo cocina">✕</button>' +
          '<div class="cook-title">' + escapeHtml(r.title) + '</div>' +
          '<button type="button" class="cook-round" id="cookSmaller" aria-label="Letra más pequeña">A−</button>' +
          '<button type="button" class="cook-round" id="cookBigger" aria-label="Letra más grande">A+</button>' +
        '</div>' +
        '<div class="cook-timers" id="cookTimers" hidden></div>' +
        '<div class="cook-tabs">' +
          '<button type="button" class="cook-tab" id="cookTabIng">Ingredientes</button>' +
          '<button type="button" class="cook-tab" id="cookTabSteps">Pasos</button>' +
        '</div>' +
        '<div class="cook-body" id="cookBody"></div>' +
        '<div class="cook-nav" id="cookNav"></div>' +
      '</div>';
    const view = document.getElementById('cookView');
    view.style.setProperty('--cook-size', cookSize() + 'px');
    document.getElementById('cookClose').addEventListener('click', requestCookClose);
    const resize = d => {
      const n = Math.min(40, Math.max(18, cookSize() + d));
      try { localStorage.setItem(COOK_SIZE_KEY, String(n)); } catch (e) {}
      view.style.setProperty('--cook-size', n + 'px');
    };
    document.getElementById('cookSmaller').addEventListener('click', () => resize(-2));
    document.getElementById('cookBigger').addEventListener('click', () => resize(2));
    document.getElementById('cookTabIng').addEventListener('click', () => { cook.tab = 'ing'; cookRender(); });
    document.getElementById('cookTabSteps').addEventListener('click', () => { cook.tab = 'steps'; cookRender(); });
    if (!(r.ingredients && r.ingredients.length)) document.getElementById('cookTabIng').hidden = true;
    // deslizar a izquierda/derecha para cambiar de paso
    let sx = null, sy = null;
    view.addEventListener('touchstart', (e) => { const t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
    view.addEventListener('touchend', (e) => {
      if (sx === null) return;
      const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
      sx = null;
      if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
      cookGo(dx < 0 ? 1 : -1);
    }, { passive: true });
    cook.tick = setInterval(cookTick, 500);
    cookRender();
    cookWake();
  }

  function requestCookClose() {
    if (!cook) return;
    if (cook.timers.some(t => !t.done) && !window.confirm('Hay temporizadores en marcha. ¿Salir del modo cocina?')) return;
    history.back(); // el popstate cierra la vista y deja la ficha como estaba
  }

  function closeCookUI() {
    if (!cook) return;
    clearInterval(cook.tick);
    clearInterval(cook.alarmTimer);
    try { if (cook.wake) cook.wake.release(); } catch (e) {}
    try { if (cook.audio) cook.audio.close(); } catch (e) {}
    cookRoot.innerHTML = '';
    document.removeEventListener('keydown', cookKey);
    if (currentDetailId) document.addEventListener('keydown', pageEscClose);
    cook = null;
    cookClearSaved(); // salida deliberada: no hay nada que reanudar
  }

  function starsHtml(rating, interactive) {
    let out = '<span class="rating-stars"' + (interactive ? ' id="ratingStars"' : '') + '>';
    for (let i = 1; i <= 5; i++) {
      out += '<span class="star' + (i <= rating ? ' on' : '') + '"' + (interactive ? ' data-n="' + i + '" role="button" aria-label="' + i + ' estrellas"' : '') + '>' + (i <= rating ? '★' : '☆') + '</span>';
    }
    return out + '</span>';
  }

  function bodyHtml(r) {
    let html = '';
    if (r.ingredients && r.ingredients.length) {
      html += '<div class="section-block section-ingredients"><h3>Ingredientes</h3><ul>' + r.ingredients.map(i => '<li>' + formatRichText(i) + '</li>').join('') + '</ul></div>';
    }
    if (r.steps && r.steps.length) {
      html += '<div class="section-block section-steps"><h3>Elaboración</h3><ol>' + r.steps.map(s => '<li>' + formatRichText(s) + '</li>').join('') + '</ol></div>';
    }
    if (r.tips && r.tips.length) {
      html += '<div class="section-block section-tips"><h3>Tips</h3><ul>' + r.tips.map(t => '<li>' + formatRichText(t) + '</li>').join('') + '</ul></div>';
    }
    if (!html) html = '<p style="color:var(--ink-soft)">Sin contenido todavía.</p>';
    return html;
  }

  let igScriptLoading = false;
  function processInstagramEmbeds() {
    if (window.instgrm && window.instgrm.Embeds) {
      window.instgrm.Embeds.process();
      return;
    }
    if (igScriptLoading) return;
    igScriptLoading = true;
    const s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.instagram.com/embed.js';
    s.onload = () => { if (window.instgrm) window.instgrm.Embeds.process(); };
    document.body.appendChild(s);
  }

  // La foto/vídeo va al final de la ficha, así que normalmente queda fuera de la
  // vista inicial: se difiere la carga del script de Instagram (y la creación de
  // su iframe) hasta que el hueco del embed entra en el viewport.
  function lazyLoadInstagramEmbed() {
    const el = document.querySelector('#detailPage .ig-embed');
    if (!el) return;
    if (!('IntersectionObserver' in window)) { processInstagramEmbeds(); return; }
    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        processInstagramEmbeds();
        io.disconnect();
      });
    }, { rootMargin: '200px' });
    io.observe(el);
  }

  let currentDetailId = null;
  let currentDetailEditing = false;

  function openDetail(r, editing) {
    history.pushState({ view: 'detail', id: r.id }, '', '#receta-' + encodeURIComponent(r.id));
    renderDetailPage(r, editing);
  }

  function renderDetailPage(r, editing) {
    currentDetailEditing = editing;
    currentDetailId = r.id;
    const isFav = favs.has(r.id);
    const inCart = cart.has(r.id);
    const rating = myRatings[r.id] || 0;
    const note = myNotes[r.id] || '';
    const titleBlock = editing
      ? '<input type="text" id="editTitle" class="edit-title-input" value="' + escapeAttr(r.title) + '">'
      : '<h2>' + escapeHtml(r.title) + '</h2>';
    const bodyBlock = editing
      ? '<div class="edit-toolbar"><button type="button" id="boldBtn" class="bold-btn" title="Negrita">B</button><span class="form-hint">Selecciona texto y pulsa B para ponerlo en negrita · un elemento por línea</span></div>' +
        '<p style="margin:2px 0 10px; display:flex; align-items:center; gap:10px; flex-wrap:wrap">' +
          '<button type="button" class="delete-link" id="aiCleanExistingBtn">✨ Limpiar con IA</button>' +
          '<button type="button" class="delete-link" id="normalizeBtn">✨ Ordenar receta</button>' +
          '<span class="form-hint" id="aiExistingStatus"></span>' +
        '</p>' +
        '<label class="edit-section-label" for="editIngredients">Ingredientes</label>' +
        '<textarea id="editIngredients" class="edit-text-input" style="min-height:110px">' + escapeHtml((r.ingredients||[]).join('\n')) + '</textarea>' +
        '<label class="edit-section-label" for="editSteps">Elaboración</label>' +
        '<textarea id="editSteps" class="edit-text-input" style="min-height:160px">' + escapeHtml((r.steps||[]).join('\n')) + '</textarea>' +
        '<label class="edit-section-label" for="editTips">Tips</label>' +
        '<textarea id="editTips" class="edit-text-input" style="min-height:80px">' + escapeHtml((r.tips||[]).join('\n')) + '</textarea>'
      : '<div class="body-text">' + bodyHtml(r) + '</div>';
    const isInstagramUrl = !!(r.url && r.url.indexOf('instagram.com') !== -1);
    const photoBlock = (!editing && isInstagramUrl)
      ? '<div class="ig-embed"><blockquote class="instagram-media" data-instgrm-permalink="' + escapeAttr(r.url) + '" data-instgrm-version="14"><a href="' + escapeAttr(r.url) + '"></a></blockquote></div>'
      : '';
    pageRoot.innerHTML =
      '<div class="recipe-page" id="detailPage">' +
        '<div class="page-top">' +
          '<button class="back-btn" id="backBtn" aria-label="Volver">←</button>' + titleBlock +
        '</div>' +
        '<div class="meta-row">' +
          (canEdit
            ? '<select class="cat-select" id="catSelect" aria-label="Cambiar categoría">' +
                CATEGORY_ORDER.map(c => '<option value="' + escapeAttr(c) + '"' + (c === r.category ? ' selected' : '') + '>' + escapeHtml(catLabel(c)) + '</option>').join('') +
              '</select>'
            : '<button type="button" class="tag" data-cat-filter="' + escapeAttr(r.category) + '">' + catIcon(r.category) + ' ' + escapeHtml(catLabel(r.category)) + '</button>') +
          '<span style="display:flex; gap:10px; margin-left:auto">' +

  function getAllTags() {
    const set = new Set();

  }

  // Forma "oficial" de una etiqueta: la variante ya existente (sin distinguir mayúsculas
  // ni acentos) que más recetas usa; si no existe ninguna, el texto tal cual.
  function tagCanonical(val, exclude) {
    const counts = {};
    recipes.forEach(x => (x.tags || []).forEach(t => { counts[t] = (counts[t] || 0) + 1; }));
    const matches = Object.keys(counts).filter(t => t !== exclude && norm(t) === norm(val));
    if (!matches.length) return val;
    return matches.sort((a, b) => counts[b] - counts[a] || a.localeCompare(b, 'es'))[0];
  }

  }
  function tagChipsHtml(r) {
    return (r.tags || []).map(t => '<span class="tag-chip">' + escapeHtml(t) + '<button type="button" class="tag-chip-x" data-tag="' + escapeAttr(t) + '" aria-label="Quitar etiqueta ' + escapeAttr(t) + '">×</button></span>').join('');
  }
  // Etiquetas que ya usas en otras recetas y esta aún no tiene (las más usadas primero)
  function tagSuggestHtml(r) {
    const have = new Set((r.tags || []).map(norm));
    const counts = {};
    recipes.forEach(x => (x.tags || []).forEach(t => { counts[t] = (counts[t] || 0) + 1; }));
    const list = Object.keys(counts).filter(t => !have.has(norm(t)))
      .sort((a, b) => counts[b] - counts[a] || a.localeCompare(b, 'es')).slice(0, 12);
    if (!list.length) return '';
    return '<span class="tag-suggest-lbl">Usadas:</span>' +
      list.map(t => '<button type="button" class="tag-sug" data-tag-add="' + escapeAttr(t) + '">+ ' + escapeHtml(t) + '</button>').join('');
  }

  // Admite varias separadas por coma. Reutiliza la forma ya existente de una etiqueta
  // (sin distinguir mayúsculas ni acentos) para no acabar con "Navidad" y "navidad".
  function commitTags(r, raw) {
    const all = getAllTags();
    const current = (r.tags || []).slice();
    let added = false;
    String(raw).split(',').map(s => s.trim().replace(/\s+/g, ' ').slice(0, 30)).filter(Boolean).forEach(val => {
      const canon = tagCanonical(val);
      if (!current.some(t => norm(t) === norm(canon))) { current.push(canon); added = true; }
    });
    if (added) saveTags(r, current);
    return added;
  }

  // ---- "Ordenar receta": revision ANTES/DESPUES de la normalizacion con IA -------
  // EXTRACCION (clean-recipe, fetch-instagram) = que dice la fuente.
  // NORMALIZACION (esto) = como estructuramos mejor ese contenido, sin cambiarlo.
  // La IA nunca escribe directamente en la receta: solo rellena este panel de
  // revision, y unicamente "Aplicar cambios" copia el resultado a los campos de
  // edicion (que a su vez requieren "Guardar cambios" para persistir).

  // Diff clasico por lineas (LCS) sobre arrays de strings: cada elemento del array
  // (un ingrediente, un paso) se trata como una linea a comparar.
  function diffArrays(oldArr, newArr) {
    const n = oldArr.length, m = newArr.length;
    const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
    for (let i = n - 1; i >= 0; i--) {
      for (let j = m - 1; j >= 0; j--) {
        dp[i][j] = oldArr[i] === newArr[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
      }
    }
    const result = [];
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (oldArr[i] === newArr[j]) { result.push({ type: 'same', text: oldArr[i] }); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) { result.push({ type: 'removed', text: oldArr[i] }); i++; }
      else { result.push({ type: 'added', text: newArr[j] }); j++; }
    }
    while (i < n) { result.push({ type: 'removed', text: oldArr[i] }); i++; }
    while (j < m) { result.push({ type: 'added', text: newArr[j] }); j++; }
    return result;
  }

  function extractNumberTokens(text) {
    return (text.match(/\d+(?:[.,]\d+)?/g) || []);
  }

  // Comprobacion automatica anti-invencion: si una linea nueva contiene un numero
  // que no aparecia en ningun sitio de esa misma seccion en el original, se marca
  // como sospechosa (posible cantidad, tiempo o temperatura inventada).
  function renderDiffBlock(sectionLabel, oldArr, newArr) {
    const entries = diffArrays(oldArr, newArr);
    const oldNums = new Set(extractNumberTokens(oldArr.join('\n')));
    let anyInvented = false;
    const rows = entries.map(entry => {
      if (entry.type === 'same') return '<li class="diff-line diff-same">' + escapeHtml(entry.text) + '</li>';
      if (entry.type === 'removed') return '<li class="diff-line diff-removed">' + escapeHtml(entry.text) + '</li>';
      const invented = extractNumberTokens(entry.text).some(n => !oldNums.has(n));
      if (invented) anyInvented = true;
      return '<li class="diff-line diff-added' + (invented ? ' diff-suspicious' : '') + '">' +
        escapeHtml(entry.text) + (invented ? ' <span class="diff-warn-badge">⚠️ número nuevo</span>' : '') +
        '</li>';
    }).join('');
    const html = '<div class="normalize-diff-block"><h4>' + escapeHtml(sectionLabel) + '</h4>' +
      '<ul class="normalize-diff-list">' + (rows || '<li class="form-hint">(sin cambios)</li>') + '</ul></div>';
    return { html, anyInvented };
  }

  function openNormalizeReview(before, after, onApply) {
    // Se suspende temporalmente el cierre-con-Escape de la ficha de receta mientras
    // este panel esta abierto, para que Escape cierre solo el panel y no toda la ficha.
    document.removeEventListener('keydown', pageEscClose);
    function closeReview() {
      overlayRoot.innerHTML = '';
      document.removeEventListener('keydown', reviewEscClose);
      document.addEventListener('keydown', pageEscClose);
    }
    function reviewEscClose(e) { if (e.key === 'Escape') closeReview(); }

    const blocks = [
      renderDiffBlock('Título', [before.title || ''], [after.title || '']),
      renderDiffBlock('Ingredientes', before.ingredients || [], after.ingredients || []),
      renderDiffBlock('Elaboración', before.steps || [], after.steps || []),
      renderDiffBlock('Tips', before.tips || [], after.tips || []),
    ];
    const anyInvented = blocks.some(b => b.anyInvented);
    overlayRoot.innerHTML =
      '<div class="overlay" id="normOv">' +
        '<div class="sheet" role="dialog" aria-modal="true">' +
          '<div class="sheet-top"><h2>Revisa los cambios</h2>' +
          '<button class="close-btn" id="normCloseBtn" aria-label="Cerrar">✕</button></div>' +
          '<p class="form-hint">En rojo lo anterior, en verde lo nuevo. Solo se aplica si pulsas "Aplicar cambios".</p>' +
          (anyInvented
            ? '<p class="normalize-warning">⚠️ Alguna línea añade números que no estaban en el original (posibles cantidades, tiempos o temperaturas inventadas). Revísala con atención antes de aplicar.</p>'
            : '') +
          blocks.map(b => b.html).join('') +
          '<p style="margin-top:16px; display:flex; gap:10px; justify-content:flex-end">' +
            '<button type="button" class="delete-link" id="discardNormalizeBtn">Descartar</button>' +
            '<button type="button" class="submit-btn" id="applyNormalizeBtn">Aplicar cambios</button>' +
          '</p>' +
        '</div>' +
      '</div>';
    document.getElementById('normCloseBtn').addEventListener('click', closeReview);
    document.getElementById('discardNormalizeBtn').addEventListener('click', closeReview);
    document.getElementById('normOv').addEventListener('click', (e) => { if (e.target.id === 'normOv') closeReview(); });
    document.getElementById('applyNormalizeBtn').addEventListener('click', () => { onApply(); closeReview(); });
    document.addEventListener('keydown', reviewEscClose);
  }

  async function verifyPasscode(code) {
    try {
      const res = await fetch(API_BASE + '?verify=1', { headers: { 'X-Passcode': code } });
      const j = await res.json();
      return !!j.valid;
    } catch (e) { return false; }
  }

  async function apiGetCollection(collection) {
    const headers = {};
    const code = getStoredPasscode();
    if (code) headers['X-Passcode'] = code;
    try {
      const res = await fetch(API_BASE + '?collection=' + encodeURIComponent(collection), { headers });
      if (!res.ok) return null;
      const j = await res.json();
      return j.docs || [];
    } catch (e) { console.error('fetch error', collection, e); return null; }
  }

  async function apiSetDoc(collection, docId, data) {
    const code = getStoredPasscode();
    if (!code) return false;
    try {
      const res = await fetch(API_BASE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ collection, doc_id: docId, data, passcode: code })
      });
      return res.ok;
    } catch (e) { console.error('write error', collection, docId, e); return false; }
  }

  // Sondeo de colecciones compartidas. Para gastar poca red y batería:
  // - no consulta con la pestaña oculta ni sin conexión (al volver, se pone al día al instante);
  // - si falla la petición no toca nada (antes una caída de red vaciaba ocultas/categorías);
  // - si los datos son idénticos a la consulta anterior, no repinta la lista.
  const pollers = {};
  function pollTick(name) {
    const p = pollers[name];
    if (!p || p.busy || document.hidden || navigator.onLine === false) return Promise.resolve();
    p.busy = true;
    return apiGetCollection(name).then(docs => {
      p.last = Date.now();
      if (docs === null) return;
      const sig = JSON.stringify(docs);
      if (sig === p.sig) return;
      p.sig = sig;
      p.applyFn(docs);
    }).catch(e => console.error('poll error', name, e)).then(() => { p.busy = false; });
  }
  function startPolling(name, applyFn, intervalMs) {
    if (pollTimers[name]) clearInterval(pollTimers[name]);
    pollers[name] = { applyFn, intervalMs, last: 0, sig: null, busy: false };
    pollTick(name);
    pollTimers[name] = setInterval(() => pollTick(name), intervalMs);
  }
  function stopPolling(name) {
    if (pollTimers[name]) { clearInterval(pollTimers[name]); delete pollTimers[name]; }
    delete pollers[name];
  }
  function pollCatchUp() {
    Object.keys(pollers).forEach(name => { if (Date.now() - pollers[name].last >= pollers[name].intervalMs) pollTick(name); });
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) pollCatchUp(); });
  window.addEventListener('online', pollCatchUp);

  function applyOverridesDocs(docs) {
    for (const k of Object.keys(dbOverrides)) delete dbOverrides[k];
    docs.forEach(d => { if (d.data && d.data.category) dbOverrides[d.id] = d.data.category; });
    applyOverrides();
    render();
  }
  function applyManualDocs(docs) {
    const ids = new Set(docs.map(d => d.id));
    recipes = recipes.filter(r => !(r.manual && !ids.has(r.id)));
    docs.forEach(d => upsertManualLocal(d.id, d.data));
    applyOverrides();
    updateStats();
    render();
    showCookResume();
  }
  function applyHiddenDocs(docs) {
    hiddenIds.clear();
    docs.forEach(d => { if (d.data && d.data.hidden) hiddenIds.add(d.id); });
    filterOptionsCache = null;
    updateStats();
    render();
  }
  function applyNotesDocs(docs) {
    for (const k of Object.keys(myRatings)) delete myRatings[k];
    for (const k of Object.keys(myNotes)) delete myNotes[k];
    docs.forEach(d => {
      const data = d.data || {};
      if (data.rating) myRatings[d.id] = data.rating;
      myNotes[d.id] = data.note || '';
    });
    render();
  }
  function applyEditsDocs(docs) {
    for (const k of Object.keys(textEdits)) delete textEdits[k];
    docs.forEach(d => { const data = d.data; if (data) textEdits[d.id] = { title: data.title, ingredients: data.ingredients||[], steps: data.steps||[], tips: data.tips||[] }; });
    applyOverrides();
    render();
  }
  function applyTagsDocs(docs) {
    for (const k of Object.keys(dbTags)) delete dbTags[k];
    docs.forEach(d => { if (d.data && Array.isArray(d.data.tags)) dbTags[d.id] = d.data.tags; });
    applyOverrides();
    render();
    if (currentDetailId && !currentDetailEditing) {
      const r = recipes.find(x => x.id === currentDetailId);
      if (r) refreshTagUI(r);
    }
  }
  function applyPlanDocs(docs) {
    plan = {};
    docs.forEach(d => { plan[d.id] = (d.data && d.data.recipeId) || ''; });
    if (planViewOpen) openPlanView();
  }

  function upsertManualLocal(id, data) {
    const obj = {
      id,
      title: (data && data.title) || 'Receta guardada',
      category: (data && data.category) || 'Otras',
      ingredients: (data && data.ingredients) || [],
      steps: (data && data.steps) || [],
      tips: (data && data.tips) || [],
      url: (data && data.url) || '',
      manual: true
    };
    const idx = recipes.findIndex(x => x.id === id);
    if (idx >= 0) recipes[idx] = obj; else recipes.push(obj);
  }

    async function runIgImport(igUrl) {
      igImportBtn.disabled = true;
      igStatus.textContent = 'Descargando la página…';
      igStatus.style.color = '';
      // Always pre-fill the URL field with the pasted link
      const urlEl = document.getElementById('f_url');
      if (urlEl && igUrl) urlEl.value = igUrl;
      // Instagram sigue usando fetch-instagram (sin tocar); cualquier otro enlace
      // usa fetch-url, que intenta datos estructurados (JSON-LD) antes de caer al
      // texto en bruto + limpieza con IA, igual que ya hacía el caption de Instagram.
      const endpoint = isInstagramUrl(igUrl) ? IG_API_BASE : URL_API_BASE;
      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: igUrl, passcode: getStoredPasscode() || '' })
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || 'No se pudo obtener la página.');

        if (data.mode === 'structured') {
          // Datos ya estructurados (schema.org/Recipe del propio sitio): se rellenan
          // los campos directamente, sin pasar por ninguna IA.
          structuredFields.hidden = false;
          document.getElementById('f_title').value = data.title || '';

          document.getElementById('f_steps').value = (data.steps || []).join('\n');

          const rawEl = document.getElementById('f_raw');
          rawEl.value = data.caption || '';
          igStatus.textContent = 'Texto extraído. Limpiando con IA…';
          igStatus.style.color = '';
          await runAiClean(data.caption);
          igStatus.textContent = 'Importado. Revisa y ajusta antes de guardar.';
        }
      } catch (err) {
        // El sitio no sirve el contenido automáticamente (bloqueo, login, etc.) —
        // el enlace ya está guardado en el campo URL, el usuario copia el texto a mano
        igStatus.innerHTML = '⚠️ No se pudo extraer el texto automáticamente de ese enlace. ' +

      } finally {
        igImportBtn.disabled = false;
      }
    }
