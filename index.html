<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harina, huevo y pan rallao</title>
<meta name="description" content="Harina, huevo y pan rallao: recetas de mi madre, de mi abuela y de Instagram. Cocina como antes pero ahora.">
<meta name="theme-color" content="#EFEFE3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1C15" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Harina, huevo y pan rallao">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Karla:wght@400;500;600;700&family=Dancing+Script:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --paper: #EFEFE3;
    --card: #F9F9F1;
    --ink: #262519;
    --ink-soft: #5B5A4A;
    --line: rgba(38,37,25,0.14);
    --accent: #3F5E33;
    --accent-ink: #F4F6EE;
    --accent-2: #B9702E;
    --accent-2-soft: rgba(185,112,46,0.14);
    --accent-soft: rgba(63,94,51,0.12);
    --shadow: 0 1px 2px rgba(38,37,25,0.06);
    --focus: #B9702E;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1A1C15;
      --card: #22241C;
      --ink: #ECEBDD;
      --ink-soft: #ABA994;
      --line: rgba(236,235,221,0.14);
      --accent: #8FBF78;
      --accent-ink: #14200F;
      --accent-2: #E6A15B;
      --accent-2-soft: rgba(230,161,91,0.16);
      --accent-soft: rgba(143,191,120,0.14);
      --shadow: 0 1px 2px rgba(0,0,0,0.3);
      --focus: #E6A15B;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1A1C15;
    --card: #22241C;
    --ink: #ECEBDD;
    --ink-soft: #ABA994;
    --line: rgba(236,235,221,0.14);
    --accent: #8FBF78;
    --accent-ink: #14200F;
    --accent-2: #E6A15B;
    --accent-2-soft: rgba(230,161,91,0.16);
    --accent-soft: rgba(143,191,120,0.14);
    --shadow: 0 1px 2px rgba(0,0,0,0.3);
    --focus: #E6A15B;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html { height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Karla', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom);
  }
  h1, h2, h3, .display {
    font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
    font-weight: 600;
    text-wrap: balance;
    letter-spacing: -0.01em;
  }

  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 20px 80px; padding-top: calc(28px + env(safe-area-inset-top)); }

  header.top {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 22px;
  }
  h1.title {
    font-family: 'Dancing Script', cursive;
    font-weight: 700;
    font-size: clamp(38px, 8vw, 56px);
    margin: 2px 0 4px;
    font-style: normal;
  }
  .subtitle {
    font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif;
    color: var(--ink-soft);
    font-size: 14.5px;
    margin: 0;
  }
  .stats {
    margin-top: 10px;
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    font-variant-numeric: tabular-nums;
  }
  .stat { font-size: 13px; color: var(--ink-soft); }
  .stat b { color: var(--ink); font-size: 15px; font-weight: 700; }

  .controls {
    position: sticky;
    top: 0;
    background: var(--paper);
    padding: 14px 0 12px;
    padding-top: calc(14px + env(safe-area-inset-top));
    margin-top: calc(-1 * env(safe-area-inset-top));
    z-index: 5;
    border-bottom: 1px solid var(--line);
    margin-bottom: 18px;
  }
  .search-row {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .searchbox {
    position: relative;
    flex: 1;
    min-width: 160px;
  }
  .add-btn {
    flex: none;
    font: inherit;
    font-size: 13.5px;
    font-weight: 700;
    padding: 0 16px;
    border-radius: 10px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
    white-space: nowrap;
  }
  .add-btn:hover { opacity: .92; }
  .add-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .cart-toggle-btn {
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
  }
  .cart-toggle-btn #cartCount {
    background: var(--accent-2);
    color: var(--accent-ink);
    border-radius: 999px;
    padding: 1px 7px;
    font-size: 12px;
    margin-left: 2px;
  }
  .count-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .count-row .count-line { margin: 0; }
  .surprise-btn {
    flex: none;
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
    cursor: pointer;
  }
  .surprise-btn:hover { background: var(--accent); color: var(--accent-ink); }
  .surprise-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .cart-btn { flex: none; background: none; border: none; cursor: pointer; font-size: 16px; line-height: 1; color: var(--line); padding: 2px; }
  .cart-btn.on { color: var(--accent); }
  .cart-item { display: flex; flex-direction: column; gap: 6px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .cart-item:last-child { border-bottom: none; }
  .cart-item-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .cart-item-top h3 { font-size: 16px; margin: 0; font-weight: 600; }
  .cart-remove { background: none; border: none; color: var(--ink-soft); cursor: pointer; font-size: 13px; text-decoration: underline; padding: 0; }
  .cart-ingredients { font-size: 13.5px; color: var(--ink); line-height: 1.55; white-space: pre-wrap; }
  .cart-empty-hint { color: var(--ink-soft); font-size: 13.5px; }
  .searchbox input {
    width: 100%;
    font: inherit;
    font-size: 16px;
    padding: 12px 14px 12px 40px;
    border-radius: 999px;
    border: 1.5px solid var(--ink-soft);
    background: var(--card);
    color: var(--ink);
  }
  .searchbox input:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 1px;
  }
  .searchbox svg {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-soft);
    pointer-events: none;
  }
  .filter-row { display: flex; }
  .filter-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font: inherit;
    font-size: 13.5px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink-soft);
    cursor: pointer;
    transition: background .12s, color .12s, border-color .12s;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--ink); }
  .filter-btn .n { font-variant-numeric: tabular-nums; opacity: .75; }
  .filter-btn.active {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }
  .filter-btn.active .n { opacity: .85; }
  .sort-select {
    font: inherit;
    font-size: 13.5px;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink-soft);
    cursor: pointer;
  }
  .sort-select:hover { border-color: var(--accent); color: var(--ink); }
  .sort-select:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .filter-pick-list { display: flex; flex-direction: column; gap: 6px; max-height: 65vh; overflow-y: auto; }
  .filter-pick-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    font: inherit;
    font-size: 14.5px;
    font-weight: 600;
    text-align: left;
    padding: 11px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
  }
  .filter-pick-item:hover { border-color: var(--accent); }
  .filter-pick-item.active {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }
  .filter-pick-item .n { font-variant-numeric: tabular-nums; opacity: .8; }
  .chip:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 15px 13px;
    cursor: pointer;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 8px;
    text-align: left;
    font: inherit;
    color: inherit;
  }
  .card:hover { border-color: var(--accent); }
  .card:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .card h3 {
    font-size: 17px;
    margin: 0;
    line-height: 1.28;
    font-weight: 500;
  }
  .fav-btn {
    flex: none;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    color: var(--line);
    padding: 2px;
  }
  .fav-btn.on { color: var(--accent-2); }
  .tag {
    align-self: flex-start;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--accent-2-soft);
    color: var(--accent-2);
  }
  button.tag { border: none; cursor: pointer; font-family: inherit; }
  button.tag:hover { background: var(--accent-2); color: var(--accent-ink); }
  button.tag:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
  }
  .empty .display { font-size: 22px; color: var(--ink); margin-bottom: 6px; }

  .loadmore {
    display: block;
    margin: 26px auto 0;
    font: inherit;
    font-weight: 700;
    font-size: 14px;
    padding: 11px 22px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
  }
  .loadmore:hover { border-color: var(--accent); }

  .count-line { color: var(--ink-soft); font-size: 13px; margin: 0 0 14px; }

  /* detail overlay */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(20,20,12,0.45);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 30;
  }
  @media (min-width: 640px) {
    .overlay { align-items: center; padding: 24px; }
  }
  .sheet {
    background: var(--paper);
    width: 100%;
    max-width: 640px;
    max-height: 88vh;
    border-radius: 18px 18px 0 0;
    overflow-y: auto;
    padding: 22px 22px 30px;
    padding-bottom: calc(30px + env(safe-area-inset-bottom));
    position: relative;
    border: 1px solid var(--line);
  }
  @media (min-width: 640px) {
    .sheet { border-radius: 16px; }
  }
  .sheet-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
  .sheet h2, .recipe-page h2 { font-size: 24px; margin: 0; font-style: italic; }
  .close-btn {
    flex: none;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--ink-soft);
  }

  /* recipe detail: full page, not an overlay sheet */
  .recipe-page {
    position: fixed; inset: 0;
    background: var(--paper);
    z-index: 40;
    overflow-y: auto;
    padding: 16px 20px 30px;
    padding-top: calc(16px + env(safe-area-inset-top));
    padding-bottom: calc(30px + env(safe-area-inset-bottom));
  }
  .recipe-page .page-top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .recipe-page .page-top h2, .recipe-page .page-top .edit-title-input { flex: 1; }
  .ig-embed { display: flex; justify-content: center; margin: 22px 0 16px; padding-top: 20px; border-top: 1px solid var(--line); min-height: 60px; }
  .ig-embed iframe { max-width: 100%; }
  .back-btn {
    flex: none;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--ink);
    font-size: 18px;
    line-height: 1;
  }

  .sheet .meta-row, .recipe-page .meta-row { display: flex; align-items: center; gap: 10px; margin: 10px 0 16px; flex-wrap: wrap; }
  .sheet .body-text, .recipe-page .body-text {
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink);
  }
  .body-text h3 {
    font-family: 'Karla', ui-sans-serif, system-ui, sans-serif;
    font-size: 12.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .03em;
    color: var(--ink-soft);
    margin: 18px 0 8px;
  }
  .body-text h3:first-child { margin-top: 0; }
  .body-text h3::before {
    content: "";
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 2px;
    margin-right: 7px;
    vertical-align: middle;
    background: currentColor;
  }
  .body-text ul, .body-text ol { margin: 0; padding-left: 22px; }
  .body-text li { margin-bottom: 7px; line-height: 1.55; }
  .body-text .section-block { margin-bottom: 22px; }
  .body-text .section-block:last-child { margin-bottom: 0; }

  .section-ingredients h3 { color: var(--accent); }
  .section-ingredients ul { list-style: none; padding-left: 0; }
  .section-ingredients li { position: relative; padding-left: 20px; }
  .section-ingredients li::before {
    content: "";
    position: absolute; left: 2px; top: 8px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
  }

  .section-steps ol { list-style: none; padding-left: 0; counter-reset: step; }
  .section-steps li {
    position: relative;
    padding-left: 34px;
    counter-increment: step;
    margin-bottom: 14px;
  }
  .section-steps li::before {
    content: counter(step);
    position: absolute; left: 0; top: -1px;
    width: 23px; height: 23px;
    border-radius: 50%;
    background: var(--paper);
    border: 1.5px solid var(--ink-soft);
    color: var(--ink);
    font-family: 'Karla', ui-sans-serif, system-ui, sans-serif;
    font-size: 12px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
  }

  .section-tips {
    background: var(--accent-2-soft);
    border-left: 3px solid var(--accent-2);
    border-radius: 4px 10px 10px 4px;
    padding: 14px 16px;
  }
  .section-tips h3 { color: var(--accent-2); margin-top: 0; }
  .section-tips ul { list-style: none; padding-left: 0; }
  .section-tips li { display: flex; gap: 8px; align-items: flex-start; }
  .section-tips li::before {
    content: "→";
    color: var(--accent-2);
    font-weight: 700;
    flex-shrink: 0;
  }
  .edit-section-label { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--ink-soft); display: block; margin: 14px 0 6px; }
  .edit-section-label:first-of-type { margin-top: 0; }
  .cat-select {
    font: inherit;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .03em;
    text-transform: uppercase;
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid var(--accent-2);
    background: var(--accent-2-soft);
    color: var(--accent-2);
    cursor: pointer;
  }
  .cat-select:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  .edit-title-input {
    font-family: 'Fraunces', Georgia, serif;
    font-style: italic;
    font-size: 22px;
    font-weight: 600;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 10px;
    width: 100%;
    margin-right: 8px;
  }
  .edit-title-input:focus-visible { outline: 2px solid var(--focus); }
  .edit-toolbar { display: flex; align-items: center; gap: 10px; margin: 10px 0 6px; }
  .bold-btn {
    font-family: Georgia, serif;
    font-weight: 700;
    font-size: 14px;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
  }
  .bold-btn:hover { border-color: var(--accent); }
  .edit-text-input {
    width: 100%;
    min-height: 220px;
    font: inherit;
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    resize: vertical;
  }
  .edit-text-input:focus-visible { outline: 2px solid var(--focus); }
  .rating-stars { display: inline-flex; gap: 2px; }
  .rating-stars .star { cursor: pointer; font-size: 17px; color: var(--line); }
  .rating-stars .star.on { color: var(--accent-2); }
  .notes-box { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .notes-row { display: flex; align-items: center; justify-content: space-between; }
  .notes-label { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--ink-soft); }
  .notes-box textarea {
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--card);
    min-height: 70px;
    resize: vertical;
  }
  .notes-box textarea:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .notes-box input[type="text"] {
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    padding: 9px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--card);
  }
  .notes-box input[type="text"]:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .tag-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag-chips:empty { display: none; }
  .tag-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12.5px;
    font-weight: 600;
    padding: 4px 6px 4px 10px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .tag-chip-x {
    font: inherit;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--accent);
    opacity: .7;
    font-size: 14px;
    line-height: 1;
    padding: 2px;
  }
  .tag-chip-x:hover { opacity: 1; }
  .tag-pills-row { display: flex; flex-wrap: wrap; gap: 6px; margin: -4px 0 14px; }
  .tag-pill {
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
    cursor: pointer;
  }
  .tag-pill:hover { background: var(--accent); color: var(--accent-ink); }
  .card-rating { font-size: 12px; color: var(--accent-2); letter-spacing: 1px; }

  .normalize-warning {
    font-size: 13.5px;
    font-weight: 600;
    padding: 10px 12px;
    border-radius: 8px;
    background: var(--accent-2-soft);
    color: var(--accent-2);
    margin: 4px 0 14px;
  }
  .normalize-diff-block { margin-bottom: 16px; }
  .normalize-diff-block h4 {
    font-family: 'Karla', ui-sans-serif, system-ui, sans-serif;

  .add-form { display: flex; flex-direction: column; gap: 14px; margin-top: 14px; }

  }
  .submit-btn:hover { opacity: .92; }
  .form-hint { font-size: 12.5px; color: var(--ink-soft); font-weight: 400; }
  .delete-link { font-size: 13px; color: var(--ink-soft); background: none; border: none; cursor: pointer; text-decoration: underline; padding: 0; }

  /* ── Shopping list items ─────────────────────────────── */
  .sl-item { display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--line); }
  .sl-item:last-child { border-bottom:none; }
  .sl-check { flex:none; width:22px; height:22px; accent-color:var(--accent); cursor:pointer; min-width:22px; }

  .sl-text { font-size:15px; line-height:1.35; word-break:break-word; }
  .sl-item.done .sl-text { text-decoration:line-through; opacity:.5; }
  .sl-sources { font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .sl-actions { display:flex; gap:4px; flex:none; }
  .sl-btn { background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:16px; padding:4px 6px; border-radius:6px; line-height:1; min-width:32px; min-height:32px; display:flex; align-items:center; justify-content:center; }
  .sl-btn:hover { background:var(--accent-soft); color:var(--accent); }
  .sl-edit-row { display:flex; gap:8px; margin-top:6px; }
  .sl-edit-inp { flex:1; font:inherit; font-size:14px; padding:6px 10px; border-radius:8px; border:1.5px solid var(--accent); background:var(--card); color:var(--ink); }
  .sl-section-hdr { font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin:18px 0 8px; padding-bottom:6px; border-bottom:1px solid var(--line); }
  .sl-add-row { display:flex; gap:8px; margin-top:12px; }
  .sl-add-inp { flex:1; font:inherit; font-size:15px; padding:10px 12px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
  .sl-add-inp:focus-visible { outline:2px solid var(--focus); outline-offset:1px; }
  .sl-clear-row { margin: 10px 0 0; display: flex; gap: 16px; flex-wrap: wrap; }
  .sl-clear-all-btn { color: var(--accent-2); font-weight: 700; }
  .confirm-clear-box {
    margin-top: 12px;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid var(--accent-2);
    background: var(--accent-2-soft);
  }
  .confirm-clear-title { margin: 0 0 4px; font-weight: 700; color: var(--ink); }
  .confirm-clear-text { margin: 0 0 12px; font-size: 13.5px; color: var(--ink-soft); }
  .confirm-clear-actions { display: flex; gap: 18px; align-items: center; }
  .confirm-clear-actions .delete-link { padding: 8px 2px; font-size: 14px; }
  .confirm-clear-actions .sl-clear-all-btn { padding: 8px 2px; }

  /* review modal checkboxes */

  .review-item:last-child { border-bottom:none; }
  .review-check { flex:none; width:22px; height:22px; margin-top:1px; accent-color:var(--accent); cursor:pointer; }
  .review-body { flex:1; min-width:0; }
  .review-text { font-size:15px; line-height:1.35; word-break:break-word; }
  .review-sources { font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .review-del { flex:none; background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:16px; padding:4px 6px; min-width:32px; min-height:32px; }

  .plan-toolbar { display: flex; gap: 10px; margin: 4px 0 16px; flex-wrap: wrap; }

  .plan-slot { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .plan-day:last-child .plan-slot:last-child { border-bottom: none; }
  .plan-slot-sub { padding: 5px 0 8px; opacity: .75; }
  .plan-slot-sub .plan-slot-recipe { font-size: 13px; }

  .plan-slot-label { flex: none; width: 62px; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--ink-soft); }

  .plan-slot-recipe:hover { color: var(--accent); text-decoration: underline; }

<body>
<div class="wrap">
  <header class="top">
    <h1 class="title">Harina, huevo y pan rallao</h1>
    <p class="subtitle">Recetas de mi madre, de mi abuela y de Instagram. Cocina como antes pero ahora.</p>
    <div class="stats">
      <span class="stat"><b id="statTotal">–</b> recetas</span>
      <span class="stat"><b id="statCats">–</b> categorías</span>
      <span class="stat"><b id="statFav">0</b> favoritas</span>
    </div>
  </header>

  <div class="controls">
    <div class="search-row">
      <div class="searchbox">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
        <input id="search" type="text" placeholder="Buscar por nombre, ingrediente…" autocomplete="off" inputmode="search" enterkeyhint="search">
      </div>
      <button class="add-btn cart-toggle-btn" id="cartBtn" type="button">🛒 Lista <span id="cartCount" hidden></span></button>
      <button class="add-btn cart-toggle-btn" id="planBtn" type="button">📅 Plan semanal</button>
      <button class="add-btn cart-toggle-btn" id="editModeBtn" type="button">🔒 Modo edición</button>
      <button class="add-btn" id="addRecipeBtn" type="button" hidden>+ Añadir receta</button>
    </div>
    <div class="filter-row">
      <button class="filter-btn" id="filterBtn" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="4 4 20 4 14 12.5 14 19 10 21 10 12.5 4 4"/></svg>
        <span id="filterLabel">Filtros</span>
        <span class="n" id="filterCount"></span>
      </button>
      <select class="sort-select" id="sortSelect" aria-label="Ordenar recetas">
        <option value="recent">Más recientes primero</option>
        <option value="oldest">Más antiguas primero</option>
        <option value="az">A–Z</option>
        <option value="za">Z–A</option>
      </select>
    </div>
  </div>

  <div class="count-row">
    <p class="count-line" id="countLine"></p>
    <button class="surprise-btn" id="surpriseBtn" type="button" hidden>🎲 Sorpréndeme</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyState" hidden>
    <div class="display">Aquí no hay nada guardado</div>
    <div>Prueba otra búsqueda o cambia de categoría.</div>
  </div>
  <button class="loadmore" id="loadMore" hidden>Ver más recetas</button>
</div>

<div id="overlayRoot"></div>
<div id="pageRoot"></div>

<script>
(function(){
  const API_BASE = "https://zfqpupvarjbwgcmiomcs.supabase.co/functions/v1/store-api";
  const CLEAN_API_BASE = "https://zfqpupvarjbwgcmiomcs.supabase.co/functions/v1/clean-recipe";
  const IG_API_BASE = "https://zfqpupvarjbwgcmiomcs.supabase.co/functions/v1/fetch-instagram";
  const NORMALIZE_API_BASE = "https://zfqpupvarjbwgcmiomcs.supabase.co/functions/v1/normalize-recipe";
  const PASSKEY = "recetario_passcode_v1";

  const CATEGORY_ORDER = ["Entrantes y Aperitivos","Sopas y Cremas","Ensaladas","Carne","Pescado","Verduras","Pasta","Arroces","Pizzas","Sandwiches y Bocadillos","Salsas","Postres","Desayunos","Bebe","Otras"];
  const CATEGORY_LABEL = { "Sandwiches y Bocadillos": "Sándwiches y Bocadillos", "Verduras": "Recetas con Verduras", "Bebe": "Recetas Bebé" };
  function catLabel(c) { return CATEGORY_LABEL[c] || c; }
  const CATEGORY_ICON = {
    "Entrantes y Aperitivos": "🥟",
    "Sopas y Cremas": "🍲",
    "Ensaladas": "🥗",
    "Carne": "🥩",
    "Pescado": "🐟",
    "Verduras": "🥦",
    "Pasta": "🍝",
    "Arroces": "🍚",
    "Pizzas": "🍕",
    "Sandwiches y Bocadillos": "🥪",
    "Salsas": "🧂",
    "Postres": "🍰",
    "Desayunos": "🍳",
    "Bebe": "🍼",
    "Otras": "🍽️"
  };
  function catIcon(c) { return CATEGORY_ICON[c] || "🍽️"; }
  const FAVKEY = "recetario_favs_v1";
  const CARTKEY = "recetario_cart_v1";
  const SLKEY = "recetario_sl_v1";
  const SORTKEY = "recetario_sort_v1";
  const SORT_OPTIONS = ["recent", "oldest", "az", "za"];
  const PAGE_SIZE = 39;

  function loadSortPref() {
    try {
      const v = localStorage.getItem(SORTKEY);
      return SORT_OPTIONS.indexOf(v) !== -1 ? v : "recent";
    } catch (e) { return "recent"; }
  }

  let recipes = [];
  let favs = new Set();
  try { favs = new Set(JSON.parse(localStorage.getItem(FAVKEY) || "[]")); } catch(e) {}
  let cart = new Set();
  try { cart = new Set(JSON.parse(localStorage.getItem(CARTKEY) || "[]")); } catch(e) {}
  let shoppingItems = [];
  try { shoppingItems = JSON.parse(localStorage.getItem(SLKEY) || "[]"); } catch(e) {}

  let state = { q: "", cat: "TODAS", visible: PAGE_SIZE, sort: loadSortPref() };

  const grid = document.getElementById('grid');
  const filterBtn = document.getElementById('filterBtn');
  filterBtn.addEventListener('click', () => openFilterPicker());
  const sortEl = document.getElementById('sortSelect');
  sortEl.value = state.sort;
  sortEl.addEventListener('change', () => {
    state.sort = SORT_OPTIONS.indexOf(sortEl.value) !== -1 ? sortEl.value : "recent";
    try { localStorage.setItem(SORTKEY, state.sort); } catch (e) {}
    state.visible = PAGE_SIZE;
    render();
  });
  const searchEl = document.getElementById('search');
  const countLine = document.getElementById('countLine');
  const emptyState = document.getElementById('emptyState');
  const loadMoreBtn = document.getElementById('loadMore');
  const overlayRoot = document.getElementById('overlayRoot');
  const pageRoot = document.getElementById('pageRoot');
  const addRecipeBtn = document.getElementById('addRecipeBtn');
  addRecipeBtn.addEventListener('click', () => openAddForm());
  const cartBtn = document.getElementById('cartBtn');
  cartBtn.addEventListener('click', () => openCart());
  const planBtn = document.getElementById('planBtn');
  planBtn.addEventListener('click', () => openPlanView());
  const editModeBtn = document.getElementById('editModeBtn');
  editModeBtn.addEventListener('click', () => openPasscodeForm());
  const surpriseBtn = document.getElementById('surpriseBtn');
  surpriseBtn.addEventListener('click', () => surpriseMe());

  function saveFavs() {
    try { localStorage.setItem(FAVKEY, JSON.stringify([...favs])); } catch(e) {}
    document.getElementById('statFav').textContent = favs.size;
  }

  function saveShoppingItems() {
    try { localStorage.setItem(SLKEY, JSON.stringify(shoppingItems)); } catch(e) {}
    updateCartBtn();
  }

  function updateCartBtn() {
    const pending = shoppingItems.filter(x => !x.checked).length;
    const countEl = document.getElementById('cartCount');
    if (pending > 0) {
      countEl.textContent = pending;
      countEl.hidden = false;
    } else {
      countEl.hidden = true;
    }
  }

  function slId() { return 'sl' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }

  function saveCart() {
    try { localStorage.setItem(CARTKEY, JSON.stringify([...cart])); } catch(e) {}
    updateCartBtn();
  }

  function toggleCart(id, el) {
    if (cart.has(id)) { cart.delete(id); el.classList.remove('on'); el.textContent = '🛒'; }
    else { cart.add(id); el.classList.add('on'); el.textContent = '✓'; }
    saveCart();
  }
  saveCart();
  updateCartBtn(); // reflect saved shopping items on boot

  function surpriseMe() {
    const filtered = recipes.filter(matches);
    if (!filtered.length) return;
    const pick = filtered[Math.floor(Math.random() * filtered.length)];
    openDetail(pick);
  }

  function norm(s) {
    return (s || "").toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  }

  function hasRealRecipeContent(r) {
    return (r.ingredients && r.ingredients.length > 0) || (r.steps && r.steps.length > 0);
  }

  function isLowContent(r) {
    return !hasRealRecipeContent(r);
  }

  function searchHaystack(r) {
    return norm(r.title) + " " + norm(catLabel(r.category)) + " " + norm((r.ingredients||[]).join(' ')) + " " + norm((r.steps||[]).join(' ')) + " " + norm((r.tips||[]).join(' '));
  }

  const SYNONYM_GROUPS = [
    ["pasta","espague","macarron","tallarin","tagliatelle","fideo","lasagna","lasana","canelon","raviol","gnocchi","noqui","penne","fusilli","spaghetti","linguine","fetuccin","tortellini"],
    ["legumbre","garbanzo","alubia","lenteja"],
    ["carne","pollo","pavo","ternera","cerdo","vacuno","cordero","buey"],
    ["pescado","marisco","salmon","atun","merluza","bacalao","lubina","gamba","langostino","mejillon","calamar","pulpo","sepia","sardina","trucha","boqueron"]
  ];

  function expandTerm(word) {
    for (const group of SYNONYM_GROUPS) {
      if (group.some(g => word.includes(g) || g.includes(word))) return group;
    }
    return null;
  }

  function titleCatHaystack(r) {
    return norm(r.title) + " " + norm(catLabel(r.category));
  }

  function queryMatchesRecipe(normalizedQuery, r) {
    const words = normalizedQuery.split(/\s+/).filter(Boolean);
    if (!words.length) return true;
    const fullHay = searchHaystack(r);
    const titleHay = titleCatHaystack(r);
    return words.every(w => {
      const group = expandTerm(w);
      if (group) return group.some(v => titleHay.includes(v));
      return fullHay.includes(w);
    });
  }

  function isMix(r) { return !!r.mix; }

  // Fecha de incorporación a la app, derivada del id (sin depender de campos que no existen
  // en recipes.json ni de la fecha de edición/Instagram):
  // - recetas importadas en el volcado inicial: "n<numero>", el número refleja el orden de
  //   importación -> se usa como orden relativo (tier 0), nunca como fecha real.
  // - recetas añadidas a mano desde la app: "m" + Date.now().toString(36) (8 chars) + sufijo
  //   aleatorio -> el timestamp real de creación se puede decodificar (tier 1, siempre más
  //   recientes que el volcado inicial). Editar una receta no cambia su id, así que su orden
  //   de creación no se ve afectado por ediciones posteriores.
  const ES_COLLATOR = new Intl.Collator('es', { sensitivity: 'base' });
  function createdAtRank(r) {
    const m = /^m([0-9a-z]{8})/.exec(r.id);
    if (m) {
      const ts = parseInt(m[1], 36);
      if (!isNaN(ts)) return { tier: 1, key: ts };
    }
    const n = /^n(\d+)$/.exec(r.id);
    if (n) return { tier: 0, key: parseInt(n[1], 10) };
    return { tier: 0, key: 0 };
  }
  function compareCreatedAsc(a, b) {
    const ra = createdAtRank(a), rb = createdAtRank(b);
    if (ra.tier !== rb.tier) return ra.tier - rb.tier;
    return ra.key - rb.key;
  }
  function compareRecipes(a, b) {
    switch (state.sort) {
      case 'az': return ES_COLLATOR.compare(a.title, b.title);
      case 'za': return ES_COLLATOR.compare(b.title, a.title);
      case 'oldest': return compareCreatedAsc(a, b);
      case 'recent': default: return compareCreatedAsc(b, a);
    }
  }

  function matches(r) {
    if (hiddenIds.has(r.id)) return false;
    if (state.cat === "MIX") { if (!isMix(r)) return false; }
    else {
      if (isMix(r)) return false;
      if (isLowContent(r) && state.cat !== "REVISAR") return false;
      if (state.cat === "FAV") { if (!favs.has(r.id)) return false; }
      else if (state.cat === "REVISAR") { if (!isLowContent(r)) return false; }
      else if (state.cat.indexOf("TAG:") === 0) {
        const tagName = state.cat.slice(4);
        if (!r.tags || r.tags.indexOf(tagName) === -1) return false;
      }
      else if (state.cat !== "TODAS" && r.category !== state.cat) return false;
    }
    if (state.q) {
      if (!queryMatchesRecipe(state.q, r)) return false;
    }
    return true;
  }

  function computeFilterOptions() {
    const counts = {};
    let lowContentCount = 0;
    let mixCount = 0;
    recipes.forEach(r => {
      if (hiddenIds.has(r.id)) return;
      if (isMix(r)) { mixCount++; return; }
      if (isLowContent(r)) { lowContentCount++; return; }
      counts[r.category] = (counts[r.category]||0) + 1;
    });
    const cats = CATEGORY_ORDER.filter(c => counts[c]);
    const all = [
      {key:"TODAS", label:"Todas", n: recipes.length - hiddenIds.size - lowContentCount - mixCount},
      ...cats.map(c => ({key:c, label:catLabel(c), n: counts[c]})),
      {key:"FAV", label:"★ Favoritas", n: favs.size},
    ];
    if (lowContentCount > 0) all.push({key:"REVISAR", label:"⚠️ Revisar", n: lowContentCount});
    if (mixCount > 0) all.push({key:"MIX", label:"🎭 Mix", n: mixCount});
    const tagCounts = {};
    recipes.forEach(r => {
      if (hiddenIds.has(r.id) || isMix(r) || isLowContent(r)) return;
      (r.tags || []).forEach(t => { tagCounts[t] = (tagCounts[t] || 0) + 1; });
    });
    getAllTags().forEach(t => {
      if (tagCounts[t]) all.push({key: "TAG:" + t, label: "🏷️ " + t, n: tagCounts[t]});
    });
    return all;
  }

  function buildChips() {
    const all = computeFilterOptions();
    const current = all.find(c => c.key === state.cat) || all[0];
    filterBtn.classList.toggle('active', state.cat !== 'TODAS');
    document.getElementById('filterLabel').textContent = current.label;
    document.getElementById('filterCount').textContent = current.n;
  }

  function openFilterPicker() {
    const all = computeFilterOptions();
    overlayRoot.innerHTML =
      '<div class="overlay" id="ov">' +
        '<div class="sheet" role="dialog" aria-modal="true">' +
          '<div class="sheet-top"><h2>Filtros</h2>' +
          '<button class="close-btn" id="closeBtn" aria-label="Cerrar">✕</button></div>' +
          '<div class="filter-pick-list">' +
            all.map(c => '<button type="button" class="filter-pick-item' + (state.cat === c.key ? ' active' : '') + '" data-cat="' + escapeAttr(c.key) + '">' +
              '<span>' + escapeHtml(c.label) + '</span><span class="n">' + c.n + '</span>' +
            '</button>').join('') +
          '</div>' +
        '</div>' +
      '</div>';
    document.getElementById('closeBtn').addEventListener('click', closeDetail);
    document.getElementById('ov').addEventListener('click', (e) => { if (e.target.id === 'ov') closeDetail(); });
    document.addEventListener('keydown', escClose);
    overlayRoot.querySelectorAll('[data-cat]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.cat = btn.getAttribute('data-cat');
        state.visible = PAGE_SIZE;
        render();
        closeDetail();
      });
    });
  }

  function render() {
    const filtered = recipes.filter(matches);
    filtered.sort(compareRecipes);
    const shown = filtered.slice(0, state.visible);

    countLine.textContent = filtered.length + (filtered.length === 1 ? ' receta encontrada' : ' recetas encontradas');
    emptyState.hidden = filtered.length !== 0;

  let igScriptLoading = false;
  function processInstagramEmbeds() {
    if (window.instgrm && window.instgrm.Embeds) {
      window.instgrm.Embeds.process();
      return;
    }
    if (igScriptLoading) return;
    igScriptLoading = true;
    const s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.instagram.com/embed.js';
    s.onload = () => { if (window.instgrm) window.instgrm.Embeds.process(); };
    document.body.appendChild(s);

  // La foto/vídeo va al final de la ficha, así que normalmente queda fuera de la
  // vista inicial: se difiere la carga del script de Instagram (y la creación de
  // su iframe) hasta que el hueco del embed entra en el viewport.
  function lazyLoadInstagramEmbed() {
    const el = document.querySelector('#detailPage .ig-embed');
    if (!el) return;
    if (!('IntersectionObserver' in window)) { processInstagramEmbeds(); return; }
    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        processInstagramEmbeds();
        io.disconnect();
      });
    }, { rootMargin: '200px' });
    io.observe(el);
  }

  // ---- "Ordenar receta": revision ANTES/DESPUES de la normalizacion con IA -------
  // EXTRACCION (clean-recipe, fetch-instagram) = que dice la fuente.
  // NORMALIZACION (esto) = como estructuramos mejor ese contenido, sin cambiarlo.
  // La IA nunca escribe directamente en la receta: solo rellena este panel de
  // revision, y unicamente "Aplicar cambios" copia el resultado a los campos de
  // edicion (que a su vez requieren "Guardar cambios" para persistir).

  // Diff clasico por lineas (LCS) sobre arrays de strings: cada elemento del array
  // (un ingrediente, un paso) se trata como una linea a comparar.
  function diffArrays(oldArr, newArr) {
    const n = oldArr.length, m = newArr.length;
    const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
    for (let i = n - 1; i >= 0; i--) {
      for (let j = m - 1; j >= 0; j--) {
        dp[i][j] = oldArr[i] === newArr[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
      }
    }
    const result = [];
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (oldArr[i] === newArr[j]) { result.push({ type: 'same', text: oldArr[i] }); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) { result.push({ type: 'removed', text: oldArr[i] }); i++; }
      else { result.push({ type: 'added', text: newArr[j] }); j++; }
    }
    while (i < n) { result.push({ type: 'removed', text: oldArr[i] }); i++; }
    while (j < m) { result.push({ type: 'added', text: newArr[j] }); j++; }
    return result;
  }

  function extractNumberTokens(text) {
    return (text.match(/\d+(?:[.,]\d+)?/g) || []);
  }

  // Comprobacion automatica anti-invencion: si una linea nueva contiene un numero
  // que no aparecia en ningun sitio de esa misma seccion en el original, se marca
  // como sospechosa (posible cantidad, tiempo o temperatura inventada).
  function renderDiffBlock(sectionLabel, oldArr, newArr) {
    const entries = diffArrays(oldArr, newArr);
    const oldNums = new Set(extractNumberTokens(oldArr.join('\n')));
    let anyInvented = false;
    const rows = entries.map(entry => {
      if (entry.type === 'same') return '<li class="diff-line diff-same">' + escapeHtml(entry.text) + '</li>';
      if (entry.type === 'removed') return '<li class="diff-line diff-removed">' + escapeHtml(entry.text) + '</li>';
      const invented = extractNumberTokens(entry.text).some(n => !oldNums.has(n));
      if (invented) anyInvented = true;
      return '<li class="diff-line diff-added' + (invented ? ' diff-suspicious' : '') + '">' +
        escapeHtml(entry.text) + (invented ? ' <span class="diff-warn-badge">⚠️ número nuevo</span>' : '') +
        '</li>';
    }).join('');
    const html = '<div class="normalize-diff-block"><h4>' + escapeHtml(sectionLabel) + '</h4>' +
      '<ul class="normalize-diff-list">' + (rows || '<li class="form-hint">(sin cambios)</li>') + '</ul></div>';
    return { html, anyInvented };
  }

  function openNormalizeReview(before, after, onApply) {
    // Se suspende temporalmente el cierre-con-Escape de la ficha de receta mientras
    // este panel esta abierto, para que Escape cierre solo el panel y no toda la ficha.
    document.removeEventListener('keydown', pageEscClose);
    function closeReview() {
      overlayRoot.innerHTML = '';
      document.removeEventListener('keydown', reviewEscClose);
      document.addEventListener('keydown', pageEscClose);
    }
    function reviewEscClose(e) { if (e.key === 'Escape') closeReview(); }

    const blocks = [
      renderDiffBlock('Título', [before.title || ''], [after.title || '']),
      renderDiffBlock('Ingredientes', before.ingredients || [], after.ingredients || []),
      renderDiffBlock('Elaboración', before.steps || [], after.steps || []),
      renderDiffBlock('Tips', before.tips || [], after.tips || []),
    ];
    const anyInvented = blocks.some(b => b.anyInvented);
    overlayRoot.innerHTML =
      '<div class="overlay" id="normOv">' +
        '<div class="sheet" role="dialog" aria-modal="true">' +
          '<div class="sheet-top"><h2>Revisa los cambios</h2>' +
          '<button class="close-btn" id="normCloseBtn" aria-label="Cerrar">✕</button></div>' +
          '<p class="form-hint">En rojo lo anterior, en verde lo nuevo. Solo se aplica si pulsas "Aplicar cambios".</p>' +
          (anyInvented
            ? '<p class="normalize-warning">⚠️ Alguna línea añade números que no estaban en el original (posibles cantidades, tiempos o temperaturas inventadas). Revísala con atención antes de aplicar.</p>'
            : '') +
          blocks.map(b => b.html).join('') +
          '<p style="margin-top:16px; display:flex; gap:10px; justify-content:flex-end">' +
            '<button type="button" class="delete-link" id="discardNormalizeBtn">Descartar</button>' +
            '<button type="button" class="submit-btn" id="applyNormalizeBtn">Aplicar cambios</button>' +
          '</p>' +
        '</div>' +
      '</div>';
    document.getElementById('normCloseBtn').addEventListener('click', closeReview);
    document.getElementById('discardNormalizeBtn').addEventListener('click', closeReview);
    document.getElementById('normOv').addEventListener('click', (e) => { if (e.target.id === 'normOv') closeReview(); });
    document.getElementById('applyNormalizeBtn').addEventListener('click', () => { onApply(); closeReview(); });
    document.addEventListener('keydown', reviewEscClose);
  }

  // ---- Backend (Supabase edge function) -----------------------------------

  function getStoredPasscode() {
    try { return localStorage.getItem(PASSKEY) || ''; } catch (e) { return ''; }
  }
  function setStoredPasscode(code) {
    try { localStorage.setItem(PASSKEY, code); } catch (e) {}
  }
  function clearStoredPasscode() {
    try { localStorage.removeItem(PASSKEY); } catch (e) {}
  }

  async function verifyPasscode(code) {
    try {
      const res = await fetch(API_BASE + '?verify=1', { headers: { 'X-Passcode': code } });
      const j = await res.json();
      return !!j.valid;
    } catch (e) { return false; }
  }

  async function apiGetCollection(collection) {
    const headers = {};
    const code = getStoredPasscode();
    if (code) headers['X-Passcode'] = code;
    try {
      const res = await fetch(API_BASE + '?collection=' + encodeURIComponent(collection), { headers });
      if (!res.ok) return [];
      const j = await res.json();
      return j.docs || [];
    } catch (e) { console.error('fetch error', collection, e); return []; }
  }

  async function apiSetDoc(collection, docId, data) {
    const code = getStoredPasscode();
    if (!code) return false;
    try {
      const res = await fetch(API_BASE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ collection, doc_id: docId, data, passcode: code })
      });
      return res.ok;
    } catch (e) { console.error('write error', collection, docId, e); return false; }
  }

  function startPolling(name, applyFn, intervalMs) {
    if (pollTimers[name]) clearInterval(pollTimers[name]);
    const tick = () => apiGetCollection(name).then(applyFn).catch(e => console.error('poll error', name, e));
    tick();
    pollTimers[name] = setInterval(tick, intervalMs);
  }
  function stopPolling(name) {
    if (pollTimers[name]) { clearInterval(pollTimers[name]); delete pollTimers[name]; }
  }

  function applyOverridesDocs(docs) {
    for (const k of Object.keys(dbOverrides)) delete dbOverrides[k];
    docs.forEach(d => { if (d.data && d.data.category) dbOverrides[d.id] = d.data.category; });
    applyOverrides();
    render();
  }
  function applyManualDocs(docs) {
    const ids = new Set(docs.map(d => d.id));
    recipes = recipes.filter(r => !(r.manual && !ids.has(r.id)));
    docs.forEach(d => upsertManualLocal(d.id, d.data));
    applyOverrides();
    updateStats();
    render();
  }
  function applyHiddenDocs(docs) {
    hiddenIds.clear();
    docs.forEach(d => { if (d.data && d.data.hidden) hiddenIds.add(d.id); });
    updateStats();
    render();
  }
  function applyNotesDocs(docs) {
    for (const k of Object.keys(myRatings)) delete myRatings[k];
    for (const k of Object.keys(myNotes)) delete myNotes[k];
    docs.forEach(d => {
      const data = d.data || {};
      if (data.rating) myRatings[d.id] = data.rating;
      myNotes[d.id] = data.note || '';
    });
    render();
  }
  function applyEditsDocs(docs) {
    for (const k of Object.keys(textEdits)) delete textEdits[k];
    docs.forEach(d => { const data = d.data; if (data) textEdits[d.id] = { title: data.title, ingredients: data.ingredients||[], steps: data.steps||[], tips: data.tips||[] }; });
    applyOverrides();
    render();
  }
  function applyTagsDocs(docs) {
    for (const k of Object.keys(dbTags)) delete dbTags[k];
    docs.forEach(d => { if (d.data && Array.isArray(d.data.tags)) dbTags[d.id] = d.data.tags; });
    applyOverrides();
    render();
    if (currentDetailId && !currentDetailEditing) {
      const r = recipes.find(x => x.id === currentDetailId);
      if (r) renderDetailPage(r, false);
    }
  }
  function applyPlanDocs(docs) {
    plan = {};
    docs.forEach(d => { plan[d.id] = (d.data && d.data.recipeId) || ''; });
    if (planViewOpen) openPlanView();
  }

  async function saveEdit(r, newTitle, newIngredients, newSteps, newTips) {
    textEdits[r.id] = { title: newTitle, ingredients: newIngredients, steps: newSteps, tips: newTips };
    r.title = newTitle;
    r.ingredients = newIngredients;
    r.steps = newSteps;
    r.tips = newTips;
    render();
    if (canEdit) await apiSetDoc('edits', r.id, { title: newTitle, ingredients: newIngredients, steps: newSteps, tips: newTips });
  }

  async function changeCategory(r, newCat) {
    if (newCat === r.category) return;
    dbOverrides[r.id] = newCat;
    r.category = newCat;
    render();
    if (canEdit) await apiSetDoc('overrides', r.id, { category: newCat });
  }

  async function saveTags(r, tags) {
    dbTags[r.id] = tags;
    r.tags = tags;
    render();
    if (currentDetailId === r.id) renderDetailPage(r, false);
    if (canEdit) await apiSetDoc('tags', r.id, { tags });
  }

  function filterByTag(tag) {
    state.cat = 'TAG:' + tag;
    state.visible = PAGE_SIZE;
    render();
    history.back();
  }

  function filterByCategory(cat) {
    state.cat = cat;
    state.visible = PAGE_SIZE;
    render();
    if (currentDetailId) history.back();
  }

  function upsertManualLocal(id, data) {
    const obj = {
      id,
      title: (data && data.title) || 'Receta guardada',
      category: (data && data.category) || 'Otras',
      ingredients: (data && data.ingredients) || [],
      steps: (data && data.steps) || [],
      tips: (data && data.tips) || [],
      url: (data && data.url) || '',
      manual: true
    };
    const idx = recipes.findIndex(x => x.id === id);
    if (idx >= 0) recipes[idx] = obj; else recipes.push(obj);
  }

  async function archiveRecipe(r) {
    hiddenIds.add(r.id);
    history.back();
    updateStats();
    render();
    if (canEdit) await apiSetDoc('hidden', r.id, { hidden: true });
  }

  async function saveRating(id, rating) {
    myRatings[id] = rating;
    if (rating === 0) delete myRatings[id];
    render();
    if (canEdit) await apiSetDoc('notes', id, { rating, note: myNotes[id] || '' });
  }

  async function saveNote(id, note) {
    myNotes[id] = note;
    if (canEdit) await apiSetDoc('notes', id, { rating: myRatings[id] || 0, note });
  }

  async function saveNewRecipe(recipeData) {
    const id = 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    upsertManualLocal(id, recipeData);
    render();
    if (canEdit) await apiSetDoc('manual_recipes', id, recipeData);
    return id;
  }

  // Bring! (and similar apps) import a recipe by fetching a URL and reading its
  // schema.org/Recipe JSON-LD — it does NOT accept pasted/shared plain text.
  // Each recipe with real content gets its own static page (webapp/r/<id>.html)
  // with that markup; sharing/copying that link is what Bring!'s "add recipe
  // from link" feature actually understands. Manually-added recipes don't have
  // a generated page (they're not in the static build), so we hide the button
  // for those to avoid offering a link that 404s.
  function recipePageUrl(id) {
    return location.origin + '/r/' + id + '.html';
  }

  async function shareRecipeLink(id, title, btnEl) {
    const url = recipePageUrl(id);
    if (navigator.share) {
      try { await navigator.share({ url, title: title || 'Receta' }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    try {
      await navigator.clipboard.writeText(url);
      if (btnEl) { const old = btnEl.textContent; btnEl.textContent = '✓ Enlace copiado'; setTimeout(() => { btnEl.textContent = old; }, 2000); }
    } catch (e) {
      window.prompt('Copia este enlace y pégalo en "Anadir receta" de Bring!:', url);
    }
  }

  // ── Ingredient parsing & grouping ────────────────────────────────────────

  // Canonical unit names
  const UNIT_MAP = {
    kg:'kg', kilo:'kg', kilos:'kg', kilogramo:'kg', kilogramos:'kg',
    g:'g', gr:'g', gramo:'g', gramos:'g',
    mg:'mg',
    l:'l', litro:'l', litros:'l',
    ml:'ml', cl:'cl', dl:'dl',
    taza:'taza', tazas:'taza',
    vaso:'vaso', vasos:'vaso',
    cucharada:'cda', cucharadas:'cda', cda:'cda', cdas:'cda',
    'cucharada sopera':'cda', 'cucharadas soperas':'cda',
    cucharadita:'cdta', cucharaditas:'cdta', cdta:'cdta', cdtas:'cdta',
    lata:'lata', latas:'lata',
    bote:'bote', botes:'bote',
    bolsa:'bolsa', bolsas:'bolsa',
    paquete:'paquete', paquetes:'paquete',
    sobre:'sobre', sobres:'sobre',
    rama:'rama', ramas:'rama',
    diente:'diente', dientes:'diente',
    cabeza:'cabeza', cabezas:'cabeza',
    hoja:'hoja', hojas:'hoja',
    rodaja:'rodaja', rodajas:'rodaja',
    filete:'filete', filetes:'filete',
    pieza:'pieza', piezas:'pieza',
    loncha:'loncha', lonchas:'loncha',
    rebanada:'rebanada', rebanadas:'rebanada',
    puñado:'puñado', puñados:'puñado',
  };

  // Units that convert to a common base for summing
  const CONVERT = { kg: { to:'g', factor:1000 }, l: { to:'ml', factor:1000 }, dl: { to:'ml', factor:100 }, cl: { to:'ml', factor:10 } };

  function parseIngredient(raw) {
    if (!raw || !raw.trim()) return null;
    const line = raw.trim();
    let rest = line;
    let qty = null;
    let unit = null;

    // Try to extract a number (integer, decimal, or fraction)
    const numM = rest.match(/^(\d+(?:[.,]\d+)?(?:\s*\/\s*\d+)?)\s*/);
    if (numM) {
      const ns = numM[1].trim();
      if (ns.includes('/')) { const p = ns.split('/'); qty = parseFloat(p[0]) / parseFloat(p[1]); }
      else { qty = parseFloat(ns.replace(',', '.')); }
      if (isNaN(qty)) qty = null;
      else rest = rest.slice(numM[0].length);
    }

    // Try to extract a unit (only if we found a number)
    if (qty !== null) {
      // Match known units (longest first to avoid "gr" matching before "gramos")
      const unitKeys = Object.keys(UNIT_MAP).sort((a, b) => b.length - a.length);
      for (const u of unitKeys) {
        const re = new RegExp('^' + u.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b\\s*', 'i');
        if (re.test(rest)) {
          unit = UNIT_MAP[u.toLowerCase()];
          rest = rest.replace(re, '');
          break;
        }
      }
      // Skip leading "de " after unit
      rest = rest.replace(/^de\s+/i, '');
    }

    // Normalize unit to base (kg→g, l→ml, etc.)
    if (unit && CONVERT[unit]) { const c = CONVERT[unit]; qty = qty * c.factor; unit = c.to; }

    const name = normalizeName(rest || line);
    return { qty, unit, name, raw: line };
  }

  function normalizeName(s) {
    return (s || '').toLowerCase().trim().replace(/\s+/g, ' ');
  }

  // Returns true if names a and b are likely the same ingredient (singular/plural)
  function sameIngredient(a, b) {
    if (a === b) return true;
    if (a + 's' === b || b + 's' === a) return true;
    if (a + 'es' === b || b + 'es' === a) return true;
    return false;
  }

  function fmtQty(qty) {
    if (qty == null) return '';
    if (Number.isInteger(qty)) return String(qty);
    // Show up to 1 decimal, remove trailing .0
    const s = qty.toFixed(1).replace(/\.0$/, '');
    return s.replace('.', ',');
  }

  function fmtIngredient(qty, unit, name) {
    if (qty == null) return name;
    const q = fmtQty(qty);
    if (unit) {
      // Convert g→kg and ml→l for display when large
      if (unit === 'g' && qty >= 1000) return fmtQty(qty / 1000) + ' kg de ' + name;
      if (unit === 'ml' && qty >= 1000) return fmtQty(qty / 1000) + ' l de ' + name;
      return q + ' ' + unit + ' de ' + name;
    }
    // Count: try to restore plural
    if (qty > 1 && !name.endsWith('s')) {
      const plural = /[aeiouáéíóú]$/i.test(name) ? name + 's' : name + 'es';
      return q + ' ' + plural;
    }
    return q + ' ' + name;
  }

  // Collect all ingredients from the current plan, grouped by recipe
  function collectPlanIngredients() {
    const items = []; // { raw, qty, unit, name, source }
    const allSlotKeys = Object.keys(plan);
    allSlotKeys.forEach(key => {
      const rid = plan[key];
      if (!rid) return;
      const r = recipes.find(x => x.id === rid);
      if (!r || !r.ingredients || !r.ingredients.length) return;
      r.ingredients.forEach(line => {
        const trimmed = (line || '').trim();
        // Skip lines that are clearly cooking steps: end with a period or are very long sentences
        if (trimmed.endsWith('.') || trimmed.length > 80) return;
        // Skip section headers / notes with no quantity (e.g. "Para la salsa:", "Al gusto", "Opcional")
        const lc = trimmed.toLowerCase();
        if (!lc.match(/^\d/) && lc.match(/^(para |según |al |a la |a los |opcional|nota:|para:)/)) return;
        const parsed = parseIngredient(trimmed);
        if (!parsed) return;
        items.push({ ...parsed, source: r.title });
      });
    });
    return items;
  }

  function groupIngredients(items) {
    // Returns [{ text, sources, qty, unit, name }]
    const groups = [];
    for (const item of items) {
      let merged = false;
      for (const g of groups) {
        if (sameIngredient(g.name, item.name) && g.unit === item.unit) {
          // Compatible units — sum if both have qty, else keep separate
          if (g.qty != null && item.qty != null) {
            g.qty += item.qty;
            if (!g.sources.includes(item.source)) g.sources.push(item.source);
            merged = true;
            break;
          }
          if (g.qty == null && item.qty == null) {
            // Both have no qty — just merge sources
            if (!g.sources.includes(item.source)) g.sources.push(item.source);
            merged = true;
            break;
          }
          // One has qty the other doesn't — keep separate
        }
      }
      if (!merged) {
        groups.push({ name: item.name, qty: item.qty, unit: item.unit, sources: [item.source], raw: item.raw });
      }
    }
    return groups.map(g => ({
      text: fmtIngredient(g.qty, g.unit, g.name),
      sources: g.sources,
      qty: g.qty,
      unit: g.unit,
      name: g.name,
    }));
  }

  // Merge new items into shoppingItems (combine compatible duplicates)
  function addToShoppingItems(incoming) {
    for (const inc of incoming) {
      const incParsed = parseIngredient(inc.text);
      let merged = false;
      for (const ex of shoppingItems) {
        if (ex.checked) continue; // don't merge into already-done items
        const exParsed = parseIngredient(ex.text);
        if (!exParsed || !incParsed) continue;
        if (sameIngredient(exParsed.name, incParsed.name) && exParsed.unit === incParsed.unit
            && exParsed.qty != null && incParsed.qty != null) {
          const newQty = exParsed.qty + incParsed.qty;
          ex.text = fmtIngredient(newQty, exParsed.unit, exParsed.name);
          const newSources = [...(ex.sources || [])];
          (inc.sources || []).forEach(s => { if (!newSources.includes(s)) newSources.push(s); });
          ex.sources = newSources;
          merged = true;
          break;
        }
      }
      if (!merged) {
        shoppingItems.push({ id: slId(), text: inc.text, checked: false, sources: inc.sources || [] });
      }
    }
    saveShoppingItems();
  }

              '<input type="text" class="sl-add-inp" id="reviewAddInp" placeholder="Añadir otro ingrediente…">' +

            '</div>' +

            '</p>' +
          '</div>' +
        '</div>';

        });

        el.addEventListener('click', () => {

  function renderShoppingItems() {
    if (!shoppingItems.length) return '<p class="cart-empty-hint" style="margin:0 0 6px">La lista está vacía. Genera una desde el plan semanal o añade productos aquí.</p>';
    return shoppingItems.map(item => {
      const srcHtml = (item.sources && item.sources.length)
        ? '<div class="sl-sources">Para: ' + escapeHtml(item.sources.join(', ')) + '</div>'
        : '';
      return '<div class="sl-item' + (item.checked ? ' done' : '') + '" data-slid="' + item.id + '">' +
        '<input type="checkbox" class="sl-check" data-slchk="' + item.id + '" aria-label="Marcar"' + (item.checked ? ' checked' : '') + '>' +
        '<div class="sl-body">' +

          srcHtml +
          '<div class="sl-edit-row" id="sledit_' + item.id + '" hidden>' +
            '<input type="text" class="sl-edit-inp" value="' + escapeAttr(item.text) + '" data-slval="' + item.id + '">' +
            '<button type="button" class="submit-btn" data-slsave="' + item.id + '" style="padding:6px 12px;font-size:13px;flex:none">OK</button>' +
          '</div>' +

        '<div class="sl-actions">' +
          '<button type="button" class="sl-btn" data-sledit="' + item.id + '" title="Editar">✏️</button>' +
          '<button type="button" class="sl-btn" data-sldel="' + item.id + '" title="Eliminar">✕</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function bindShoppingListEvents() {
    overlayRoot.querySelectorAll('[data-slchk]').forEach(el => {
      el.addEventListener('change', () => {
        const item = shoppingItems.find(x => x.id === el.getAttribute('data-slchk'));
        if (item) { item.checked = el.checked; saveShoppingItems(); renderCartOverlay(); }
      });
    });
    overlayRoot.querySelectorAll('[data-sledit]').forEach(el => {
      el.addEventListener('click', () => {
        const id = el.getAttribute('data-sledit');
        const row = document.getElementById('sledit_' + id);
        if (row) { row.hidden = !row.hidden; if (!row.hidden) row.querySelector('input').focus(); }
      });
    });
    overlayRoot.querySelectorAll('[data-slsave]').forEach(el => {
      el.addEventListener('click', () => {
        const id = el.getAttribute('data-slsave');
        const inp = overlayRoot.querySelector('[data-slval="' + id + '"]');
        const item = shoppingItems.find(x => x.id === id);
        if (item && inp) { item.text = inp.value.trim() || item.text; saveShoppingItems(); renderCartOverlay(); }
      });
    });
    overlayRoot.querySelectorAll('[data-sldel]').forEach(el => {
      el.addEventListener('click', () => {
        const id = el.getAttribute('data-sldel');
        shoppingItems = shoppingItems.filter(x => x.id !== id);
        saveShoppingItems();
        renderCartOverlay();
      });
    });
    const addInp = document.getElementById('slAddInp');
    const addBtn = document.getElementById('slAddBtn');
    if (addBtn && addInp) {
      const doAdd = () => {
        const val = addInp.value.trim();
        if (!val) return;
        shoppingItems.push({ id: slId(), text: val, checked: false, sources: [] });
        saveShoppingItems();
        addInp.value = '';
        renderCartOverlay();
        overlayRoot.querySelector('.sheet').scrollTop = 0;
      };
      addBtn.addEventListener('click', doAdd);
      addInp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); doAdd(); } });
    }
    const clearDoneBtn = document.getElementById('slClearDoneBtn');
    if (clearDoneBtn) {
      clearDoneBtn.addEventListener('click', () => {
        shoppingItems = shoppingItems.filter(x => !x.checked);
        saveShoppingItems();
        renderCartOverlay();
      });
    }
    // "Vaciar lista": borra solo shoppingItems (pendientes + comprados + manuales +
    // generados desde el plan). No toca `cart` (recetas guardadas para Bring!), ni
    // `plan`, ni `recipes`, ni `favs` - son estados completamente independientes.
    const clearListBtn = document.getElementById('clearListBtn');
    if (clearListBtn) {
      clearListBtn.addEventListener('click', () => {
        confirmClearListOpen = true;
        renderCartOverlay();
      });
    }
    const cancelClearListBtn = document.getElementById('cancelClearListBtn');
    if (cancelClearListBtn) {
      cancelClearListBtn.addEventListener('click', () => {
        confirmClearListOpen = false;
        renderCartOverlay();
      });
    }
    const confirmClearListBtn = document.getElementById('confirmClearListBtn');
    if (confirmClearListBtn) {
      confirmClearListBtn.addEventListener('click', () => {
        shoppingItems = [];
        confirmClearListOpen = false;
        saveShoppingItems();
        renderCartOverlay();
      });
    }
  }

  function openCart() { confirmClearListOpen = false; renderCartOverlay(); }
